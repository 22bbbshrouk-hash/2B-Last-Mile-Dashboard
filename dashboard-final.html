<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2B | Last Mile Operations Control Tower</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%2307090d'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-family='Arial' font-size='30' font-weight='900' fill='%23ff7900'%3E2B%3C/text%3E%3C/svg%3E"></head><body style="margin:0;background:#07090d"><script>(async()=>{const base='https://raw.githubusercontent.com/22bbbshrouk-hash/2B-Last-Mile-Dashboard/e934624ddcbf2a3adc82066ba3913f075bf69f2d/dashboard-final.html';try{const r=await fetch(base+'?v=stable',{cache:'no-store'});if(!r.ok)throw Error();let h=await r.text();const fix=`<script>(function(){function E(v){return String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[m]))}function N(v){return String(v??'').normalize('NFKC').toLowerCase().replace(/[\\u064B-\\u065F\\u0670]/g,'').replace(/[\\s_\\-()./]/g,'').replace(/ى/g,'ي').replace(/ة/g,'ه').trim()}const groups=[['New Cairo',['القاهرة الجديدة','التجمع','التجمع الاول','التجمع الأول','التجمع الثالث','التجمع الخامس','الرحاب']],['October / Zayed',['6 أكتوبر','السادس من أكتوبر','حدائق اكتوبر','حدائق أكتوبر','حدائق الاهرام','حدائق الأهرام','الشيخ زايد','زايد']],['Central Cairo',['الضاهر','شبرا مصر','وسط البلد','باب الشعرية','دار السلام','السيدة زينب']],['East Cairo',['العاصمة الادارية الجديدة','العاصمة الإدارية الجديدة','الشروق','العبور','مدينتي','بدر']],['Maadi / Helwan / Mokattam',['المعادي','المعادى','المقطم','حلوان','زهراء المعادي','مايو','15 مايو']],['Mohandeseen / Ard El Lewa',['المهندسين','أرض اللواء','ارض اللواء','بولاق الدكرور','الزمالك']],['Nasr City / Heliopolis',['جسر السويس','عين شمس- الشرقية','عين شمس','مدينة نصر','مصر الجديدة','النزهة','روكسي','حدائق القبة','الزيتون','المطرية','عزبة النخل']],['Haram / Faisal',['الهرم','فيصل','ترسا','الجيزة','العمرانية']],['North Coast',['الساحل الشمالى','الساحل الشمالي']]];function zone(a){const n=N(a);for(const[g,list]of groups)if(list.some(x=>N(x)===n))return g;return 'Other'}function area(a){const n=N(a);for(const[,list]of groups){const x=list.find(x=>N(x)===n);if(x)return x}return String(a||'غير محدد').trim()||'غير محدد'}function run(){try{const m2=document.getElementById('map2');if(m2){const s=m2.closest('section');if(s)s.remove()}const fb=document.getElementById('feedback');if(fb){const s=fb.closest('section');if(s)s.remove()}if(window.rows&&Array.isArray(rows)){rows.forEach(r=>{r.area=area(r.area);r.zone=zone(r.area);r.search=N(Object.values(r).join(' '))});const rank=document.getElementById('areaRank');if(rank&&typeof filtered==='function'){const m=new Map();filtered().forEach(r=>{const k=N(r.area);if(!m.has(k))m.set(k,{name:r.area,orders:new Set()});if(r.order)m.get(k).orders.add(String(r.order))});const a=[...m.values()].sort((x,y)=>y.orders.size-x.orders.size||x.name.localeCompare(y.name,'ar'));const mx=Math.max(1,...a.map(x=>x.orders.size));rank.innerHTML=a.map(x=>'<div class="areaRow"><div class="areaName">'+E(x.name)+'</div><div class="barbg"><div class="barfill" style="width:'+(x.orders.size/mx*100)+'%"></div></div><div class="count">'+x.orders.size+'</div></div>').join('')||'<div class="empty">لا توجد بيانات</div>'}const d=document.getElementById('details');if(d&&typeof filtered==='function'){const rs=filtered().slice().sort((a,b)=>N(a.zone).localeCompare(N(b.zone),'ar')||N(a.area).localeCompare(N(b.area),'ar')||String(a.order).localeCompare(String(b.order),'ar',{numeric:true}));const t=d.closest('table');const th=t&&t.querySelector('thead tr');if(th)th.innerHTML='<th>Trip Zone</th><th>Area</th><th>Order</th><th>Address</th><th>SKU</th><th>Product</th><th>QTY</th>';d.innerHTML=rs.slice(0,2000).map(r=>'<tr><td>'+E(r.zone)+'</td><td>'+E(r.area)+'</td><td>'+E(r.order)+'</td><td>'+E(r.address)+'</td><td>'+E(r.sku)+'</td><td>'+E(r.product)+'</td><td>'+E(r.qty)+'</td></tr>').join('')||'<tr><td colspan="7" class="empty">لا توجد بيانات</td></tr>'}const follow=document.getElementById('follow');if(follow&&typeof filtered==='function'){const important=new Set(['outfordelivery','readyfordelivery','assigned','pickedup','delivered','noanswer','cancelled','canceled','returned','return','refused','failed']);const m=new Map();filtered().forEach(r=>{if(!r.order)return;const detail=[r.feedback,r.alt,r.note].filter(Boolean).join(' | ');if(important.has(N(r.status))||detail){if(!m.has(String(r.order))||(!m.get(String(r.order))._detail&&detail))m.set(String(r.order),{...r,_detail:detail})}});const t=follow.closest('table'),th=t&&t.querySelector('thead tr');if(th)th.innerHTML='<th>Order</th><th>Zone</th><th>Area</th><th>Address</th><th>Status</th><th>Feedback / Important Detail</th>';follow.innerHTML=[...m.values()].sort((a,b)=>String(a.order).localeCompare(String(b.order),'ar',{numeric:true})).map(r=>'<tr><td>'+E(r.order)+'</td><td>'+E(r.zone)+'</td><td>'+E(r.area)+'</td><td>'+E(r.address)+'</td><td><span class="tag">'+E(r.status)+'</span></td><td style="color:#4da6ff;font-weight:800">'+E(r._detail||'')+'</td></tr>').join('')||'<tr><td colspan="6" class="empty">لا توجد حالات مهمة</td></tr>'}const routes=document.getElementById('routes');if(routes&&typeof filtered==='function'){const zmap=new Map();filtered().forEach(r=>{const z=zone(r.area);if(!zmap.has(z))zmap.set(z,{zone:z,areas:new Set(),orders:new Set(),skus:new Set(),qty:0,ac:0,rows:[]});const v=zmap.get(z);v.areas.add(area(r.area));if(r.order)v.orders.add(String(r.order));if(r.sku)v.skus.add(String(r.sku));v.qty+=Number(r.qty)||0;if(/\\bac\\b|air\\s*condition|تكييف/i.test(String(r.product)))v.ac+=Number(r.qty)||0;v.rows.push(r)});const ordered=[...zmap.values()].sort((a,b)=>{const ai=groups.findIndex(x=>x[0]===a.zone),bi=groups.findIndex(x=>x[0]===b.zone);return(ai<0?999:ai)-(bi<0?999:bi)});routes.innerHTML=ordered.map((z,i)=>{const os=[...z.orders].sort((a,b)=>a.localeCompare(b,'ar',{numeric:true}));const cars=Math.max(1,Math.ceil(z.ac/13));return '<div class="routeCard"><div class="routeHead"><div><div class="routeTitle">🛣️ Route '+String(i+1).padStart(2,'0')+' — '+E(z.zone)+'</div><div class="muted">Areas: '+E([...z.areas].join(' · '))+'</div><div class="muted">Orders: <b>'+os.length+'</b> · SKU: <b>'+z.skus.size+'</b> · QTY: <b>'+z.qty+'</b> · AC: <b>'+z.ac+'</b> / 13 per دبابة</div><div class="routeOrders"><b>Orders:</b> '+os.map(E).join(' · ')+'</div></div><div class="vehicle">🚚 '+cars+' Vehicle'+(cars>1?'s':'')+'</div></div></div>'}).join('')||'<div class="empty">لا توجد بيانات</div>'}}catch(e){console.warn(e)}}setTimeout(run,500);setTimeout(run,1800);setInterval(run,3000);})();</script>`;h=h.replace('</body>',fix+'</body>');document.open();document.write(h);document.close()}catch(e){document.body.innerHTML='<div style="color:#fff;font-family:Arial;padding:30px">تعذر تحميل الداشبورد.</div>'}})();</script></body></html>
