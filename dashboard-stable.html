<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2B Last Mile Operations Control Tower</title></head><body style="margin:0;background:#07090d"><script>(async()=>{const raw='https://raw.githubusercontent.com/22bbbshrouk-hash/2B-Last-Mile-Dashboard/3beed2da32fea969134f62b9aa1f66f586eae31b/dashboard-stable.html';const edge='https://wihopmnjpsfsgujugyzl.supabase.co/functions/v1/upload-dashboard';try{let h=await (await fetch(raw+'?v='+Date.now(),{cache:'no-store'})).text();h=h.replace(/const SOURCES=\[[^\]]*\];/,'const SOURCES=[\''+edge+'\',\'./Last_Mile_Data.xlsx\'];');const s=h.indexOf("document.getElementById('file').addEventListener");const e=h.indexOf("document.getElementById('searchBtn')",s);if(s>=0&&e>s){const x="document.getElementById('file').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=async x=>{document.getElementById('status').textContent='جاري رفع الشيت...';try{const r=await fetch(SOURCES[0],{method:'POST',body:x.target.result});if(!r.ok)throw Error((await r.text())||('HTTP '+r.status));document.getElementById('status').textContent='تم رفع الشيت، جاري تحديث الداشبورد...';await loadCurrent()}catch(err){document.getElementById('status').textContent='فشل رفع الشيت: '+err.message}};rd.readAsArrayBuffer(f)});";h=h.slice(0,s)+x+h.slice(e)}document.open();document.write(h);document.close()}catch(err){document.body.innerHTML='<div style="padding:40px;color:#fff;font-family:Arial">تعذر تحميل الداشبورد: '+String(err.message||err)+'</div>'}})();</script></body></html>
