const norm=v=>String(v??'').normalize('NFKC').toLowerCase().replace(/[\u064B-\u065F\u0670]/g,'').replace(/[\s_\-()./]/g,'').replace(/ى/g,'ي').replace(/ة/g,'ه').trim();
function area(v){let n=norm(v);for(const[,as]of ROUTES)for(const a of as)if(norm(a)===n)return a;return String(v||'غير محدد').trim()||'غير محدد'}
function zone(v){let n=norm(area(v));for(const[z,as]of ROUTES)if(as.some(a=>norm(a)===n))return z;return'غير مصنف'}
function pick(r,as){const ks=Object.keys(r);for(const a of as){const k=ks.find(x=>norm(x)===norm(a));if(k&&String(r[k]).trim()!=='')return r[k]}for(const k of ks)if(as.some(a=>norm(k).includes(norm(a))||norm(a).includes(norm(k)))&&String(r[k]).trim()!=='')return r[k];return''}
function parse(buf){const wb=XLSX.read(buf,{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]];return XLSX.utils.sheet_to_json(ws,{defval:'',raw:false}).map(r=>({order:String(pick(r,['order','order number','order no','ordernumber','orderno','awb','shipment','shipment number','رقم الطلب','الطلب','ref nbr','ref number'])).trim(),area:area(pick(r,['area','area name','region','zone area','المنطقة','المنطقه','area_name','delivery area'])),zone:zone(pick(r,['area','area name','region','zone area','المنطقة','المنطقه','area_name','delivery area'])),feedback:String(pick(r,['feedback','customer feedback','customerfeedback','feedback1','feedback2','ملاحظات','الملاحظات','تعليق العميل','تعليق'])).trim()})).filter(x=>x.order)}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function addMap(){try{const f=document.getElementById('dash');await new Promise((resolve)=>{if(f.contentDocument&&f.contentDocument.readyState==='complete')resolve();else f.addEventListener('load',resolve,{once:true})});const d=f.contentDocument;if(!d||d.getElementById('routeMapSection'))return;let ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),8000);let rr=await fetch(PUBLIC+'?v='+Date.now(),{cache:'no-store',signal:ctl.signal});clearTimeout(tm);if(!rr.ok)return;const rows=parse(await rr.arrayBuffer());const link=d.createElement('link');link.rel='stylesheet';link.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';d.head.appendChild(link);const sec=d.createElement('section');sec.className='card full';sec.id='routeMapSection';sec.innerHTML='<h2>🗺️ Trip Zones & Routes</h2><div class="sub">خريطة خط السير — اضغطي على المنطقة لعرض Orders وFeedback.</div><div id="routeMapOne" style="height:500px;border-radius:12px;overflow:hidden;margin-top:10px"></div>';const grid=d.querySelector('.grid'),routes=d.getElementById('routes')?.closest('section');if(!grid)return;grid.insertBefore(sec,routes||null);const s=d.createElement('script');s.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';s.onload=()=>{try{const L=d.defaultView.L,el=d.getElementById('routeMapOne');if(!L||!el||el._leaflet_id)return;const map=L.map(el).setView([30.02,31.25],10);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);const colors=['#ff7900','#ff9a3d','#f5b56b','#d8dde5','#ff6b35','#b8bec8','#ffb86b','#e6e8ec'],bounds=[];ROUTES.forEach(([z,as],ri)=>{const rs=rows.filter(r=>r.zone===z);if(!rs.length)return;const pts=[];as.forEach((a,idx)=>{const rr=rs.filter(x=>norm(x.area)===norm(a));if(!rr.length||!COORD[a])return;const c=COORD[a],orders=[...new Set(rr.map(x=>x.order))],fb=[...new Set(rr.map(x=>x.feedback).filter(Boolean))];const html='<div style="direction:rtl;text-align:right;min-width:220px"><b style="color:'+colors[ri]+'">Route '+String(ri+1).padStart(2,'0')+' — '+esc(z)+'</b><br><b>'+esc(a)+'</b><hr><b>Orders:</b><br>'+orders.map(esc).join(' · ')+(fb.length?'<hr><b>Feedback:</b><br>'+fb.map(esc).join('<br>'):'')+'</div>';L.marker(c,{icon:L.divIcon({className:'',html:'<div style="width:28px;height:28px;border-radius:50%;background:'+colors[ri]+';color:#111;font-weight:900;text-align:center;line-height:28px;border:2px solid #fff;box-shadow:0 1px 5px #000">'+(idx+1)+'</div>',iconSize:[28,28],iconAnchor:[14,14]})}).addTo(map).bindPopup(html);pts.push(c);bounds.push(c)});if(pts.length>1)L.polyline(pts,{color:colors[ri],weight:4,opacity:.75}).addTo(map)});if(bounds.length)map.fitBounds(bounds,{padding:[20,20]})}catch(e){console.warn('Map skipped:',e)}};d.head.appendChild(s)}catch(e){console.warn('Dashboard map patch skipped:',e)}}
