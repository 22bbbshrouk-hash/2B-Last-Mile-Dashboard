fc'];const COORD={'القاهرة الجديدة':[30.03,31.47],'التجمع الأول':[30.04,31.47],'التجمع الاول':[30.04,31.47],'التجمع الخامس':[30,31.43],'الرحاب':[30.06,31.49],'التجمع الثالث':[30.01,31.50],'التجمع':[30.03,31.47],'الشروق':[30.13,31.62],'العبور':[30.23,31.46],'مدينتي':[30.10,31.64],'العاصمة الإدارية الجديدة':[30.01,31.73],'العاصمة الادارية الجديدة':[30.01,31.73],'مدينة نصر':[30.06,31.34],'مصر الجديدة':[30.09,31.33],'النزهة':[30.13,31.36],'جسر السويس':[30.14,31.39],'حدائق القبة':[30.08,31.29],'الزيتون':[30.11,31.31],'عين شمس':[30.13,31.34],'عين شمس- الشرقية':[30.13,31.34],'عزبة النخل':[30.14,31.36],'شبرا مصر':[30.08,31.24],'الضاهر':[30.06,31.27],'وسط البلد':[30.05,31.24],'السيدة زينب':[30.03,31.24],'دار السلام':[29.97,31.24],'المهندسين':[30.05,31.20],'أرض اللواء':[30.05,31.19],'ارض اللواء':[30.05,31.19],'بولاق الدكرور':[30.03,31.19],'الزمالك':[30.06,31.22],'الجيزة':[30.01,31.21],'العمرانية':[29.99,31.18],'الهرم':[29.99,31.15],'فيصل':[30,31.17],'ترسا':[29.99,31.17],'حدائق أكتوبر':[29.93,30.90],'حدائق اكتوبر':[29.93,30.90],'السادس من أكتوبر':[29.98,30.95],'6 أكتوبر':[29.98,30.95],'حدائق الأهرام':[29.96,31.12],'حدائق الاهرام':[29.96,31.12],'الشيخ زايد':[30.01,30.97],'زايد':[30.01,30.97],'المعادي':[29.96,31.26],'المعادى':[29.96,31.26],'حلوان':[29.85,31.33],'15 مايو':[29.86,31.37],'مايو':[29.86,31.37],'المقطم':[30.02,31.30],'زهراء المعادي':[29.97,31.29],'الساحل الشمالى':[30.95,28.80],'الساحل الشمالي':[30.95,28.80]};const norm=v=>String(v??'').normalize('NFKC').toLowerCase().replace(/[\u064B-\u065F\u0670]/g,'').replace(/[\s_\-()./]/g,'').replace(/ى/g,'ي').replace(/ة/g,'ه').trim();const aliases=[];ROUTES.forEach(([z,as])=>as.forEach(a=>aliases.push([norm(a),a,z])));function canon(v){let n=norm(v),e=aliases.find(x=>x[0]===n);return e?e[1]:(String(v||'غير محدد').trim()||'غير محدد')}function zone(v){let n=norm(canon(v)),e=aliases.find(x=>x[0]===n);return e?e[2]:'غير مصنف'}function rix(z){let i=ROUTES.findIndex(r=>r[0]===z);return i<0?999:i}function aix(a){let z=zone(a),r=ROUTES.find(x=>x[0]===z);return r?Math.max(0,r[1].findIndex(x=>norm(x)===norm(a))):999}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function pick(r,as){let ks=Object.keys(r);for(const a of as){let q=ks.find(k=>norm(k)===norm(a));if(q&&String(r[q]).trim()!=='')return r[q]}for(const k of ks)if(as.some(a=>norm(k).includes(norm(a))||norm(a).includes(norm(k)))&&String(r[k]).trim()!=='')return r[k];return ''}function parse(buf){let wb=XLSX.read(buf,{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]];return XLSX.utils.sheet_to_json(ws,{defval:'',raw:false}).map(r=>{let order=pick(r,['order','order number','order no','ordernumber','orderno','awb','shipment','shipment number','رقم الطلب','الطلب','ref nbr','ref number']),area=pick(r,['area','area name','region','zone area','المنطقة','المنطقه','area_name','delivery area']),address=pick(r,['address','customer address','customeraddress','delivery address','deliveryaddress','العنوان','عنوان العميل','عنوان التوصيل']),sku=pick(r,['sku','sku code','product sku','item code','رمز الصنف','product code']),product=pick(r,['product','product name','item','description','المنتج','item description']),qty=pick(r,['qty','quantity','الكمية','الكميه','units']),status=pick(r,['status','delivery status','shipment status','order status','state','الحالة','الحاله']),feedback=pick(r,['feedback','customer feedback','customerfeedback','feedback1','feedback2','ملاحظات','الملاحظات','تعليق العميل','تعليق']);return{order:String(order).trim(),area:canon(area),zone:zone(area),address:String(address).trim(),sku:String(sku).trim(),product:String(product).trim(),qty:Number(String(qty).replace(/,/g,''))||1,status:String(status).trim(),feedback:String(feedback).trim()}}).filter(x=>x.order)}const isAC=r=>/\bac\b|air\s*condition|air\s*conditioner|تكييف|مكيف|مكيفات/i.test(r.product);const important=new Set(['outfordelivery','readyfordelivery','assigned','pickedup','delivered','noanswer','cancelled','canceled','returned','return','refused','failed']);function routeVehicles(rows){let n=0;ROUTES.forEach(([z])=>{let r=rows.filter(x=>x.zone===z);if(r.length){let ac=r.filter(isAC).reduce((s,x)=>s+x.qty,0);n+=Math.max(1,Math.ceil(ac/13))}});return n}function share(d){if(d.getElementById('shareDashboardBtn'))return;let bar=d.querySelector('.bar');if(!bar)return;let b=d.createElement('button');b.id='shareDashboardBtn';b.className='btn secondary';b.textContent='🔗 Share Dashboard';b.onclick=async()=>{let u=location.href.split('?')[0];try{await navigator.clipboard.writeText(u);b.textContent='✓ Link Copied';setTimeout(()=>b.textContent='🔗 Share Dashboard',1600)}catch(e){prompt('Copy Share Link',u)}};bar.appendChild(b)}function renderMap(d,rows){if(d.getElementById('routeMapSection'))return;let link=d.createElement('link');link.rel='stylesheet';link.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';d.head.appendChild(link);let sec=d.createElement('section');sec.className='card full';sec.id='routeMapSection';sec.innerHTML='<h2>🗺️ Trip Zones & Routes</h2><div class="sub">رقم المنطقة حسب ترتيب خط السير — اضغطي على الرقم لعرض Orders وFeedback لو موجود.</div><div id="routeMapOne" style="height:500px;border-radius:12px;overflow:hidden;margin-top:10px"></div><div id="routeLegend" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"></div>';let grid=d.querySelector('.grid'),rt=d.getElementById('routes')?.closest('section');if(!grid)return;grid.insertBefore(sec,rt||null);let s=d.createElement('script');s.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';s.onload=()=>{let el=d.getElementById('routeMapOne');if(!el||el._leaflet_id)return;let L=d.defaultView.L,map=L.map(el).setView([30.02,31.25],10);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);let bounds=[];ROUTES.forEach(([z,areas],ri)=>{let rs=rows.filter(r=>r.zone===z);if(!rs.length)return;let color=COLORS[ri],used=0,pts=[];areas.forEach(a=>{let rr=rs.filter(x=>norm(x.area)===norm(a));if(!rr.length||!COORD[a])return;used++;let c=COORD[a],orders=[...new Set(rr.map(x=>x.order))],fb=[...new Set(rr.map(x=>x.feedback).filter(Boolean))];let html='<div style="direction:rtl;text-align:right;min-width:220px"><b style="color:'+color+'">Route '+String(ri+1).padStart(2,'0')+' — '+esc(z)+'</b><br><b>'+esc(a)+'</b><hr><b>Orders:</b><br>'+orders.map(esc).join(' · ')+(fb.length?'<hr><b>Feedback:</b><br>'+fb.map(esc).join('<br>'):'')+'</div>';L.marker(c,{icon:L.divIcon({className:'',html:'<div style="width:28px;height:28px;border-radius:50%;background:'+color+';color:#111;font-weight:900;text-align:center;line-height:28px;border:2px solid #fff;box-shadow:0 1px 5px #000">'+used+'</div>',iconSize:[28,28],iconAnchor:[14,14]})}).addTo(map).bindPopup(html);pts.push(c);bounds.push(c)});if(pts.length>1)L.polyline(pts,{color,weight:4,opacity:.75}).addTo(map);let actual=areas.filter(a=>rs.some(x=>norm(x.area)===norm(a)));d.getElementById('routeLegend').insertAdjacentHTML('beforeend','<span style="border:1px solid '+color+';color:'+color+';padding:5px 8px;border-radius:7px;font-size:10px;font-weight:900">Route '+String(ri+1).padStart(2,'0')+' — '+esc(z)+' · '+actual.map(esc).join(' · ')+'</span>')});if(bounds.length)map.fitBounds(bounds,{padding:[20,20]})};d.head.appendChild(s)}async function patch(){try{let f=document.getElementById('dash'),d=f.contentDocument;if(!d)return;let rr=await fetch(PUBLIC+'?v='+Date.now(),{cache:'no-store'});if(!rr.ok)return;let rows=parse(await rr.arrayBuffer());share(d);let rank=d.getElementById('rank');if(rank){let m=new Map();rows.forEach(r=>{if(!m.has(r.area))m.set(r.area,new Set());m.get(r.area).add(r.order)});let a=[...m].map(([x,s])=>[x,s.size]).sort((p,q)=>rix(zone(p[0]))-rix(zone(q[0]))||aix(p[0])-aix(q[0])||q[1]-p[1]);let mx=Math.max(1,...a.map(x=>x[1]));rank.innerHTML=a.map(([x,n])=>'<div class="areaRow"><div>'+esc(x)+'</div><div class="barbg"><div class="barfill" style="width:'+n/mx*100+'%"></div></div><b>'+n+'</b></div>').join('')||'<div class="empty">لا توجد بيانات</div>';let sub=rank.closest('section').querySelector('.sub');if(sub)sub.textContent='Unique Orders حسب المنطقة — اسم المنطقة يظهر مرة واحدة فقط.'}let zm=new Map();rows.forEach(r=>{if(r.zone==='غير مصنف')return;if(!zm.has(r.zone))zm.set(r.zone,{areas:new Set(),orders:new Set(),sku:new Set(),qty:0,ac:0});let z=zm.get(r.zone);z.areas.add(r.area);z.orders.add(r.order);if(r.sku)z.sku.add(r.sku);z.qty+=r.qty;if(isAC(r))z.ac+=r.qty});if(d.getElementById('kVehicles'))d.getElementById('kVehicles').textContent=routeVehicles(rows);let det=d.getElementById('details');if(det){let th=det.closest('table').querySelector('thead tr');th.innerHTML='<th>Trip Zone</th><th>Area</th><th>Order</th><th>Address</th><th>SKU</th><th>Product</th><th>QTY</th>';let u=new Map();rows.forEach(r=>{let k=[r.zone,r.area,r.order,r.address,r.sku,r.product].map(norm).join('|');if(!u.has(k))u.set(k,{...r});else u.get(k).qty+=r.qty});let a=[...u.values()].sort((x,y)=>rix(x.zone)-rix(y.zone)||aix(x.area)-aix(y.area)||x.order.localeCompare(y.order,'ar',{numeric:true}));det.innerHTML=a.map(r=>'<tr><td>'+esc(r.zone)+'</td><td>'+esc(r.area)+'</td><td>'+esc(r.order)+'</td><td>'+esc(r.address)+'</td><td>'+esc(r.sku)+'</td><td>'+esc(r.product)+'</td><td>'+r.qty+'</td></tr>').join('')||'<tr><td colspan="7" class="empty">لا توجد بيانات</td></tr>'}let fol=d.getElementById('follow');if(fol){let th=fol.closest('table').querySelector('thead tr');th.innerHTML='<th>Order</th><th>Zone</th><th>Area</th><th>Address</th><th>Status</th><th>Feedback</th>';let fm=new Map();rows.forEach(r=>{if(!fm.has(r.order)||(!fm.get(r.order).feedback&&r.feedback))fm.set(r.order,r)});let a=[...fm.values()].filter(r=>important.has(norm(r.status))||r.feedback).sort((x,y)=>rix(x.zone)-rix(y.zone)||aix(x.area)-aix(y.area)||x.order.localeCompare(y.order,'ar',{numeric:true}));fol.innerHTML=a.map(r=>'<tr><td>'+esc(r.order)+'</td><td>'+esc(r.zone)+'</td><td>'+esc(r.area)+'</td><td>'+esc(r.address)+'</td><td><span class="tag">'+esc(r.status)+'</span></td><td style="color:#4da6ff;font-weight:900">'+esc(r.feedback)+'</td></tr>').join('')||'<tr><td colspan="6" class="empty">لا توجد متابعة مهمة أو Feedback</td></tr>'}let rt=d.getElementById('routes');if(rt){rt.innerHTML=ROUTES.map(([z])=>[z,zm.get(z)]).filter(([,v])=>v).map(([z,v],i)=>{let os=[...v.orders].sort((a,b)=>a.localeCompare(b,'ar',{numeric:true})),cars=Math.max(1,Math.ceil(v.ac/13));return '<div class="routeCard"><div class="routeHead"><div><div class="routeTitle">🛣️ Route '+String(i+1).padStart(2,'0')+' — '+esc(z)+'</div><div class="muted">Areas: '+esc([...v.areas].sort((a,b)=>aix(a)-aix(b)).join(' · '))+'</div><div class="muted">Orders: <b>'+v.orders.size+'</b> · SKU: <b>'+v.sku.size+'</b> · QTY: <b>'+v.qty+'</b> · AC: <b>'+v.ac+'</b> / 13 per دبابة</div><div style="margin-top:8px;padding:8px;border:1px solid #26313d;border-radius:8px;background:#0a0f15;font-size:10px;line-height:1.8"><b style="color:#ff7900">Orders:</b> '+os.map(esc).join(' · ')+'</div></div><div class="vehicle">🚚 '+cars+' Vehicle'+(cars>1?'s':'')+'</div></div></div>'}).join('')||'<div class="empty">لا توجد بيانات</div>';rt.insertAdjacentHTML('beforeend','<div class="muted" style="margin-top:10px;padding:9px;border:1px solid #26313d;border-radius:8px">📍 <b>Vehicle Warehouse:</b> 15 مايو — عند أول سور مدينة الأبطال وبجوار المدرسة اليابانية.</div>')}renderMap(d,rows)}catch(e){console.warn('stable patch',e)}}document.getElementById('dash').addEventListener('load',()=>{setTimeout(patch,1000);setTimeout(patch,2500);setTimeout(patch,5000)});</script></body></html>
