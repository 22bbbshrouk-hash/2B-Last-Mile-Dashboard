<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2B | Last Mile Operations Control Tower</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%2307090d'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-family='Arial' font-size='30' font-weight='900' fill='%23ff7900'%3E2B%3C/text%3E%3C/svg%3E"><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><style>html,body{margin:0;width:100%;height:100%;background:#07090d}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="dash" src="./dashboard-new-20260820.html?v=stable-base" title="2B Last Mile Dashboard"></iframe><script>
const PUBLIC='https://wihopmnjpsfsgujugyzl.supabase.co/storage/v1/object/public/dashboard-data/Last_Mile_Data.xlsx';
const ROUTES=[['New Cairo',['القاهرة الجديدة','التجمع','التجمع الاول','التجمع الأول','التجمع الثالث','التجمع الخامس','الرحاب']],['East Cairo',['العبور','الشروق','مدينتي','العاصمة الإدارية الجديدة','العاصمة الادارية الجديدة','بدر']],['Nasr City / Heliopolis',['مدينة نصر','مصر الجديدة','النزهة','روكسي','جسر السويس','حدائق القبة','الزيتون','المطرية','عين شمس','عين شمس- الشرقية','عزبة النخل']],['Central Cairo',['وسط البلد','باب الشعرية','الضاهر','دار السلام','شبرا مصر','السيدة زينب']],['Mohandeseen / Ard El Lewa',['المهندسين','أرض اللواء','ارض اللواء','الزمالك','بولاق الدكرور']],['Haram / Faisal',['الهرم','فيصل','ترسا','الجيزة','العمرانية']],['October / Zayed',['حدائق أكتوبر','حدائق اكتوبر','6 أكتوبر','السادس من أكتوبر','الشيخ زايد','زايد','حدائق الأهرام','حدائق الاهرام']],['Maadi / Helwan / Mokattam',['المعادي','المعادى','حلوان','15 مايو','مايو','المقطم','زهراء المعادي']],['North Coast',['الساحل الشمالى','الساحل الشمالي']]];
const norm=v=>String(v??'').normalize('NFKC').toLowerCase().replace(/[\u064B-\u065F\u0670]/g,'').replace(/[\s_\-()./]/g,'').replace(/ى/g,'ي').replace(/ة/g,'ه').trim();
function lev(a,b){let p=Array(b.length+1).fill(0).map((_,i)=>i);for(let i=1;i<=a.length;i++){let q=[i];for(let j=1;j<=b.length;j++)q[j]=Math.min(q[j-1]+1,p[j]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=q}return p[b.length]}
const aliases=[];ROUTES.forEach(([z,as])=>as.forEach(a=>aliases.push([norm(a),a,z])));function canon(v){let n=norm(v),e=aliases.find(x=>x[0]===n);if(e)return e[1];let best=null,bd=99;for(const x of aliases){let d=lev(n,x[0]);if(d<bd&&d<=Math.max(1,Math.floor(Math.min(n.length,x[0].length)*.25))){bd=d;best=x}}return best?best[1]:(String(v||'غير محدد').trim()||'غير محدد')}function route(v){let n=norm(canon(v)),e=aliases.find(x=>x[0]===n);return e?e[2]:'غير مصنف'}
function k(v){return norm(v).replace(/[^a-z0-9\u0600-\u06ff]/g,'')}function pick(r,as){const ks=Object.keys(r);for(const a of as){const t=k(a),q=ks.find(x=>k(x)===t);if(q&&String(r[q]).trim()!=='')return r[q]}for(const x of ks){const nx=k(x);if(as.some(a=>nx.includes(k(a))||k(a).includes(nx))&&String(r[x]).trim()!=='')return r[x]}return ''}function esc(v){return String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]))}
function parse(wb){const ws=wb.Sheets[wb.SheetNames[0]];return XLSX.utils.sheet_to_json(ws,{defval:'',raw:false}).map(r=>{const order=pick(r,['order','order number','order no','ordernumber','orderno','awb','shipment','shipment number','رقم الطلب','الطلب','ref nbr','ref number']),area=pick(r,['area','area name','region','zone area','المنطقة','المنطقه','area_name','delivery area']),address=pick(r,['address','customer address','customeraddress','delivery address','deliveryaddress','العنوان','عنوان العميل','عنوان التوصيل']),sku=pick(r,['sku','sku code','product sku','item code','رمز الصنف','product code']),product=pick(r,['product','product name','item','description','المنتج','item description']),qty=pick(r,['qty','quantity','الكمية','الكميه','units']),status=pick(r,['status','delivery status','shipment status','order status','state','الحالة','الحاله']),feedback=pick(r,['feedback','customer feedback','customerfeedback','feedback1','feedback2','ملاحظات','الملاحظات','تعليق العميل','تعليق']);return{order:String(order).trim(),area:canon(area),zone:route(area),address:String(address).trim(),sku:String(sku).trim(),product:String(product).trim(),qty:Number(String(qty).replace(/,/g,''))||1,status:String(status).trim(),feedback:String(feedback).trim()}}).filter(x=>x.order)}
const important=new Set(['outfordelivery','readyfordelivery','assigned','pickedup','delivered','noanswer','cancelled','canceled','returned','return','refused','failed']);const isAC=r=>/\bac\b|air\s*condition|تكييف/i.test(r.product);
async function patch(){try{const f=document.getElementById('dash'),d=f.contentDocument;if(!d)return;const res=await fetch(PUBLIC+'?v='+Date.now(),{cache:'no-store'});if(!res.ok)return;const wb=XLSX.read(await res.arrayBuffer(),{type:'array'}),rows=parse(wb);const by=id=>d.getElementById(id);
let map2=by('map2');if(map2){const s=map2.closest('section');if(s)s.remove()}
let m=new Map();rows.forEach(r=>{if(!m.has(r.area))m.set(r.area,new Set());m.get(r.area).add(r.order)});let arr=[...m].map(([a,s])=>[a,s.size]).sort((x,y)=>y[1]-x[1]||x[0].localeCompare(y[0],'ar')),mx=Math.max(1,...arr.map(x=>x[1]));if(by('rank'))by('rank').innerHTML=arr.map(([a,n])=>'<div class="areaRow"><div>'+esc(a)+'</div><div class="barbg"><div class="barfill" style="width:'+(n/mx*100)+'%"></div></div><b>'+n+'</b></div>').join('')||'<div class="empty">لا توجد بيانات</div>';
let zm=new Map();rows.forEach(r=>{if(r.zone==='غير مصنف')return;if(!zm.has(r.zone))zm.set(r.zone,{areas:new Set(),orders:new Set(),sku:new Set(),qty:0,ac:0});let z=zm.get(r.zone);z.areas.add(r.area);z.orders.add(r.order);if(r.sku)z.sku.add(r.sku);z.qty+=r.qty;if(isAC(r))z.ac+=r.qty});
if(by('zones'))by('zones').innerHTML=[...zm].map(([z,v])=>'<div class="zoneCard"><div class="zoneTitle">'+esc(z)+'</div><div class="muted">'+esc([...v.areas].join(' · '))+'</div><div class="muted">Unique Orders: <b>'+v.orders.size+'</b> · SKU: <b>'+v.sku.size+'</b> · QTY: <b>'+v.qty+'</b> · AC: <b>'+v.ac+'</b></div></div>').join('')||'<div class="empty">لا توجد بيانات</div>';
const sec=by('details');if(sec){const table=sec.closest('table');const th=table.querySelector('thead tr');th.innerHTML='<th>Trip Zone</th><th>Area</th><th>Order</th><th>Address</th><th>SKU</th><th>Product</th><th>QTY</th>';const dm=new Map();rows.forEach(r=>{const key=[norm(r.zone),norm(r.area),r.order,norm(r.address),r.sku,norm(r.product)].join('|');if(!dm.has(key))dm.set(key,{...r});else dm.get(key).qty+=r.qty});const a=[...dm.values()].sort((x,y)=>x.zone.localeCompare(y.zone,'ar')||x.area.localeCompare(y.area,'ar')||x.order.localeCompare(y.order,'ar',{numeric:true})||x.address.localeCompare(y.address,'ar'));sec.innerHTML=a.map(r=>'<tr><td>'+esc(r.zone)+'</td><td>'+esc(r.area)+'</td><td>'+esc(r.order)+'</td><td>'+esc(r.address)+'</td><td>'+esc(r.sku)+'</td><td>'+esc(r.product)+'</td><td>'+esc(r.qty)+'</td></tr>').join('')||'<tr><td colspan="7" class="empty">لا توجد بيانات</td></tr>';const sub=sec.closest('section').querySelector('.sub');if(sub)sub.textContent='كل Area متجمعة، وكل Orders الخاصة بها تحت بعض، والعنوان موجود.'}
const fol=by('follow');if(fol){const table=fol.closest('table'),th=table.querySelector('thead tr');th.innerHTML='<th>Order</th><th>Zone</th><th>Area</th><th>Address</th><th>Status</th><th>Feedback</th>';const fm=new Map();rows.forEach(r=>{const detail=r.feedback;if(!fm.has(r.order)||(!fm.get(r.order).feedback&&detail))fm.set(r.order,r)});const a=[...fm.values()].filter(r=>important.has(norm(r.status))||r.feedback).sort((x,y)=>x.order.localeCompare(y.order,'ar',{numeric:true}));fol.innerHTML=a.map(r=>'<tr><td>'+esc(r.order)+'</td><td>'+esc(r.zone)+'</td><td>'+esc(r.area)+'</td><td>'+esc(r.address)+'</td><td><span class="tag">'+esc(r.status)+'</span></td><td style="color:#4da6ff;font-weight:800">'+esc(r.feedback)+'</td></tr>').join('')||'<tr><td colspan="6" class="empty">لا توجد متابعة مهمة أو Feedback</td></tr>';const sub=fol.closest('section').querySelector('.sub');if(sub)sub.textContent='الطلب · المنطقة · العنوان · الحالة · Feedback (لو موجود).'}
const rt=by('routes');if(rt){rt.innerHTML=[...zm].map(([z,v],i)=>{const os=[...v.orders].sort((a,b)=>a.localeCompare(b,'ar',{numeric:true}));return '<div class="routeCard"><div class="routeHead"><div><div class="routeTitle">🛣️ Route '+String(i+1).padStart(2,'0')+' — '+esc(z)+'</div><div class="muted">Areas: '+esc([...v.areas].join(' · '))+'</div><div class="muted">Orders: <b>'+v.orders.size+'</b> · SKU: <b>'+v.sku.size+'</b> · QTY: <b>'+v.qty+'</b> · AC: <b>'+v.ac+'</b> / 13 per دبابة</div><div style="margin-top:8px;padding:8px 10px;border:1px solid #26313d;border-radius:8px;background:#0a0f15;font-size:10px;line-height:1.8"><b style="color:#ff7900">Orders:</b> '+os.map(esc).join(' · ')+'</div></div><div class="vehicle">🚚 '+Math.max(1,Math.ceil(v.ac/13))+' Vehicle'+(v.ac>13?'s':'')+'</div></div></div>'}).join('')||'<div class="empty">لا توجد بيانات</div>'}}
catch(e){console.warn('dashboard patch',e)}}
document.getElementById('dash').addEventListener('load',()=>{setTimeout(patch,1200);setTimeout(patch,3000);setTimeout(patch,6000);setInterval(patch,10000)});</script></body></html>
