const CANON={'مدينه نصر':'مدينة نصر','مدينة نصر':'مدينة نصر','مصر الجديده':'مصر الجديدة','مصر الجديدة':'مصر الجديدة','هليوبوليس':'هليوبوليس','هليوبوليس الجديده':'هليوبوليس الجديدة','هليوبوليس الجديدة':'هليوبوليس الجديدة','المعادى':'المعادي','المعادي':'المعادي','زهراء المعادى':'زهراء المعادي','زهراء المعادي':'زهراء المعادي','القاهره الجديده':'القاهرة الجديدة','القاهرة الجديدة':'القاهرة الجديدة','التجمع الاول':'التجمع الأول','التجمع الأول':'التجمع الأول','التجمع الثانى':'التجمع الثاني','التجمع الثاني':'التجمع الثاني','التجمع الثالث':'التجمع الثالث','التجمع الخامس':'التجمع الخامس','اكتوبر':'السادس من أكتوبر','6 اكتوبر':'السادس من أكتوبر','6 أكتوبر':'السادس من أكتوبر','السادس من اكتوبر':'السادس من أكتوبر','السادس من أكتوبر':'السادس من أكتوبر','حدائق اكتوبر':'حدائق أكتوبر','حدائق أكتوبر':'حدائق أكتوبر','مدينه العبور':'مدينة العبور','مدينة العبور':'مدينة العبور','العبور الجديده':'العبور الجديدة','العبور الجديدة':'العبور الجديدة','مدينة الشروق':'الشروق','الشروق':'الشروق','العجوزه':'العجوزة','العجوزة':'العجوزة','العمرانيه':'العمرانية','العمرانية':'العمرانية','منشاة البكاري':'منشأة البكاري','منشأة البكاري':'منشأة البكاري','حدائق الاهرام':'حدائق الأهرام','حدائق الأهرام':'حدائق الأهرام','حدائق القبه':'حدائق القبة','حدائق القبة':'حدائق القبة'};
function canon(a){const s=String(a||'').trim(),n=N(s);for(const k in CANON)if(N(k)===n)return CANON[k];return s||'غير مصنف'}
function find(r,names){const ks=Object.keys(r);for(const x of names){const nx=N(x),k=ks.find(k=>N(k)===nx);if(k!==undefined&&String(r[k]??'').trim()!=='')return r[k]}for(const x of names){const nx=N(x),k=ks.find(k=>N(k).includes(nx)||nx.includes(N(k)));if(k!==undefined&&String(r[k]??'').trim()!=='')return r[k]}return''}
function zi(a){const n=N(a);return OPS.findIndex(x=>x[1].some(y=>N(y)===n))}
function parse2(ws){return XLSX.utils.sheet_to_json(ws,{defval:'',raw:false}).map((r,i)=>{const raw=String(find(r,['Area','Area Name','Region','المنطقة','المنطقه'])||'').trim(),a=canon(raw),z=zi(a);return{idx:i,order:String(find(r,['Order Number','Order No','Order ID','Order','AWB','Shipment Number','رقم الأوردر','رقم الاوردر','رقم الطلب'])||'').trim(),customer:String(find(r,['Customer Name','Customer','Client Name','Client','اسم العميل','العميل'])||'').trim(),phone:String(find(r,['Phone Number','Phone','Mobile','Customer Phone','رقم الهاتف','الهاتف'])||'').trim(),qty:Number(String(find(r,['Quantity','QTY','Qty','Units','الكمية','الكميه'])||'').replace(/,/g,''))||1,product:String(find(r,['Product Item (EN)','Product','Product Name','Item','Description','Product Name (EN)','المنتج'])||'').trim(),productAR:String(find(r,['Product Item (AR)','Product Item AR','Product AR','Product Name (AR)','المنتج العربي'])||'').trim(),areaRaw:raw,area:a,zone:z>=0?OPS[z][0]:'غير مصنف',zoneIndex:z,address:String(find(r,['Client Address','Customer Address','Address','العنوان','عنوان العميل'])||'').trim(),sku:String(find(r,['SKU','SKU Code','Product SKU','Item Code','Product Code','كود المنتج','رمز الصنف'])||'').trim(),feedback:String(find(r,['Customer Feedback','Customer feedback','Feedback','Client Feedback','Customer Notes','Notes','Comments','Remarks','ملاحظات العميل'])||'').trim(),lat:Number(String(find(r,['Latitude','Lat','Customer Latitude','GPS Latitude'])||'').replace(',','.')),lng:Number(String(find(r,['Longitude','Lng','Long','Customer Longitude','GPS Longitude'])||'').replace(',','.'))}}).filter(r=>r.order||r.customer||r.address)}
function ac(r){const s=N((r.product||'')+' '+(r.productAR||'')),q=r.qty||1;if(/aircondition|مكيف|تكييف|سبليت|splitac/.test(s))return q;if(/refrigerator|fridge|freezer|ثلاجه|ثلاجة/.test(s))return q*.9;if(/washingmachine|washer|dryer|غساله|غسالة/.test(s))return q*.9;if(/tv|television|شاشه|شاشة/.test(s))return q*.45;if(/microwave|ميكرو/.test(s))return q*.3;return q*.2}
function plan(load){if(load<=0)return{count:0,type:'—'};if(load<=13)return{count:1,type:'Dabbaba'};if(load<=26)return{count:1,type:'Jumbo'};const j=Math.ceil(load/26),d=Math.ceil(load/13);return j<d?{count:j,type:'Jumbo'}:{count:d,type:'Dabbaba'}}
function patch(){const w=frame.contentWindow,d=frame.contentDocument;if(!w||!d||!w.XLSX)return false;w.OPS=OPS;w.parse=parse2;w.acEq=ac;w.vehicles=function(rs){const load=(rs||[]).reduce((s,r)=>s+ac(r),0);return plan(load).count};const originalRender=w.render;if(!w.__stablePatch){w.__stablePatch=true;w.render=function(){originalRender();setTimeout(()=>fixUI(w,d),20)}}
function fixUI(w,d){try{const data=w.data||[],feedback=data.filter(r=>String(r.feedback||'').trim()),fm=new Map;feedback.forEach(r=>{if(!fm.has(r.order))fm.set(r.order,r)});const tb=d.getElementById('follow');if(tb)tb.innerHTML=[...fm.values()].map(r=>`<tr><td>${E(r.order)}</td><td>${E(r.customer)}</td><td>${E(r.phone)}</td><td>${E(r.area)}</td><td>${E(r.address)}</td><td>${E(r.feedback)}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">لا توجد Customer Feedback في الداتا الحالية</td></tr>';

async function fresh(){try{const r=await fetch(PUBLIC+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const wb=w.XLSX.read(await r.arrayBuffer(),{type:'array',raw:false});w.data=w.parse(wb.Sheets[wb.SheetNames[0]]);w.render();setTimeout(()=>draw(w,d),60)}catch(e){console.error(e)}}
function draw(w,d){if(!w.L||!w.map||!Array.isArray(w.data))return;try{if(w.__stableLayers)w.__stableLayers.forEach(x=>x.remove())}catch(e){}w.__stableLayers=[];const colors=['#ff7900','#49d7a1','#67a8ff','#d86eff','#ffd166','#00c2ff','#ff5c8a','#8be28b','#b49cff','#f29f67'],W=[29.8515,31.3505],bounds=[W];w.__stableLayers.push(w.L.marker(W).addTo(w.map).bindPopup('<b>0 · Warehouse</b><br>15 مايو بجوار سور مدينة الأبطال وأول شارع المدرسة اليابانية'));const groups=new Map;w.data.forEach(r=>{if(r.zoneIndex>=0){if(!groups.has(r.zoneIndex))groups.set(r.zoneIndex,[]);groups.get(r.zoneIndex).push(r)}});[...groups.entries()].sort((a,b)=>a[0]-b[0]).forEach(([i,rs])=>{const op=OPS[i],color=colors[i%colors.length],ids=[...new Set(rs.map(r=>r.order).filter(Boolean))],line=[W];ids.forEach((id,j)=>{const r=rs.find(x=>x.order===id),lat=Number.isFinite(r.lat)&&r.lat>20&&r.lat<35?r.lat:op[2],lng=Number.isFinite(r.lng)&&r.lng>20&&r.lng<40?r.lng:op[3];line.push([lat,lng]);bounds.push([lat,lng]);const m=w.L.circleMarker([lat,lng],{radius:9,color,fillColor:color,fillOpacity:.95,weight:2}).addTo(w.map);m.bindPopup(`<b>Zone ${i+1} · Stop ${j+1}</b><br>Order: ${E(r.order)}<br>Customer: ${E(r.customer)}<br>Phone: ${E(r.phone)}<br>Area: ${E(r.area)}<br>Address: ${E(r.address)}<br>Feedback: ${E(r.feedback||'—')}`);w.__stableLayers.push(m)});const p=w.L.polyline(line,{color,weight:5,opacity:.8}).addTo(w.map);w.__stableLayers.push(p)});if(bounds.length>1)w.map.fitBounds(bounds,{padding:[25,25]})}
if(!w.__stableInstalled){w.__stableInstalled=true;setTimeout(fresh,80)}return true}
