const norm=v=>String(v??'').normalize('NFKC').toLowerCase().replace(/[\u064B-\u065F\u0670]/g,'').replace(/[\s_\-()./]/g,'').replace(/ى/g,'ي').replace(/ة/g,'ه').trim();function lev(a,b){let p=Array(b.length+1).fill(0).map((_,i)=>i);for(let i=1;i<=a.length;i++){let q=[i];for(let j=1;j<=b.length;j++)q[j]=Math.min(q[j-1]+1,p[j]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=q}return p[b.length]};const aliases=[];ROUTES.forEach(([z,as])=>as.forEach(a=>aliases.push([norm(a),a,z])));function canon(v){let n=norm(v),e=aliases.find(x=>x[0]===n);if(e)return e[1];let best=null,bd=99;for(const x of aliases){let d=lev(n,x[0]);if(d<bd&&d<=Math.max(1,Math.floor(Math.min(n.length,x[0].length)*.25))){bd=d;best=x}}return best?best[1]:(String(v||'غير محدد').trim()||'غير محدد')}function route(v){let n=norm(canon(v)),e=aliases.find(x=>x[0]===n);return e?e[2]:'غير مصنف'}function k(v){return norm(v).replace(/[^a-z0-9\u0600-\u06ff]/g,'')}function pick(r,as){const ks=Object.keys(r);for(const a of as){const t=k(a),q=ks.find(x=>k(x)===t);if(q&&String(r[q]).trim()!=='')return r[q]}for(const x of ks){const nx=k(x);if(as.some(a=>nx.includes(k(a))||k(a).includes(nx))&&String(r[x]).trim()!=='')return r[x]}return ''}function esc(v){return String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]))}
function parse(wb){const ws=wb.Sheets[wb.SheetNames[0]];return XLSX.utils.sheet_to_json(ws,{defval:'',raw:false}).map(r=>{const order=pick(r,['order','order number','order no','ordernumber','orderno','awb','shipment','shipment number','رقم الطلب','الطلب','ref nbr','ref number']),area=pick(r,['area','area name','region','zone area','المنطقة','المنطقه','area_name','delivery area']),address=pick(r,['address','customer address','customeraddress','delivery address','deliveryaddress','العنوان','عنوان العميل','عنوان التوصيل']),sku=pick(r,['sku','sku code','product sku','item code','رمز الصنف','product code']),product=pick(r,['product','product name','item','description','المنتج','item description']),qty=pick(r,['qty','quantity','الكمية','الكميه','units']),status=pick(r,['status','delivery status','shipment status','order status','state','الحالة','الحاله']),feedback=pick(r,['feedback','customer feedback','customerfeedback','feedback1','feedback2','ملاحظات','الملاحظات','تعليق العميل','تعليق']);return{order:String(order).trim(),area:canon(area),zone:route(area),address:String(address).trim(),sku:String(sku).trim(),product:String(product).trim(),qty:Number(String(qty).replace(/,/g,''))||1,status:String(status).trim(),feedback:String(feedback).trim()}}).filter(x=>x.order)}

function addMap(d,rows){if(!d||d.getElementById('routeMapOne'))return;const head=d.createElement('link');head.rel='stylesheet';head.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';d.head.appendChild(head);const sec=d.createElement('section');sec.className='card full';sec.id='routeMapSection';sec.innerHTML='<h2>🗺️ Trip Route Map</h2><div class="sub">كل Route بلون مختلف، ورقم كل Area حسب ترتيب خط السير.</div><div id="routeMapOne" style="height:520px;border-radius:12px;overflow:hidden;margin-top:10px"></div><div id="routeLegend" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"></div>';const grid=d.querySelector('.grid');const routes=d.getElementById('routes')?.closest('section');grid.insertBefore(sec,routes||null);const s=d.createElement('script');s.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';s.onload=()=>{const map=d.defaultView.L.map(d.getElementById('routeMapOne')).setView([30.02,31.25],10);d.defaultView.L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);const grouped=new Map();rows.forEach(r=>{if(r.zone==='غير مصنف'||!r.area)return;if(!grouped.has(r.zone))grouped.set(r.zone,[]);if(!grouped.get(r.zone).some(x=>norm(x.area)===norm(r.area)))grouped.get(r.zone).push(r)});let bounds=[];[...grouped].forEach(([z,rs],ri)=>{const color=COLORS[ri%COLORS.length];let latlngs=[];rs.forEach((r,i)=>{const c=COORD[r.area]||null;if(!c)return;latlngs.push(c);bounds.push(c);d.defaultView.L.circleMarker(c,{radius:9,color,fillColor:color,fillOpacity:.9,weight:2}).addTo(map).bindTooltip('<b>Route '+String(ri+1).padStart(2,'0')+'</b><br>'+esc(r.area)+'<br>Area '+(i+1),{direction:'top'});d.defaultView.L.marker(c,{icon:d.defaultView.L.divIcon({className:'',html:'<div style="width:22px;height:22px;border-radius:50%;background:'+color+';color:#111;font-weight:900;text-align:center;line-height:22px;border:2px solid #fff">'+(i+1)+'</div>',iconSize:[22,22],iconAnchor:[11,11]})}).addTo(map)});if(latlngs.length>1)d.defaultView.L.polyline(latlngs,{color,weight:4,opacity:.8}).addTo(map);const lg=d.getElementById('routeLegend');lg.insertAdjacentHTML('beforeend','<span style="border:1px solid '+color+';color:'+color+';padding:5px 8px;border-radius:7px;font-size:10px;font-weight:900">Route '+String(ri+1).padStart(2,'0')+' — '+esc(z)+' · '+rs.map(x=>esc(x.area)).join(' · ')+'</span>')});if(bounds.length)map.fitBounds(bounds,{padding:[20,20]})};d.head.appendChild(s)}
function addShare(d){if(d.getElementById('shareDashboardBtn'))return;const bar=d.querySelector('.bar');if(!bar)return;const b=d.createElement('button');b.id='shareDashboardBtn';b.className='btn secondary';b.textContent='🔗 Share Dashboard';b.onclick=async()=>{const url=location.href.split('?')[0];try{await navigator.clipboard.writeText(url);b.textContent='✓ Link Copied';setTimeout(()=>b.textContent='🔗 Share Dashboard',1800)}catch(e){prompt('Copy Share Link',url)}};bar.appendChild(b)}
async function patch(){try{const f=document.getElementById('dash'),d=f.contentDocument;if(!d)return;const res=await fetch(PUBLIC+'?v='+Date.now(),{cache:'no-store'});if(!res.ok)return;const wb=XLSX.read(await res.arrayBuffer(),{type:'array'}),rows=parse(wb),by=id=>d.getElementById(id);addShare(d);addMap(d,rows);let map2=by('map2');if(map2){const s=map2.closest('section');if(s)s.remove()}
let m=new Map();rows.forEach(r=>{if(!m.has(r.area))m.set(r.area,new Set());m.get(r.area).add(r.order)});let arr=[...m].map(([a,s])=>[a,s.size]).sort((x,y)=>y[1]-x[1]||x[0].localeCompare(y[0],'ar')),mx=Math.max(1,...arr.map(x=>x[1]));if(by('rank'))by('rank').innerHTML=arr.map(([a,n])=>'<div class="areaRow"><div>'+esc(a)+'</div><div class="barbg"><div class="barfill" style="width:'+(n/mx*100)+'%"></div></div><b>'+n+'</b></div>').join('')||'<div class="empty">لا توجد بيانات</div>';

const rt=by('routes');if(rt){rt.innerHTML=[...zm].map(([z,v],i)=>{const os=[...v.orders].sort((a,b)=>a.localeCompare(b,'ar',{numeric:true}));return '<div class="routeCard"><div class="routeHead"><div><div class="routeTitle">🛣️ Route '+String(i+1).padStart(2,'0')+' — '+esc(z)+'</div><div class="muted">Areas: '+esc([...v.areas].join(' · '))+'</div><div class="muted">Orders: <b>'+v.orders.size+'</b> · SKU: <b>'+v.sku.size+'</b> · QTY: <b>'+v.qty+'</b> · AC: <b>'+v.ac+'</b> / 13 per دبابة</div><div style="margin-top:8px;padding:8px 10px;border:1px solid #26313d;border-radius:8px;background:#0a0f15;font-size:10px;line-height:1.8"><b style="color:#ff7900">Orders:</b> '+os.map(esc).join(' · ')+'</div></div><div class="vehicle">🚚 '+Math.max(1,Math.ceil(v.ac/13))+' Vehicle'+(v.ac>13?'s':'')+'</div></div></div>'}).join('')||'<div class="empty">لا توجد بيانات</div>'}}
catch(e){console.warn('dashboard patch',e)}}
