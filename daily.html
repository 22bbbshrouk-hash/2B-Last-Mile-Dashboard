<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2B | Daily Last Mile Dashboard</title>
<style>html,body{margin:0;width:100%;height:100%;background:#07090d;overflow:hidden}iframe{width:100%;height:100%;border:0}</style>
</head>
<body>
<iframe id="dash" src="./index.html"></iframe>
<script>
function cairoToday(){
 const p={}; new Intl.DateTimeFormat('en-CA',{timeZone:'Africa/Cairo',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()).forEach(x=>p[x.type]=x.value);
 return `${p.year}-${p.month}-${p.day}`;
}
function setToday(){
 try{
  const doc=document.getElementById('dash').contentDocument;
  const date=doc&&doc.getElementById('date');
  if(!date||date.options.length<2)return false;
  const today=cairoToday();
  const ok=[...date.options].some(o=>o.value===today);
  if(ok){date.value=today;date.dispatchEvent(new Event('change',{bubbles:true}));return true;}
 }catch(e){}
 return false;
}
let n=0;const timer=setInterval(()=>{if(setToday()||++n>120)clearInterval(timer)},500);
document.getElementById('dash').addEventListener('load',()=>{n=0;});
</script>
</body>
</html>
