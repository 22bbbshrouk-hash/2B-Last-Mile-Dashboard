<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2B | Daily Last Mile Dashboard</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07090d}iframe{width:100%;height:100%;border:0}</style></head><body><iframe id="dash" src="./dashboard-new.html"></iframe><script>(()=>{const f=document.getElementById('dash');function setToday(){try{const d=f.contentDocument;if(!d)return;const sel=d.getElementById('date');if(!sel||!sel.options.length)return;const today=new Date().toLocaleDateString('en-CA',{timeZone:'Africa/Cairo'});if([...sel.options].some(o=>o.value===today)){sel.value=today;sel.dispatchEvent(new Event('change'));return true}return false}catch(e){return false}}let n=0;const timer=setInterval(()=>{n++;if(setToday()||n>60)clearInterval(timer)},500);f.addEventListener('load',()=>{setToday();setTimeout(setToday,1000);setTimeout(setToday,2500)})})();</script></body></html>
