<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2B | Last Mile Operations Control Tower</title><link rel="icon" type="image/svg+xml" href="./favicon.svg?v=feedback-fix-0825"><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><style>html,body{margin:0;width:100%;height:100%;background:#07090d}iframe{display:block;width:100%;height:100%;min-height:100vh;border:0}</style></head><body><iframe id="dash" src="./dashboard-stable.html?v=feedback-fix-0825" title="2B Last Mile Operations Control Tower"></iframe><script>const PUBLIC='https://wihopmnjpsfsgujugyzl.supabase.co/storage/v1/object/public/dashboard-data/Last_Mile_Data.xlsx';const frame=document.getElementById('dash');function norm(v){return String(v??'').toLowerCase().replace(/[\s_\-()./]/g,'').trim()}function findCol(rows,aliases){const ks=Object.keys(rows[0]||{});for(const a of aliases){const k=ks.find(x=>norm(x)===norm(a));if(k)return k}return ks.find(k=>aliases.some(a=>norm(k).includes(norm(a))||norm(a).includes(norm(k))))||null}async function applyFeedback(){try{await new Promise(r=>{if(frame.contentDocument&&frame.contentDocument.readyState==='complete')r();else frame.addEventListener('load',r,{once:true})});const rows=[...frame.contentDocument.querySelectorAll('#follow tr')];if(!rows.length)return;const wb=XLSX.read(await (await fetch(PUBLIC+'?v='+Date.now(),{cache:'no-store'})).arrayBuffer(),{type:'array',raw:false});const sn=wb.SheetNames.find(n=>{const rs=XLSX.utils.sheet_to_json(wb.Sheets[n],{defval:'',raw:false});return rs.length&&Object.keys(rs[0]).some(k=>/order|awb|shipment/i.test(k))})||wb.SheetNames[0];const raw=XLSX.utils.sheet_to_json(wb.Sheets[sn],{defval:'',raw:false});const orderCol=findCol(raw,['order number','order no','order nbr','order','awb','shipment number','رقم الطلب','الطلب','ref nbr']);const feedbackCol=findCol(raw,['customer feedback','customer feedbacks','feedback','customer comment','customer comments','customer rating','feedback customer','ملاحظات العميل','رأي العميل','تقييم العميل','تعليق العميل']);if(!orderCol||!feedbackCol)return;const fb=new Map();raw.forEach(r=>{const o=String(r[orderCol]??'').replace(/\.0$/,'').trim();if(o&&!fb.has(o))fb.set(o,String(r[feedbackCol]??'').trim())});const doc=frame.contentDocument;const table=doc.querySelector('#follow');const head=table?.parentElement?.querySelector('thead');if(head){const th=[...head.querySelectorAll('th')].find(x=>x.textContent.trim()==='Status');if(th)th.textContent='Customer Feedback'}rows.forEach(tr=>{const cells=tr.querySelectorAll('td');if(cells.length<4)return;const order=cells[0].textContent.trim();const value=fb.get(order)||'—';cells[3].innerHTML='<span class="tag">'+value.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))+'</span>'});}catch(e){console.warn('Customer Feedback sync:',e)}}frame.addEventListener('load',()=>setTimeout(applyFeedback,700));setTimeout(applyFeedback,2500);</script></body></html>
