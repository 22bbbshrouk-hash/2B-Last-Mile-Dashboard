<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2B | Last Mile Operations Control Tower</title><style>html,body{margin:0;width:100%;height:100%;background:#07090d}iframe{display:block;width:100%;height:100%;min-height:100vh;border:0}</style></head><body><iframe id="dash" src="./dashboard-final.html?v=meeting-20260824-final" title="2B Last Mile Operations Control Tower"></iframe><script>(function(){var f=document.getElementById('dash');f.addEventListener('load',function(){try{var d=f.contentDocument;if(!d)return;if(!d.getElementById('vehicleWarehouse')){var routes=d.getElementById('routes');var sec=d.createElement('section');sec.id='vehicleWarehouse';sec.className='card full';sec.innerHTML='<h2>📍 Vehicle Warehouse</h2><div class="sub">15 مايو — عند أول سور مدينة الأبطال وبجوار المدرسة اليابانية.</div>';if(routes){var routesSection=routes.closest('section');if(routesSection&&routesSection.parentNode)routesSection.parentNode.insertBefore(sec,routesSection.nextSibling);else d.querySelector('.grid')?.appendChild(sec)}else d.querySelector('.grid')?.appendChild(sec)}if(!d.querySelector('script[data-meeting-search]')){var s=d.createElement('script');s.src='./dashboard-search-live.js?v=meeting-20260824-final';s.setAttribute('data-meeting-search','1');d.body.appendChild(s)}if(!d.querySelector('script[data-follow-fix]')){var fix=d.createElement('script');fix.setAttribute('data-follow-fix','1');fix.textContent="(function(){var timer=setInterval(function(){try{if(typeof data==='undefined'||!Array.isArray(data)||!data.length)return;var el=document.getElementById('follow');if(!el)return;var norm=function(v){return String(v==null?'':v).normalize('NFKC').toLowerCase().replace(/[\\u064B-\\u065F\\u0670]/g,'').replace(/[\\-_]+/g,' ').replace(/\\s+/g,' ').trim()};var important=['delivered','out for delivery','outfordelivery','ready for delivery','readyfordelivery','assigned','picked up','pickedup','no answer','noanswer','cancelled','canceled','cancel','returned','return','refused','failed','failure','rejected','تم التسليم','خرج للتوصيل','جاهز للتوصيل','مخصص','تم الاستلام','لم يرد','ملغي','ملغى','مرتجع','رفض','فشل'];var esc=function(v){return String(v==null?'':v).replace(/[&<>\\\"']/g,function(m){return({'&':'&amp;','<':'&lt;','>':'&gt;','\\\"':'&quot;',\"'\":'&#39;'})[m]})};var score=function(v){var s=norm(v);return important.some(function(x){return s.indexOf(norm(x))!==-1})?2:1};var by=new Map();data.forEach(function(x){if(!x||!x.order)return;var sc=score(x.status);var old=by.get(x.order);if(!old||sc>old._sc||(sc===old._sc&&!old.status&&x.status))by.set(x.order,Object.assign({},x,{_sc:sc}))});var rows=Array.from(by.values()).filter(function(x){return x.status||x.feedback});var importantRows=rows.filter(function(x){return x._sc===2||x.feedback});if(importantRows.length)rows=importantRows;rows.sort(function(a,b){return String(a.order).localeCompare(String(b.order),'ar',{numeric:true})});el.innerHTML=rows.map(function(x){return '<tr><td>'+esc(x.order)+'</td><td>'+esc(x.zone)+'</td><td>'+esc(x.area)+'</td><td>'+esc(x.address)+'</td><td><span class=\"tag\">'+esc(x.status||'—')+'</span></td><td class=\"feedback\">'+esc(x.feedback||'')+'</td></tr>'}).join('')||'<tr><td colspan=\"6\" class=\"empty\">لا توجد بيانات بحالة مسجلة</td></tr>';}catch(e){}} ,700);setTimeout(function(){clearInterval(timer)},120000)})();";d.body.appendChild(fix)}}catch(e){console.error(e)}})})();</script></body></html>
