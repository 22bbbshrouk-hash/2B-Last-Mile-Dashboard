<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>2B Last Mile Operations Control Tower</title>
</head>
<body>
<script>
(async function () {
  try {
    var response = await fetch('./dashboard-fixed.html?v=' + Date.now(), { cache: 'no-store' });
    if (!response.ok) throw new Error('Dashboard file could not be loaded: ' + response.status);
    var html = await response.text();
    document.open();
    document.write(html);
    document.close();
  } catch (error) {
    console.error(error);
    document.body.innerHTML = '<div style="padding:30px;font-family:Arial">Dashboard failed to load.</div>';
  }
}());
</script>
</body>
</html>
