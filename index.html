<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>2B Last Mile Operations Control Tower</title>
</head>
<body>
<script>
(async()=>{
  const res=await fetch('./dashboard-fixed.html?v='+Date.now(),{cache:'no-store'});
  let html=await res.text();
  html=html.replace('</head>',`<style>.courierBtn{margin-left:8px}</style></head>`);
  html=html.replace('<label class="btn">📤 Upload Daily Excel<input id="file" class="file" type="file" accept=".xlsx,.xls,.csv"></label>',`<label class="btn">📤 Upload Daily Excel<input id="file" class="file" type="file" accept=".xlsx,.xls,.csv"></label><button id="courierSheet" class="btn courierBtn">🚚 شيت المندوب</button>`);
  html=html.replace('</body>',`<script>
(function(){
  function initCourier(){
    var btn=document.getElementById('courierSheet');
    if(!btn)return;
    btn.onclick=function(){
      if(!window.XLSX){alert('Excel library is not ready. Please refresh and try again.');return}
      if(typeof data==='undefined'||!Array.isArray(data)){alert('الداتا لم تكتمل بعد، حاول مرة أخرى بعد تحميل الشيت');return}
      var rows=data.map(function(r){
        var area=String(r.area||'').trim(),route='غير مصنف';
        try{var ri=routeFor(area);if(ri>=0&&ROUTES[ri])route=ROUTES[ri][0]}catch(e){}
        return {'Route':route,'Zone / Area':area,'Order No.':String(r.order||'').trim(),'اسم المندوب':''};
      }).filter(function(r){return r['Order No.']});
      if(!rows.length){alert('لا توجد Orders في الداتا الحالية');return}
      var wb=XLSX.utils.book_new(),ws=XLSX.utils.json_to_sheet(rows);
      XLSX.utils.book_append_sheet(wb,ws,'Courier Assignment');
      ws['!cols']=[{wch:30},{wch:24},{wch:18},{wch:24}];
      XLSX.writeFile(wb,'2B_Courier_Assignment.xlsx');
    };
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',initCourier);else initCourier();
})();
<`+'/script>');
  document.open();document.write(html);document.close();
})().catch(e=>{document.body.innerHTML='<div style="padding:30px;font-family:Arial">Dashboard failed to load.</div>';console.error(e)});
</script>
</body>
</html>
