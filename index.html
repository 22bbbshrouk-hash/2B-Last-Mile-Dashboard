<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2B Last Mile Operations Control Tower</title><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"></head><body style="margin:0;background:#07090d;color:#fff;font-family:Arial,sans-serif"><div id="boot" style="padding:30px;text-align:center">Opening 2B Dashboard…</div><script>(async function(){const boot=document.getElementById('boot');try{await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js';s.onload=resolve;s.onerror=()=>reject(new Error('SheetJS could not be loaded'));document.head.appendChild(s)});if(!window.XLSX)throw new Error('XLSX is not available');const r=await fetch('./dashboard-fixed.html?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('Dashboard file could not be loaded: '+r.status);let html=await r.text();html=html.replace(/<script\b[^>]*\bsrc=["'][^"']*xlsx[^"']*["'][^>]*><\/script>/gi,'');document.open();document.write(html);document.close()}catch(e){boot.innerHTML='<div style="padding:30px;color:#ffb477;font-weight:700">تعذر تشغيل الـDashboard: '+String(e.message||e)+'</div>'}})();</script></body></html>
