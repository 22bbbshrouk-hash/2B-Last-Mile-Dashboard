<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2B Last Mile Operations Control Tower</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
</head>
<body style="margin:0;background:#07090d;color:#fff;font-family:Arial,sans-serif">
<div style="padding:30px;text-align:center">Opening 2B Dashboard…</div>
<script>
(async function(){
  try {
    const r = await fetch('./dashboard-fixed.html?v='+Date.now(), {cache:'no-store'});
    if(!r.ok) throw new Error('Dashboard file could not be loaded: '+r.status);
    let html = await r.text();
    // Remove the broken SheetJS script from dashboard-fixed.html and inject a working CDN script before the dashboard code runs.
    html = html.replace(/<script[^>]+src=["']https:\/\/cdn\.jsdelivr\.net\/npm\/xlsx@0\.20\.3\/dist\/xlsx\.full\.min\.js["'][^>]*><\\/script>/i, '');
    const loader = '<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"><\\/script>';
    html = html.replace('</head>', loader + '</head>');
    document.open();
    document.write(html);
    document.close();
  } catch(e) {
    document.body.innerHTML = '<div style="padding:30px;color:#ffb477">تعذر تحميل الـDashboard: '+String(e.message||e)+'</div>';
  }
})();
</script>
</body>
</html>
