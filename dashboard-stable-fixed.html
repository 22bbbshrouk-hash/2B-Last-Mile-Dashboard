<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2B | Last Mile Operations Control Tower</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%2307090d'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-family='Arial' font-size='30' font-weight='900' fill='%23ff7900'%3E2B%3C/text%3E%3C/svg%3E"><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><style>html,body{margin:0;width:100%;height:100%;background:#07090d}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="stable" src="./dashboard-stable.html?v=base-stable" title="2B Last Mile Dashboard"></iframe><script>
const PUBLIC='https://wihopmnjpsfsgujugyzl.supabase.co/storage/v1/object/public/dashboard-data/Last_Mile_Data.xlsx';
const norm=v=>String(v??'').normalize('NFKC').toLowerCase().replace(/[\u064B-\u065F\u0670]/g,'').replace(/[\s_\-()./]/g,'').replace(/ى/g,'ي').replace(/ة/g,'ه').trim();
const pick=(r,names)=>{const ks=Object.keys(r);for(const n of names){const k=ks.find(x=>norm(x)===norm(n));if(k&&String(r[k]).trim()!=='')return r[k]}for(const k of ks)if(names.some(n=>norm(k).includes(norm(n))||norm(n).includes(norm(k)))&&String(r[k]).trim()!=='')return r[k];return ''};
const esc=v=>String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));
function parse(buf){const wb=XLSX.read(buf,{type:'array',raw:false}),ws=wb.Sheets[wb.SheetNames[0]];return XLSX.utils.sheet_to_json(ws,{defval:'',raw:false}).map(r=>({order:String(pick(r,['Order','Order Number','Order No','OrderNumber','OrderNo','AWB','Shipment','Shipment Number','رقم الطلب','الطلب','Ref Nbr','Ref Number'])).trim(),customer:String(pick(r,['Customer','Customer Name','Client','اسم العميل','العميل'])).trim(),phone:String(pick(r,['Phone','Customer Phone','Mobile','Telephone','رقم الهاتف','الموبايل'])).trim(),area:String(pick(r,['Area','Area Name','Region','Zone Area','المنطقة','المنطقه','Area_Name','Delivery Area'])).trim(),zone:String(pick(r,['Zone','Trip Zone','الزون','منطقة خط السير'])).trim(),address:String(pick(r,['Address','Customer Address','CustomerAddress','Delivery Address','DeliveryAddress','العنوان','عنوان العميل','عنوان التوصيل'])).trim(),sku:String(pick(r,['SKU','SKU Code','Product SKU','Item Code','رمز الصنف'])).trim(),product:String(pick(r,['Product','Product Name','Item','Description','المنتج','Item Description'])).trim(),status:String(pick(r,['Status','Delivery Status','Shipment Status','Order Status','State','الحالة','الحاله'])).trim(),feedback:String(pick(r,['Feedback','Customer Feedback','CustomerFeedback','Notes','Note','ملاحظات','الملاحظات','تعليق العميل','تعليق'])).trim(),qty:Number(String(pick(r,['QTY','Qty','Quantity','الكمية','الكميه','Units'])).replace(/,/g,''))||0,lat:Number(pick(r,['Latitude','Lat','Customer Latitude','خط العرض']))||0,lng:Number(pick(r,['Longitude','Lng','Lon','Customer Longitude','خط الطول']))||0})).filter(x=>x.order)}
function inner(){const s=document.getElementById('stable');const sd=s.contentDocument;if(!sd)return null;return sd.getElementById('dash')?.contentDocument||null}
function addUI(d){if(d.getElementById('fixedSearch'))return;const css=d.createElement('style');css.textContent='#fixedSearch,#fixedMap,#fixedWarehouse{background:#10161e;border:1px solid #26313d;border-radius:14px;padding:14px;margin-top:12px}#fixedSearch input{width:100%;box-sizing:border-box;background:#07090d;color:#fff;border:1px solid #34404d;border-radius:9px;padding:12px;font-size:13px;outline:none}#fixedResults{max-height:360px;overflow:auto;margin-top:10px}#fixedResults table{width:100%;border-collapse:collapse;font-size:11px}#fixedResults th{background:#10161e;color:#8793a3;text-align:right;padding:8px;position:sticky;top:0}#fixedResults td{padding:8px;border-bottom:1px solid #1d2630}#fixedMap{height:440px}#fixedMapBox{height:380px;border-radius:10px;overflow:hidden}#fixedWarehouse input{width:100%;box-sizing:border-box;background:#07090d;color:#fff;border:1px solid #34404d;border-radius:8px;padding:9px;margin:4px 0}#fixedWarehouse button{background:#ff7900;border:0;border-radius:8px;padding:9px 14px;font-weight:900;cursor:pointer}.warehouseNote{color:#9aa5b3;font-size:11px}';d.head.appendChild(css);const wrap=d.querySelector('.wrap')||d.body;const search=d.createElement('section');search.id='fixedSearch';search.className='card full';search.innerHTML='<h2>🔎 بحث</h2><div class="sub">بحث واحد مربوط بكل الداتا: Order · Customer · Phone · Area · Address · SKU · Product · QTY · Zone</div><input id="fixedSearchInput" placeholder="اكتبي أي معلومة من الشيت..."><div id="fixedResults"></div>';wrap.appendChild(search);const map=d.createElement('section');map.id='fixedMap';map.className='card full';map.innerHTML='<h2>🗺️ Live Area Map</h2><div class="sub">Customer + Order + Phone + Area + Address. الإحداثيات من الشيت إن وُجدت، وإلا يتم وضع النقطة على مركز المنطقة.</div><div id="fixedMapBox"></div>';wrap.appendChild(map);const wh=d.createElement('section');wh.id='fixedWarehouse';wh.className='card full';wh.innerHTML='<h2>📍 Warehouse Location</h2><div class="sub">15 مايو، بجوار سور مدينة الأبطال، بجوار سور المدرسة اليابانية.</div><input id="whAddress" value="15 مايو، بجوار سور مدينة الأبطال، بجوار سور المدرسة اليابانية"><input id="whLat" placeholder="Latitude"><input id="whLng" placeholder="Longitude"><button id="whSave">حفظ موقع المخزن على الـMap</button><div class="warehouseNote">يتم حفظ الموقع على الجهاز، ويظهر كـ Warehouse Marker على نفس الخريطة.</div>';wrap.appendChild(wh);loadLeaflet(d)}
function loadLeaflet(d){if(d.getElementById('leafletJS'))return;const l=d.createElement('link');l.rel='stylesheet';l.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';d.head.appendChild(l);const s=d.createElement('script');s.id='leafletJS';s.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';s.onload=()=>{window.setTimeout(()=>{const rows=window.__rows||[];renderMap(rows)},300)};d.head.appendChild(s)}
const areaCoords={'مدينة نصر':[30.052,31.338],'المعادي':[29.960,31.256],'المعادى':[29.960,31.256],'مدينة العبور':[30.228,31.480],'التجمع الخامس':[30.016,31.428],'القاهرة الجديدة':[30.007,31.491],'التجمع الثالث':[30.022,31.452],'السادس من أكتوبر':[29.970,30.950],'اكتوبر':[29.970,30.950],'مدينة الشيخ زايد':[30.045,30.985],'حلوان':[29.850,31.335],'15 مايو':[29.835,31.360],'المقطم':[30.016,31.315],'الهرم':[29.990,31.145],'المهندسين':[30.044,31.201],'الزيتون':[30.079,31.313],'جسر السويس':[30.111,31.337],'حدائق القبة':[30.086,31.288],'النزهة':[30.118,31.360],'المرج':[30.030,31.328],'العمرانية':[29.994,31.183],'المنيب':[29.981,31.212],'الدقي':[30.038,31.212],'السلام':[30.180,31.405]};
function resultHTML(rows,q){const qq=norm(q);const hits=qq?rows.filter(r=>Object.values(r).some(v=>norm(v).includes(qq))):[];if(!qq)return '';return '<table><thead><tr><th>Order</th><th>Customer</th><th>Phone</th><th>Area</th><th>Address</th><th>SKU</th><th>Product</th><th>QTY</th><th>Zone</th></tr></thead><tbody>'+hits.slice(0,300).map(r=>`<tr><td>${esc(r.order)}</td><td>${esc(r.customer)}</td><td>${esc(r.phone)}</td><td>${esc(r.area)}</td><td>${esc(r.address)}</td><td>${esc(r.sku)}</td><td>${esc(r.product)}</td><td>${r.qty}</td><td>${esc(r.zone)}</td></tr>`).join('')+'</tbody></table><div class="sub">${hits.length} نتيجة</div>'}
function renderMap(rows){const d=inner();if(!d||!d.getElementById('fixedMapBox')||!d.defaultView.L)return;let map=window.__map;if(!map){map=d.defaultView.L.map(d.getElementById('fixedMapBox')).setView([30.02,31.30],10);d.defaultView.L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);window.__map=map}if(window.__markers)window.__markers.forEach(m=>m.remove());window.__markers=[];rows.forEach(r=>{const p=r.lat&&r.lng?[r.lat,r.lng]:areaCoords[r.area];if(!p)return;const m=d.defaultView.L.marker(p).addTo(map);m.bindPopup(`<b>${esc(r.customer||'Customer')}</b><br>Order: ${esc(r.order)}<br>Phone: ${esc(r.phone)}<br>Area: ${esc(r.area)}<br>Address: ${esc(r.address)}`);window.__markers.push(m)});let lat=Number(localStorage.getItem('whLat')),lng=Number(localStorage.getItem('whLng'));if(lat&&lng){const wm=d.defaultView.L.marker([lat,lng]).addTo(map);wm.bindPopup('<b>🏭 Warehouse</b><br>15 مايو، بجوار سور مدينة الأبطال، بجوار سور المدرسة اليابانية.').openPopup();window.__markers.push(wm)}}
function patch(rows){const d=inner();if(!d)return;window.__rows=rows;addUI(d);const fol=d.getElementById('follow');if(fol){const head=fol.closest('table')?.querySelector('thead tr');if(head)head.innerHTML='<th>Order</th><th>Zone</th><th>Area</th><th>Address</th><th>Customer Feedback</th>';const one=new Map();rows.forEach(r=>{if(!one.has(r.order))one.set(r.order,{...r});else if(!one.get(r.order).feedback&&r.feedback)one.get(r.order).feedback=r.feedback});const list=[...one.values()].filter(r=>r.feedback);fol.innerHTML=list.map(r=>`<tr><td>${esc(r.order)}</td><td>${esc(r.zone)}</td><td>${esc(r.area)}</td><td>${esc(r.address)}</td><td style="font-weight:900">${esc(r.feedback)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">لا توجد Customer Feedback مسجلة</td></tr>'}const inp=d.getElementById('fixedSearchInput');if(inp&&!inp.dataset.bound){inp.dataset.bound='1';inp.oninput=()=>d.getElementById('fixedResults').innerHTML=resultHTML(window.__rows,inp.value)}const save=d.getElementById('whSave');if(save&&!save.dataset.bound){save.dataset.bound='1';save.onclick=()=>{localStorage.setItem('whAddress',d.getElementById('whAddress').value);localStorage.setItem('whLat',d.getElementById('whLat').value);localStorage.setItem('whLng',d.getElementById('whLng').value);renderMap(rows)}}const la=localStorage.getItem('whLat'),lo=localStorage.getItem('whLng');if(la)d.getElementById('whLat').value=la;if(lo)d.getElementById('whLng').value=lo;renderMap(rows);const f=d.getElementById('file');if(f&&!f.dataset.fixedBound){f.dataset.fixedBound='1';f.addEventListener('change',async e=>{const file=e.target.files?.[0];if(file){patch(parse(await file.arrayBuffer()))}})}}
async function run(){try{const r=await fetch(PUBLIC+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error();patch(parse(await r.arrayBuffer()))}catch(e){console.warn('stable fixed patch',e)}}
const s=document.getElementById('stable');s.addEventListener('load',()=>{run();[1200,3000,6000,10000,15000].forEach(t=>setTimeout(run,t))});
</script></body></html>
