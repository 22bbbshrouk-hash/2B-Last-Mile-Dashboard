<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2B | Last Mile Operations Control Tower</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2307090d'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-family='Arial' font-size='30' font-weight='900' fill='%23ff7900'%3E2B%3C/text%3E%3C/svg%3E"><style>html,body{margin:0;width:100%;height:100%;background:#07090d}#dash{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="dash" src="dashboard-final.html?v=20260820-manual-final-7" title="2B Last Mile Dashboard"></iframe><script>
(function(){
const I=document.getElementById('dash');
const COLORS=['#ff7900','#27a7ff','#45d69c','#c77dff','#ff5d66','#ffd166','#00c2a8','#f78fb3','#8bd450','#9aa7ff'];
const FN='https://wihopmnjpsfsgujugyzl.supabase.co/functions/v1/upload-dashboard';
const KEY='sb_publishable_d_iGTrKLgLx3Ntn-xExJhw_teic9wsl';
const GROUPS=[['East Cairo',['العبور','الشروق','مدينتي','العاصمة الادارية الجديدة','العاصمة الإدارية الجديدة','بدر']],['New Cairo',['القاهرة الجديدة','التجمع','التجمع الأول','التجمع الاول','التجمع الثالث','التجمع الخامس','الرحاب']],['Central Cairo',['وسط البلد','باب الشعرية','الضاهر','دار السلام','شبرا مصر','السيدة زينب']],['West Cairo',['ترسا','الجيزة','فيصل','العمرانية','الهرم','أبو نمرس','ابو نمرس']],['October / Zayed',['حدائق أكتوبر','حدائق اكتوبر','6 أكتوبر','السادس من أكتوبر','الشيخ زايد','زايد','حدائق الأهرام','حدائق الاهرام']],['Maadi / Helwan / Mokattam',['المعادي','المعادى','حلوان','مايو','المقطم','زهراء المعادي']],['Old Cairo',['مصر القديمة','السيدة عائشة']],['Heliopolis / Nasr City',['مصر الجديدة','النزهة','روكسي','جسر السويس','حدائق القبة','الزيتون','المطرية','عين شمس','عين شمس- الشرقية','عزبة النخل','مدينة نصر']],['North East',['الخانكة','المرج']],['North Coast',['الساحل الشمالى','الساحل الشمالي']]];
function norm(s){return String(s||'').normalize('NFKC').toLowerCase().replace(/[\u064B-\u065F\u0670]/g,'').replace(/[\s_\-()./]/g,'').replace(/ى/g,'ي').replace(/ة/g,'ه').trim()}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function dist(a,b){let p=Array(b.length+1).fill(0).map((_,i)=>i);for(let i=1;i<=a.length;i++){let c=[i];for(let j=1;j<=b.length;j++)c[j]=Math.min(c[j-1]+1,p[j]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[b.length]}
const CAN=[];GROUPS.forEach(([g,list])=>list.forEach(a=>CAN.push([norm(a),a.replace('ابو نمرس','أبو نمرس').replace('حدائق اكتوبر','حدائق أكتوبر').replace('الساحل الشمالى','الساحل الشمالي'),g])));
function canon(a){let n=norm(a),hit=CAN.find(x=>x[0]===n);if(hit)return hit[1];let best=null,bd=99;CAN.forEach(x=>{let d=dist(n,x[0]),lim=Math.max(1,Math.floor(Math.min(n.length,x[0].length)*.25));if(d<bd&&d<=lim){bd=d;best=x}});return best?best[1]:String(a||'غير محدد').trim()}
function group(a){let c=canon(a),n=norm(c),x=CAN.find(v=>v[0]===n);return x?x[2]:'Other'}
function safeMap2(d){const m=d.getElementById('map2');if(!m)return;const s=m.closest('section');if(s){s.style.display='none';s.setAttribute('aria-hidden','true')}m.style.visibility='hidden';m.style.position='absolute';m.style.width='1px';m.style.height='1px'}
function branding(d){d.title='2B | Last Mile Operations Control Tower';let f=d.querySelector('link[rel="icon"]');if(!f){f=d.createElement('link');f.rel='icon';d.head.appendChild(f)}f.href='data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"%3E%3Crect width="64" height="64" rx="12" fill="%2307090d"/%3E%3Ctext x="32" y="44" text-anchor="middle" font-family="Arial" font-size="30" font-weight="900" fill="%23ff7900"%3E2B%3C/text%3E%3C/svg%3E';const l=d.querySelector('.logo');if(l){l.textContent='2B';l.style.cssText+=';width:58px;height:58px;display:flex;align-items:center;justify-content:center;border:2px solid #ff7900;border-radius:14px;background:linear-gradient(145deg,#171008,#0d1117);box-shadow:0 0 0 3px #ff79001a,0 8px 24px #0008;font-size:29px!important;font-weight:1000!important;letter-spacing:-3px!important;color:#ff7900!important'}}
function rowsFromDetails(d){let a=[];d.querySelectorAll('#details tr').forEach(t=>{if(t.children.length<6)return;let c=[...t.children].map(x=>x.textContent.trim());if(c[2])a.push({zone:c[0],area:canon(c[1]),order:c[2],sku:c[3],product:c[4],qty:Number(c[5])||1})});return a}
function details(d,rs){let b=d.getElementById('details');if(!b)return;let m=new Map();rs.forEach(r=>{let k=r.area+'\u0000'+r.order;if(!m.has(k))m.set(k,[]);m.get(k).push(r)});let areas=new Map();[...m].forEach(([k,v])=>{let a=v[0].area;if(!areas.has(a))areas.set(a,[]);areas.get(a).push(...v)});let html='',ai=0;[...areas].sort((a,b)=>GROUPS.findIndex(x=>x[0]===group(a[0]))-GROUPS.findIndex(x=>x[0]===group(b[0]))||a[0].localeCompare(b[0],'ar')).forEach(([a,items])=>{let c=COLORS[ai++%COLORS.length];items.sort((x,y)=>String(x.order).localeCompare(String(y.order))||String(x.sku).localeCompare(String(y.sku)));items.forEach(r=>html+=`<tr style="background:${c}10;border-right:5px solid ${c}"><td>${esc(group(a))}</td><td style="color:${c};font-weight:900">${esc(a)}</td><td>${esc(r.order)}</td><td>${esc(r.sku)}</td><td>${esc(r.product)}</td><td>${r.qty}</td></tr>`)});b.innerHTML=html||'<tr><td colspan="6" class="empty">لا توجد بيانات</td></tr>'}
function ranking(d,rs){let b=d.getElementById('areaRank');if(!b)return;let m=new Map();rs.forEach(r=>{if(!m.has(r.area))m.set(r.area,new Set());m.get(r.area).add(r.order)});let a=[...m].map(([x,s])=>[x,s.size]).sort((p,q)=>q[1]-p[1]||p[0].localeCompare(q[0],'ar')),mx=Math.max(1,...a.map(x=>x[1]));b.innerHTML=a.map(([x,n],i)=>{let c=COLORS[i%COLORS.length];return `<div class="areaRow" style="background:${c}10;border-right:5px solid ${c};border-radius:8px;padding:5px 8px"><div class="areaName" style="color:#fff;font-weight:900">${esc(x)}</div><div class="barbg"><div class="barfill" style="width:${n/mx*100}%;background:linear-gradient(90deg,${c},${c}99)"></div></div><div class="count" style="color:${c}">${n}</div></div>`}).join('')||'<div class="empty">لا توجد بيانات</div>'}
function routes(d,rs){let z=new Map();rs.forEach(r=>{let g=group(r.area);if(!z.has(g))z.set(g,{areas:new Set(),orders:new Set(),skus:new Set(),qty:0,ac:0});let x=z.get(g);x.areas.add(r.area);x.orders.add(r.order);x.skus.add(r.sku);x.qty+=r.qty;if(/(^|\s)ac(\s|$)|تكييف|air\s*condition/i.test(r.product))x.ac+=r.qty});let zs=[...z].map(([zone,x])=>({...x,zone,areas:[...x.areas]}));let s=d.getElementById('zoneSummary');if(s)s.innerHTML=zs.map((x,i)=>`<div class="zoneCard" style="border-right:7px solid ${COLORS[i%COLORS.length]};background:${COLORS[i%COLORS.length]}14"><div class="zoneTitle" style="color:${COLORS[i%COLORS.length]}">${esc(x.zone)}</div><div class="muted">${esc(x.areas.join(' · '))}</div><div class="muted">Orders <b>${x.orders.size}</b> · SKU <b>${x.skus.size}</b> · QTY <b>${x.qty}</b> · AC <b>${x.ac}</b> · Vehicles <b>${x.ac?Math.ceil(x.ac/13):0}</b></div></div>`).join('');let r=d.getElementById('routes');if(r)r.innerHTML=zs.map((x,i)=>`<div class="routeCard"><div class="routeHead"><div><div class="routeTitle">🛣️ Route ${String(i+1).padStart(2,'0')} — ${esc(x.zone)}</div><div class="muted">Areas: ${esc(x.areas.join(' · '))} · Orders: <b>${x.orders.size}</b> · SKU: <b>${x.skus.size}</b> · QTY: <b>${x.qty}</b></div></div><span class="vehicle">🚚 ${x.ac?Math.ceil(x.ac/13):'حسب الحمولة'}${x.ac?' دبابة':''}</span></div><div class="muted" style="margin-top:7px">AC Load: <b>${x.ac}</b> / 13 per دبابة</div></div>`).join('')}
function follow(d,rs){let b=d.getElementById('follow');if(!b)return;let seen=new Set(),out=[];rs.forEach(r=>{if(seen.has(r.order))return;seen.add(r.order);let tr=[...d.querySelectorAll('#details tr')].find(t=>t.children[2]?.textContent.trim()===r.order);let status=tr?.children[5]?.textContent.trim()||'';out.push({r,status})});b.innerHTML=out.map(x=>`<tr><td>${esc(x.r.order)}</td><td>${esc(group(x.r.area))}</td><td>${esc(x.r.area)}</td><td>${esc(x.r.address||'غير محدد')}</td><td>${esc(x.status||'—')}</td><td><span class="tag">${esc(x.r.feedback||'—')}</span></td></tr>`).join('')||'<tr><td colspan="6" class="empty">لا توجد بيانات</td></tr>'}
function paint(){let d=I.contentDocument;if(!d)return;try{safeMap2(d);branding(d);let rs=rowsFromDetails(d);if(!rs.length)return;details(d,rs);rs=rowsFromDetails(d);ranking(d,rs);routes(d,rs);follow(d,rs)}catch(e){console.error(e)}}
function hook(d){let input=d.getElementById('file');if(input&&!input.dataset.fix){input.dataset.fix='1';input.onchange=async()=>{let f=input.files?.[0];if(!f)return;try{d.getElementById('dataStatus').textContent='جاري رفع شيت اليوم...';let r=await fetch(FN,{method:'POST',headers:{apikey:KEY,'Content-Type':f.type||'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'},body:f});if(!r.ok)throw Error(await r.text());await d.defaultView.readBuffer(await f.arrayBuffer());paint();d.getElementById('dataStatus').textContent='تم رفع شيت اليوم وتحديث الداشبورد ✓';alert('تم رفع الشيت بنجاح ❤️')}catch(e){alert('مشكلة في رفع الملف: '+(e.message||'غير معروفة'))}}}let ref=d.getElementById('refresh');if(ref&&!ref.dataset.fix){ref.dataset.fix='1';ref.onclick=async()=>{try{let r=await fetch(FN+'?v='+Date.now(),{headers:{apikey:KEY},cache:'no-store'});if(!r.ok)throw Error();await d.defaultView.readBuffer(await r.arrayBuffer());paint()}catch(e){d.getElementById('dataStatus').textContent='لا يوجد شيت محفوظ — ارفعي شيت اليوم.'}}}}
I.addEventListener('load',()=>{hook(I.contentDocument);paint();[500,1200,2500,5000].forEach(t=>setTimeout(()=>{hook(I.contentDocument);paint()},t))});
})();</script></body></html>
