<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2B | Last Mile Operations Control Tower</title><style>html,body{margin:0;width:100%;height:100%;background:#07090d}#dash{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="dash" src="dashboard-final.html?v=20260820-manual-final-5" title="2B Last Mile Dashboard"></iframe><script>
(function(){
const I=document.getElementById('dash');
const COLORS=['#ff7900','#27a7ff','#45d69c','#c77dff','#ff5d66','#ffd166','#00c2a8','#f78fb3','#8bd450','#9aa7ff','#6dd5ed','#f6a6ff','#a8e063','#ff8a65','#64b5f6','#81d4a3','#ba68c8','#ffd54f','#4dd0e1','#ef5350'];
const FN='https://wihopmnjpsfsgujugyzl.supabase.co/functions/v1/upload-dashboard';
const KEY='sb_publishable_d_iGTrKLgLx3Ntn-xExJhw_teic9wsl';
function canon(s){return String(s||'').normalize('NFKC').replace(/[\u064B-\u065F\u0670]/g,'').replace(/\s+/g,' ').trim().replace(/مدينه\s*نصر/gi,'مدينة نصر').replace(/المعادى/gi,'المعادي').replace(/حدائق\s*اكتوبر/gi,'حدائق أكتوبر').replace(/ارض\s*اللواء/gi,'أرض اللواء').replace(/حدائق\s*الاهرام/gi,'حدائق الأهرام').replace(/الساحل\s*الشمالى/gi,'الساحل الشمالي')}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function cmap(d){const a=[];(d.defaultView.rows||[]).forEach(r=>{const x=canon(r.area);if(x&&x!=='غير محدد'&&!a.includes(x))a.push(x)});return new Map(a.map((x,i)=>[x,COLORS[i%COLORS.length]]))}
function keepMap2Safe(d){const m=d.getElementById('map2');if(!m)return;const s=m.closest('section');if(s){s.style.display='none';s.setAttribute('aria-hidden','true')}m.style.display='block';m.style.height='1px';m.style.width='1px';m.style.visibility='hidden';m.style.position='absolute';m.style.left='-99999px'}
function logo(d){let st=d.getElementById('shroukLogoFix');if(!st){st=d.createElement('style');st.id='shroukLogoFix';d.head.appendChild(st)}st.textContent='.logo{width:58px;height:58px;display:flex;align-items:center;justify-content:center;border:2px solid #ff7900;border-radius:14px;background:linear-gradient(145deg,#171008,#0d1117);box-shadow:0 0 0 3px #ff79001a,0 8px 24px #0008;font-size:29px!important;font-weight:1000!important;letter-spacing:-3px!important;color:#ff7900!important;text-shadow:0 0 12px #ff790055}.brand{gap:14px}.title h1{font-weight:1000!important}'}
function legend(d,map){const m=d.getElementById('map1');if(!m)return;let l=d.getElementById('areaColorLegend');if(!l){l=d.createElement('div');l.id='areaColorLegend';l.style.cssText='margin-top:10px;padding:10px;background:#0c1117;border:1px solid #26313d;border-radius:10px;display:flex;flex-wrap:wrap;gap:7px;font-size:10px;font-weight:900';m.parentNode.appendChild(l)}l.innerHTML=[...map].map(([a,c])=>`<span style="display:inline-flex;align-items:center;gap:6px;padding:5px 8px;border:1px solid ${c};border-radius:8px;color:#fff"><i style="width:10px;height:10px;border-radius:50%;background:${c};display:inline-block"></i>${esc(a)}</span>`).join('')}
function rank(d,map){const el=d.getElementById('areaRank');if(!el)return;[...el.querySelectorAll('.areaRow')].forEach(r=>{const n=r.querySelector('.areaName'),q=r.querySelector('.count');if(!n||!q)return;const a=canon(n.textContent),c=map.get(a)||COLORS[0];n.textContent=a;r.style.cssText+=`;background:${c}18;border-right:5px solid ${c};border-radius:8px;padding:5px 8px`;n.style.color='#fff';n.style.fontWeight='900';q.style.color=c;q.style.fontWeight='1000';const f=r.querySelector('.barfill');if(f)f.style.background=`linear-gradient(90deg,${c},${c}99)`})}
function summary(d,map){const sec=[...d.querySelectorAll('section')].find(s=>/Operational Trip Zone Summary/i.test(s.querySelector('h2')?.textContent||''));if(!sec)return;[...sec.querySelectorAll('.zoneCard')].forEach(card=>{const a=[...map.keys()].find(x=>(card.textContent||'').includes(x));if(!a)return;const c=map.get(a);card.style.cssText+=`;border-right:7px solid ${c};background:${c}14`;const t=card.querySelector('.zoneTitle');if(t)t.style.color=c})}
function details(d,map){const b=d.getElementById('details');if(!b)return;[...b.querySelectorAll('tr')].forEach(tr=>{if(tr.children.length<6)return;const a=canon(tr.children[1].textContent),c=map.get(a)||COLORS[0];tr.children[1].textContent=a;tr.style.background=c+'10';tr.style.borderRight='5px solid '+c;tr.children[1].style.background=c+'30';tr.children[1].style.color='#fff';tr.children[1].style.fontWeight='900'})}
async function loadLatest(d){const st=d.getElementById('dataStatus');try{st.textContent='جاري تحميل آخر شيت...';const r=await fetch(FN+'?v='+Date.now(),{cache:'no-store',headers:{apikey:KEY}});if(!r.ok)throw new Error('Download '+r.status+': '+await r.text());await d.defaultView.readBuffer(await r.arrayBuffer());st.textContent='تم تحميل آخر شيت محفوظ ✓';paint()}catch(e){console.error(e);st.textContent='لا يوجد شيت محفوظ — ارفعي شيت اليوم.'}}
async function upload(d,file){const st=d.getElementById('dataStatus');try{st.textContent='جاري رفع شيت اليوم...';const r=await fetch(FN,{method:'POST',headers:{apikey:KEY,'Content-Type':file.type||'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'},body:file});const text=await r.text();if(!r.ok)throw new Error('Upload '+r.status+': '+text);st.textContent='تم حفظ الشيت ✓ جاري تحديث الداشبورد...';await d.defaultView.readBuffer(await file.arrayBuffer());paint();st.textContent='تم رفع شيت اليوم وتحديث الداشبورد ✓';alert('تم رفع الشيت بنجاح ❤️')}catch(e){console.error(e);st.textContent='حصلت مشكلة أثناء الرفع';alert('مشكلة في رفع الملف: '+(e.message||'غير معروفة'))}}
function hook(d){const input=d.getElementById('file');if(input&&!input.dataset.manualFixed){input.dataset.manualFixed='1';input.onchange=()=>{const f=input.files?.[0];if(!f)return;if(!/\.xlsx?$|excel|spreadsheet/i.test(f.name+' '+f.type)){alert('اختاري ملف Excel بصيغة XLSX أو XLS');input.value='';return}upload(d,f)}}const refresh=d.getElementById('refresh');if(refresh&&!refresh.dataset.manualFixed){refresh.dataset.manualFixed='1';refresh.onclick=()=>loadLatest(d)}}
function paint(){const d=I.contentDocument;if(!d)return;try{keepMap2Safe(d);logo(d);const m=cmap(d);rank(d,m);summary(d,m);details(d,m);legend(d,m);hook(d)}catch(e){console.error(e)}}
I.addEventListener('load',async()=>{paint();await loadLatest(I.contentDocument);[500,1200,2500,5000].forEach(t=>setTimeout(paint,t))});
})();</script></body></html>
