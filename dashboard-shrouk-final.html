<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2B | Last Mile Operations Control Tower</title><style>html,body{margin:0;width:100%;height:100%;background:#07090d}#dash{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="dash" src="dashboard-final.html?v=20260820-final" title="2B Last Mile Dashboard"></iframe><script>
(function(){const I=document.getElementById('dash');
const COLORS=['#ff7900','#27a7ff','#45d69c','#c77dff','#ff5d66','#ffd166','#00c2a8','#f78fb3','#8bd450','#9aa7ff'];
function canon(s){return String(s||'').normalize('NFKC').replace(/[\u064B-\u065F\u0670]/g,'').replace(/\s+/g,' ').trim().replace(/مدينه\s*نصر/gi,'مدينة نصر').replace(/المعادى/gi,'المعادي').replace(/حدائق\s*اكتوبر/gi,'حدائق أكتوبر').replace(/ارض\s*اللواء/gi,'أرض اللواء').replace(/حدائق\s*الاهرام/gi,'حدائق الأهرام').replace(/الساحل\s*الشمالى/gi,'الساحل الشمالي')}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function removeMap2(doc){[...doc.querySelectorAll('h1,h2,h3,.sub')].forEach(el=>{if(/Map\s*2\s*[—-]\s*Trip Zones\s*&\s*Routes|Map\s*2/i.test(el.textContent||'')){let s=el.closest('section');if(s){s.remove();}else{el.style.display='none';if(el.nextElementSibling)el.nextElementSibling.style.display='none'}}});const m=doc.getElementById('map2');if(m){const s=m.closest('section');if(s)s.remove();else m.remove()}}
function dedupeRank(doc){const rank=doc.getElementById('areaRank');if(!rank)return;const seen=new Map();[...rank.querySelectorAll('.areaRow')].forEach(r=>{const n=r.querySelector('.areaName'),c=r.querySelector('.count');if(!n||!c)return;const k=canon(n.textContent);n.textContent=k;const v=Number((c.textContent||'').replace(/[^0-9.-]/g,''))||0;if(seen.has(k)){const old=seen.get(k),oc=old.querySelector('.count');oc.textContent=String((Number(oc.textContent)||0)+v);r.remove()}else{seen.set(k,r)}})}
function colorDetails(doc){const body=doc.querySelector('#details');if(!body)return;const map=new Map();let idx=0;[...body.querySelectorAll('tr')].forEach(tr=>{if(!tr.children.length)return;const areaCell=tr.children[1];if(!areaCell)return;const area=canon(areaCell.textContent);areaCell.textContent=area;if(!map.has(area)){map.set(area,COLORS[idx++%COLORS.length]);}const color=map.get(area);tr.style.background=color+'18';tr.style.borderRight='5px solid '+color;[...tr.children].forEach(td=>{td.style.borderBottom='1px solid '+color+'55'});areaCell.style.background=color+'35';areaCell.style.color='#fff';areaCell.style.fontWeight='900';});let prev='';[...body.querySelectorAll('tr')].forEach(tr=>{const area=canon(tr.children[1]?.textContent||'');if(!area||area===prev)return;const color=map.get(area);const g=doc.createElement('tr');g.className='area-group-header';g.innerHTML='<td colspan="6" style="padding:10px 12px;background:'+color+';color:#111;font-weight:1000;font-size:11px;border-radius:6px">'+esc(area)+'</td>';tr.parentNode.insertBefore(g,tr);prev=area})}
function normalizeAll(doc){removeMap2(doc);dedupeRank(doc);colorDetails(doc)}
I.addEventListener('load',()=>{const start=()=>{try{const d=I.contentDocument;normalizeAll(d);const obs=new MutationObserver(()=>{removeMap2(d);dedupeRank(d);colorDetails(d)});obs.observe(d.body,{childList:true,subtree:true});[500,1500,3000,5000,8000].forEach(t=>setTimeout(()=>normalizeAll(d),t))}catch(e){console.error(e)}};start()});
})();</script></body></html>
