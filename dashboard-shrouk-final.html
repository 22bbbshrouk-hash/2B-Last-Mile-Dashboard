<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2B | Last Mile Operations Control Tower</title><style>html,body{margin:0;width:100%;height:100%;background:#07090d}#dash{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="dash" src="dashboard-final.html?v=20260820-final" title="2B Last Mile Dashboard"></iframe><script>
(function(){
const I=document.getElementById('dash');
const SB='https://wihopmnjpsfsgujugyzl.supabase.co',KEY='sb_publishable_d_iGTrKLgLx3Ntn-xExJhw_teic9wsl',BUCKET='dashboard-data',FILE='Last_Mile_Data.xlsx';
const COLORS=['#ff7900','#27a7ff','#45d69c','#c77dff','#ff5d66','#ffd166','#00c2a8','#f78fb3','#8bd450','#9aa7ff','#6dd5ed','#f6a6ff','#a8e063','#ff8a65','#64b5f6','#81d4a3','#ba68c8','#ffd54f','#4dd0e1','#ef5350'];
function canon(s){return String(s||'').normalize('NFKC').replace(/[\u064B-\u065F\u0670]/g,'').replace(/\s+/g,' ').trim().replace(/مدينه\s*نصر/gi,'مدينة نصر').replace(/المعادى/gi,'المعادي').replace(/حدائق\s*اكتوبر/gi,'حدائق أكتوبر').replace(/ارض\s*اللواء/gi,'أرض اللواء').replace(/حدائق\s*الاهرام/gi,'حدائق الأهرام').replace(/الساحل\s*الشمالى/gi,'الساحل الشمالي')}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function removeMap2(d){const m=d.getElementById('map2');if(m){const s=m.closest('section');if(s)s.remove();else m.remove()}[...d.querySelectorAll('h1,h2,h3,.sub')].forEach(e=>{if(/Map\s*2\s*[—-]\s*Trip Zones\s*&\s*Routes/i.test(e.textContent||'')){const s=e.closest('section');if(s)s.remove()}})}
function getRows(d){return (d.defaultView.rows||[]).map(r=>({...r,area:canon(r.area)})).filter(r=>r.area&&r.area!=='غير محدد')}
function colors(d){const a=[];getRows(d).forEach(r=>{if(!a.includes(r.area))a.push(r.area)});return new Map(a.map((x,i)=>[x,COLORS[i%COLORS.length]]))}
function addLegend(d,map){const m=d.getElementById('map1');if(!m)return;let l=d.getElementById('areaColorLegend');if(!l){l=d.createElement('div');l.id='areaColorLegend';l.style.cssText='margin-top:10px;padding:10px;background:#0c1117;border:1px solid #26313d;border-radius:10px;display:flex;flex-wrap:wrap;gap:7px;font-size:10px;font-weight:900';m.parentNode.appendChild(l)}l.innerHTML=[...map.entries()].map(([a,c])=>`<span style="display:inline-flex;align-items:center;gap:6px;padding:5px 8px;border:1px solid ${c};border-radius:8px;color:#fff"><i style="width:10px;height:10px;border-radius:50%;background:${c};display:inline-block"></i>${esc(a)}</span>`).join('')}
function paintRank(d,map){const el=d.getElementById('areaRank');if(!el)return;const seen=new Map();[...el.querySelectorAll('.areaRow')].forEach(r=>{const n=r.querySelector('.areaName'),c=r.querySelector('.count');if(!n||!c)return;const a=canon(n.textContent);n.textContent=a;const v=Number(c.textContent.replace(/[^0-9.-]/g,''))||0;if(seen.has(a)){const old=seen.get(a);old.querySelector('.count').textContent=String(Number(old.querySelector('.count').textContent||0)+v);r.remove()}else seen.set(a,r)});seen.forEach((r,a)=>{const c=map.get(a)||COLORS[0];r.style.cssText+=`;background:${c}18;border-right:5px solid ${c};border-radius:8px;padding:5px 8px`;r.querySelector('.areaName').style.cssText+=`;color:#fff;font-weight:900`;r.querySelector('.count').style.cssText+=`;color:${c};font-weight:1000`;const fill=r.querySelector('.barfill');if(fill)fill.style.background=`linear-gradient(90deg,${c},${c}99)`})}
function paintSummary(d,map){const sec=[...d.querySelectorAll('section')].find(s=>/Operational Trip Zone Summary/i.test(s.querySelector('h2')?.textContent||''));if(!sec)return;[...sec.querySelectorAll('.zoneCard')].forEach(card=>{const area=[...map.keys()].find(a=>(card.textContent||'').includes(a));if(!area)return;const c=map.get(area);card.style.cssText+=`;border-right:7px solid ${c};background:${c}14`;const title=card.querySelector('.zoneTitle');if(title)title.style.color=c})}
function paintDetails(d,map){const body=d.getElementById('details');if(!body)return;let last='';[...body.querySelectorAll('tr')].forEach(tr=>{if(!tr.children.length||tr.children.length<6)return;const area=canon(tr.children[1].textContent);tr.children[1].textContent=area;const c=map.get(area)||COLORS[0];tr.style.background=c+'10';tr.style.borderRight='5px solid '+c;tr.children[1].style.background=c+'30';tr.children[1].style.color='#fff';tr.children[1].style.fontWeight='900';if(area!==last){const g=d.createElement('tr');g.className='area-color-header';g.innerHTML=`<td colspan="6" style="padding:9px 12px;background:${c};color:#111;font-weight:1000">${esc(area)}</td>`;tr.parentNode.insertBefore(g,tr);last=area}})}
function paint(d){try{removeMap2(d);const cm=colors(d);paintRank(d,cm);paintSummary(d,cm);paintDetails(d,cm);addLegend(d,cm);fixUpload(d)}catch(e){console.error(e)}}
async function directUpload(d,file){const w=d.defaultView;if(!file)return;const status=d.getElementById('dataStatus');try{if(status)status.textContent='جاري رفع شيت اليوم...';const url=SB+'/storage/v1/object/'+BUCKET+'/'+encodeURIComponent(FILE);const headers={apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':file.type||'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet','x-upsert':'true','cache-control':'no-cache'};let response=await fetch(url,{method:'POST',headers,body:file});if(!response.ok)response=await fetch(url,{method:'PUT',headers,body:file});if(!response.ok){const msg=await response.text();throw new Error('Upload '+response.status+': '+msg)}if(status)status.textContent='تم حفظ الشيت بنجاح ✓ جاري تحديث الداشبورد...';if(typeof w.readBuffer==='function'){await w.readBuffer(await file.arrayBuffer())}else{w.location.href='dashboard-final.html?v='+Date.now()}setTimeout(()=>{if(status)status.textContent='تم رفع شيت اليوم وتحديث الداشبورد ✓'},500);alert('تم رفع الشيت بنجاح ❤️')}catch(e){console.error(e);if(status)status.textContent='حصلت مشكلة أثناء الرفع';alert('مشكلة في رفع الملف: '+(e.message||'غير معروفة'))}}
function fixUpload(d){const input=d.getElementById('file');if(!input||input.dataset.fixed==='1')return;input.dataset.fixed='1';input.onchange=()=>{const f=input.files&&input.files[0];if(!f)return;if(!/\.xlsx?$|excel|spreadsheet/i.test(f.name+' '+f.type)){alert('اختاري ملف Excel بصيغة XLSX أو XLS');input.value='';return}directUpload(d,f)}}
I.addEventListener('load',()=>{const run=()=>{const d=I.contentDocument;if(!d)return;paint(d);[500,1200,2500,5000].forEach(t=>setTimeout(()=>paint(d),t));if(d.body&&!d.body.dataset.observed){d.body.dataset.observed='1';new MutationObserver(()=>paint(d)).observe(d.body,{childList:true,subtree:true})}};run()});
})();</script></body></html>
