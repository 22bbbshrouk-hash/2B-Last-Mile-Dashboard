<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2B | Last Mile Operations Control Tower</title><style>html,body{margin:0;width:100%;height:100%;background:#07090d}#dash{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="dash" src="dashboard-final.html?v=20260820-final" title="2B Last Mile Dashboard"></iframe><script>
(function(){const I=document.getElementById('dash');
const COLORS=['#ff7900','#27a7ff','#45d69c','#c77dff','#ff5d66','#ffd166','#00c2a8','#f78fb3','#8bd450','#9aa7ff'];
function canon(s){return String(s||'').replace(/[\u064B-\u065F\u0670]/g,'').trim().replace(/مدينه\s*نصر/gi,'مدينة نصر').replace(/المعادى/gi,'المعادي').replace(/حدائق\s*اكتوبر/gi,'حدائق أكتوبر').replace(/ارض\s*اللواء/gi,'أرض اللواء').replace(/حدائق\s*الاهرام/gi,'حدائق الأهرام')}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function enhance(doc){try{
 const w=doc.defaultView; const map1=doc.getElementById('map1'),map2=doc.getElementById('map2');
 if(map2){map2.style.display='none';const h=map2.previousElementSibling;if(h)h.style.display='none';const p=map2.parentElement;if(p&&p.children.length<=3)p.style.display='none'}
 if(map1){const h=map1.previousElementSibling;if(h){h.querySelector('h2')&&(h.querySelector('h2').textContent='🗺️ Route Map — Areas & Stops');h.querySelector('.sub')&&(h.querySelector('.sub').textContent='خط السير 1 → 2 → 3 حسب المناطق. مرري على الـStop لمعرفة عدد الـOrders واضغطي للتفاصيل.')};map1.style.display='block'}
 const rows=w.rows||[],coords=w.coords||{},zoneFn=w.groupFor; const normalized=rows.map(r=>({...r,area:canon(r.area)})).filter(r=>r.area);
 const byZone={};normalized.forEach(r=>{const z=(r.zone||(zoneFn?zoneFn(r.area):'Other'))||'Other';if(!byZone[z])byZone[z]={rows:[],areas:{},orders:new Set()};byZone[z].rows.push(r);if(r.order)byZone[z].orders.add(String(r.order));if(!byZone[z].areas[r.area])byZone[z].areas[r.area]={orders:new Set(),coords:coords[r.area]};if(r.order)byZone[z].areas[r.area].orders.add(String(r.order))});
 const zones=Object.entries(byZone).map(([zone,x])=>({zone,...x,orders:x.orders.size,areas:Object.entries(x.areas).filter(([,v])=>v.coords).sort((a,b)=>b[1].orders.size-a[1].orders.size)})).filter(z=>z.areas.length).sort((a,b)=>b.orders-a.orders);
 if(w.m1){w.m1.eachLayer(l=>{if(!(l instanceof w.L.TileLayer))w.m1.removeLayer(l)});const bounds=[];zones.forEach((z,zi)=>{const color=COLORS[zi%COLORS.length],pts=[];z.areas.forEach(([area,v],ai)=>{const p=v.coords;pts.push(p);bounds.push(p);const icon=w.L.divIcon({className:'route-stop',html:`<div style="width:34px;height:34px;border-radius:50%;background:${color};border:3px solid #fff;box-shadow:0 3px 12px #0008;color:#111;font-weight:1000;font-size:13px;display:flex;align-items:center;justify-content:center">${ai+1}</div>`,iconSize:[34,34],iconAnchor:[17,17]});w.L.marker(p,{icon}).addTo(w.m1).bindTooltip(`${esc(area)} · ${v.orders.size} Orders`,{direction:'top',offset:[0,-14],sticky:true}).bindPopup(`<b>${esc(area)}</b><br>Route ${String(zi+1).padStart(2,'0')} — ${esc(z.zone)}<br>Orders: <b>${v.orders.size}</b>`)});if(pts.length>1)w.L.polyline(pts,{color,weight:5,opacity:.85}).addTo(w.m1);if(pts.length)w.L.marker(pts[0],{icon:w.L.divIcon({className:'route-label',html:`<div style="background:#0b1016;color:#fff;border:1px solid ${color};padding:4px 8px;border-radius:7px;font-size:10px;font-weight:900;white-space:nowrap">Route ${String(zi+1).padStart(2,'0')} · ${esc(z.zone)}</div>`,iconSize:null,iconAnchor:[0,28]})}).addTo(w.m1)});if(bounds.length)w.m1.fitBounds(bounds,{padding:[35,35]});setTimeout(()=>w.m1.invalidateSize(),150)}
 let legend=doc.getElementById('routeLegend');if(!legend&&map1){legend=doc.createElement('div');legend.id='routeLegend';legend.style.cssText='margin-top:10px;padding:10px;border:1px solid #26313d;border-radius:10px;background:#0c1117;display:flex;gap:8px;flex-wrap:wrap;font-size:10px;font-weight:800';map1.parentNode.appendChild(legend)}if(legend)legend.innerHTML=zones.map((z,i)=>`<span style="display:inline-flex;align-items:center;gap:5px;padding:4px 7px;border:1px solid ${COLORS[i%COLORS.length]};border-radius:7px"><i style="width:9px;height:9px;border-radius:50%;background:${COLORS[i%COLORS.length]};display:inline-block"></i>Route ${String(i+1).padStart(2,'0')} · ${esc(z.zone)}</span>`).join('');
 const rank=doc.getElementById('areaRank');if(rank){const seen=new Map();[...rank.querySelectorAll('.areaRow')].forEach(r=>{const n=r.querySelector('.areaName'),c=r.querySelector('.count');if(!n||!c)return;const k=canon(n.textContent);n.textContent=k;const v=Number((c.textContent||'').replace(/,/g,''))||0;if(seen.has(k)){const oc=seen.get(k).querySelector('.count');oc.textContent=String((Number(oc.textContent)||0)+v);r.remove()}else seen.set(k,r)})}
 const details=doc.querySelector('#details tbody');if(details){const trs=[...details.querySelectorAll('tr')];trs.sort((a,b)=>{const aa=canon(a.children[1]?.textContent||''),bb=canon(b.children[1]?.textContent||'');const c=aa.localeCompare(bb,'ar');if(c)return c;return (a.children[0]?.textContent||'').localeCompare(b.children[0]?.textContent||'')});trs.forEach(tr=>details.appendChild(tr));let last='';trs.forEach(tr=>{const area=canon(tr.children[1]?.textContent||'');if(!area)return;const z=normalized.find(r=>r.area===area)?.zone||'Other';const zi=Math.max(0,zones.findIndex(x=>x.zone===z));const color=COLORS[(zi<0?0:zi)%COLORS.length];if(area!==last){const g=doc.createElement('tr');g.className='area-group-header';g.innerHTML=`<td colspan="${Math.max(1,tr.children.length)}" style="padding:8px 10px;background:${color}22;border-right:6px solid ${color};color:#fff;font-weight:1000;font-size:11px">${esc(area)} <span style="opacity:.7">· ${esc(z)}</span></td>`;details.insertBefore(g,tr);last=area}if(tr.children[1]){tr.children[1].textContent=area;tr.children[1].style.background=color+'18';tr.children[1].style.borderRight=`5px solid ${color}`;tr.children[1].style.fontWeight='900'}})}
 const sections=[...doc.querySelectorAll('section')];const f=sections.find(s=>/Customer Feedback & Route Details/i.test(s.querySelector('h2')?.textContent||''));if(f){const t=f.querySelector('table'),b=t?.querySelector('tbody');if(t&&b){[...b.querySelectorAll('tr')].sort((a,b)=>((a.children[1]?.textContent||'')+'|'+(a.children[2]?.textContent||'')).localeCompare((b.children[1]?.textContent||'')+'|'+(b.children[2]?.textContent||''),'ar')).forEach(r=>b.appendChild(r));const th=t.querySelectorAll('thead th');if(th.length>=8){th[0].textContent='Order';th[1].textContent='Trip Zone';th[2].textContent='Area';th[3].textContent='Address';th[4].remove();th[4].textContent='Status';th[5].textContent='Time';th[6].textContent='Feedback'}[...b.querySelectorAll('tr')].forEach(r=>{if(r.children.length>7)r.children[4].remove()})}}
 const fu=sections.find(s=>/Daily Follow-up/i.test(s.querySelector('h2')?.textContent||''));if(fu){const h=fu.querySelector('h2');if(h)h.textContent='Daily Follow-up — Important Customer Details'}
 /* Vehicle requirement: capacity is 13 AC per Dabbaba. More than 13 AC requires Jumbo capacity. */
 const vehicleEls=[...doc.querySelectorAll('*')].filter(el=>el.children.length===0&&/VEHICLES REQUIRED/i.test(el.textContent||''));vehicleEls.forEach(el=>{const card=el.closest('.card,.kpi,.metric,section,div')||el.parentElement;let ac=0;const txt=card?.textContent||'';const m=txt.match(/AC\s*[:：]?\s*(\d+)/i);if(m)ac=Number(m[1]);else ac=normalized.reduce((s,r)=>s+(Number(r.ac)||0),0);const count=Math.max(1,Math.ceil(ac/13));const jumbo=ac>13;let out=card?.querySelector('.vehicle-result');if(!out){out=doc.createElement('div');out.className='vehicle-result';out.style.cssText='margin-top:6px;font-weight:900;font-size:12px;color:#fff';(card||el.parentElement).appendChild(out)}out.textContent=`${count} ${jumbo?'جامبو':'دبابة'} · ${ac} AC`;});
 const alertBox=doc.getElementById('dataQualityAlert')||doc.createElement('div');alertBox.id='dataQualityAlert';alertBox.style.cssText='margin:0 0 12px;padding:9px 12px;border:1px solid #26313d;border-radius:10px;background:#0c1117;font-size:10px;color:#8793a3';const missingCore=normalized.filter(r=>!r.order||!r.address||r.address==='غير محدد'||!r.area||r.area==='غير محدد').length;const unknown=[...new Set(normalized.filter(r=>!r.zone||r.zone==='Other').map(r=>r.area))].filter(Boolean);alertBox.innerHTML=`<b style="color:#ffb477">Last Updated:</b> ${esc(doc.getElementById('dataStatus')?.textContent||'آخر شيت مرفوع')} · <b style="color:#ffb477">⚠️ Areas Need Mapping:</b> ${unknown.length?esc(unknown.join(' · ')):'لا يوجد'} · <b style="color:#ffb477">⚠️ Data Quality:</b> ${missingCore?`${missingCore} rows تحتاج مراجعة`:'OK ✓'}`;const grid=doc.querySelector('.grid');if(grid&&!alertBox.parentNode)grid.parentNode.insertBefore(alertBox,grid)
 }catch(e){console.error('dashboard enhancement',e)}}
 I.addEventListener('load',()=>[800,1800,3200,5000].forEach(t=>setTimeout(()=>enhance(I.contentDocument),t)));
})();</script></body></html>
