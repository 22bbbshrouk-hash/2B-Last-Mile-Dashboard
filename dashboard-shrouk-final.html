<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2B | Last Mile Operations Control Tower</title><style>html,body{margin:0;width:100%;height:100%;background:#07090d}#dash{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="dash" src="dashboard-final.html?v=20260819-final" title="2B Last Mile Dashboard"></iframe><script>
(function(){const I=document.getElementById('dash');
function canon(s){return String(s||'').replace(/[\u064B-\u065F\u0670]/g,'').trim().replace(/مدينه\s*نصر/gi,'مدينة نصر')}
function apply(d){
 const map1=d.getElementById('map1'); if(map1){map1.style.display='none'; const h=map1.previousElementSibling;if(h&&/Map 1/i.test(h.textContent||''))h.style.display='none';}
 const rank=d.getElementById('areaRank'); if(rank){const seen=new Map();[...rank.querySelectorAll('.areaRow')].forEach(r=>{const n=r.querySelector('.areaName'),c=r.querySelector('.count');if(!n||!c)return;const k=canon(n.textContent);n.textContent=k;const v=Number((c.textContent||'').replace(/,/g,''))||0;if(seen.has(k)){const oc=seen.get(k).querySelector('.count');oc.textContent=String((Number(oc.textContent)||0)+v);r.remove()}else seen.set(k,r)})}
 const sections=[...d.querySelectorAll('section')];const f=sections.find(s=>/Customer Feedback & Route Details/i.test(s.querySelector('h2')?.textContent||''));if(f){const t=f.querySelector('table'),b=t?.querySelector('tbody');if(t&&b){[...b.querySelectorAll('tr')].sort((a,b)=>((a.children[1]?.textContent||'')+'|'+(a.children[2]?.textContent||'')).localeCompare((b.children[1]?.textContent||'')+'|'+(b.children[2]?.textContent||''),'ar')).forEach(r=>b.appendChild(r));const th=t.querySelectorAll('thead th');if(th.length>=8){th[0].textContent='Order';th[1].textContent='Trip Zone';th[2].textContent='Area';th[3].textContent='Address';th[4].remove();th[4].textContent='Status';th[5].textContent='Time';th[6].textContent='Feedback'}[...b.querySelectorAll('tr')].forEach(r=>{if(r.children.length>7)r.children[4].remove()})}}
 const fu=sections.find(s=>/Daily Follow-up/i.test(s.querySelector('h2')?.textContent||''));if(fu){const h=fu.querySelector('h2');if(h)h.textContent='Daily Follow-up — Important Customer Details'}
}
I.addEventListener('load',()=>[500,1500,3000,5000].forEach(t=>setTimeout(()=>{try{apply(I.contentDocument)}catch(e){}},t)));
})();</script></body></html>
