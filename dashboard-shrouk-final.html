<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2B | Last Mile Operations Control Tower</title><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2307090d'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-family='Arial' font-size='30' font-weight='900' fill='%23ff7900'%3E2B%3C/text%3E%3C/svg%3E"><style>html,body{margin:0;width:100%;height:100%;background:#07090d}#dash{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="dash" src="dashboard-final.html?v=20260820-manual-final-10" title="2B Last Mile Dashboard"></iframe><script>(function(){const I=document.getElementById('dash'),C=['#ff7900','#27a7ff','#45d69c','#c77dff','#ff5d66','#ffd166','#00c2a8','#f78fb3','#8bd450','#9aa7ff'],FN='https://wihopmnjpsfsgujugyzl.supabase.co/functions/v1/upload-dashboard',KEY='sb_publishable_d_iGTrKLgLx3Ntn-xExJhw_teic9wsl';const ROUTES=[['New Cairo',['القاهرة الجديدة','التجمع','التجمع الأول','التجمع الاول','التجمع الثالث','التجمع الخامس','الرحاب']],['East Cairo',['العبور','الشروق','مدينتي','العاصمة الادارية الجديدة','العاصمة الإدارية الجديدة','بدر']],['Heliopolis / Nasr City',['مدينة نصر','مصر الجديدة','النزهة','روكسي','جسر السويس','حدائق القبة','الزيتون','المطرية','عين شمس','عين شمس- الشرقية','عزبة النخل']],['Central Cairo',['وسط البلد','باب الشعرية','الضاهر','دار السلام','شبرا مصر','السيدة زينب']],['Mohandeseen',['المهندسين','أرض اللواء','ارض اللواء','الزمالك','بولاق الدكرور']],['Haram / Faisal',['الهرم','فيصل']],['October / Zayed',['حدائق أكتوبر','حدائق اكتوبر','6 أكتوبر','السادس من أكتوبر','الشيخ زايد','زايد','حدائق الأهرام','حدائق الاهرام']],['Maadi / Helwan / Mokattam',['المعادي','المعادى','حلوان','مايو','المقطم','زهراء المعادي']],['Old Cairo',['مصر القديمة','السيدة عائشة']],['North East',['الخانكة','المرج']],['North Coast',['الساحل الشمالى','الساحل الشمالي']]];function norm(s){return String(s||'').normalize('NFKC').toLowerCase().replace(/[\u064B-\u065F\u0670]/g,'').replace(/[\s_\-()./]/g,'').replace(/ى/g,'ي').replace(/ة/g,'ه').trim()}function dist(a,b){let p=Array(b.length+1).fill(0).map((_,i)=>i);for(let i=1;i<=a.length;i++){let q=[i];for(let j=1;j<=b.length;j++)q[j]=Math.min(q[j-1]+1,p[j]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=q}return p[b.length]}const CAN=[];ROUTES.forEach(([g,l])=>l.forEach(a=>CAN.push([norm(a),a,g])));function canon(a){let n=norm(a),h=CAN.find(x=>x[0]===n);if(h)return h[1];let best,bd=99;CAN.forEach(x=>{let d=dist(n,x[0]),lim=Math.max(1,Math.floor(Math.min(n.length,x[0].length)*.25));if(d<bd&&d<=lim){bd=d;best=x}});return best?best[1]:(String(a||'غير محدد').trim()||'غير محدد')}function routeOf(a){let h=CAN.find(x=>x[0]===norm(canon(a)));return h?h[2]:'غير مصنف'}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function branding(d){d.title='2B | Last Mile Operations Control Tower';let f=d.querySelector('link[rel="icon"]')||d.createElement('link');f.rel='icon';f.type='image/svg+xml';f.href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2307090d'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-family='Arial' font-size='30' font-weight='900' fill='%23ff7900'%3E2B%3C/text%3E%3C/svg%3E";if(!f.parentNode)d.head.appendChild(f);let l=d.querySelector('.logo');if(l){l.textContent='2B';l.style.cssText+=';width:58px;height:58px;display:flex;align-items:center;justify-content:center;border:2px solid #ff7900;border-radius:14px;background:#171008;box-shadow:0 0 0 3px #ff79001a,0 8px 24px #0008;font-size:29px!important;color:#ff7900!important'}}function hideMap2(d){let m=d.getElementById('map2');if(!m)return;let s=m.closest('section');if(s)s.style.display='none'}function getRows(d){return Array.isArray(d.defaultView.rows)?d.defaultView.rows.map(r=>({...r,area:canon(r.area),route:routeOf(r.area)})).filter(r=>r.order):[]}function details(d,rs){let b=d.getElementById('details');if(!b)return;let m=new Map();rs.forEach(r=>{let k=[r.area,r.order,r.sku,r.product].map(norm).join('\0');if(!m.has(k))m.set(k,{...r,qty:Number(r.qty)||0});else m.get(k).qty+=Number(r.qty)||0});let a=[...m.values()].sort((x,y)=>{let rx=ROUTES.findIndex(q=>q[0]===x.route),ry=ROUTES.findIndex(q=>q[0]===y.route);return rx-ry||x.area.localeCompare(y.area,'ar')||String(x.order).localeCompare(String(y.order))||String(x.sku).localeCompare(String(y.sku))});b.innerHTML=a.map((r,i)=>`<tr style="border-right:5px solid ${C[i%C.length]}"><td>${esc(r.route)}</td><td>${esc(r.area)}</td><td>${esc(r.order)}</td><td>${esc(r.sku)}</td><td>${esc(r.product)}</td><td>${r.qty}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">لا توجد بيانات</td></tr>'}function ranking(d,rs){let b=d.getElementById('areaRank');if(!b)return;let m=new Map();rs.forEach(r=>{if(!m.has(r.area))m.set(r.area,new Set());m.get(r.area).add(r.order)});let a=[...m].map(([x,s])=>[x,s.size]).sort((x,y)=>y[1]-x[1]);let mx=Math.max(1,...a.map(x=>x[1]));b.innerHTML=a.map(([x,n],i)=>`<div class="areaRow" style="border-right:5px solid ${C[i%C.length]}"><div class="areaName">${esc(x)}</div><div class="barbg"><div class="barfill" style="width:${n/mx*100}%;background:${C[i%C.length]}"></div></div><div class="count" style="color:${C[i%C.length]}">${n}</div></div>`).join('')||'<div class="empty">لا توجد بيانات</div>'}function routes(d,rs){let z=new Map();rs.forEach(r=>{let g=r.route;if(g==='غير مصنف')return;if(!z.has(g))z.set(g,{areas:new Set(),orders:new Set(),skus:new Set(),qty:0,ac:0});let x=z.get(g);x.areas.add(r.area);x.orders.add(r.order);x.skus.add(r.sku);x.qty+=Number(r.qty)||1;if(/\bac\b|air\s*condition|تكييف/i.test(String(r.product)))x.ac+=Number(r.qty)||1});let a=[...z].map(([route,x])=>({...x,route,areas:[...x.areas]}));let s=d.getElementById('zoneSummary');if(s)s.innerHTML=a.map((x,i)=>`<div class="zoneCard" style="border-right:7px solid ${C[i%C.length]}"><div class="zoneTitle" style="color:${C[i%C.length]}">${esc(x.route)}</div><div class="muted">${esc(x.areas.join(' · '))}</div><div class="muted">Orders <b>${x.orders.size}</b> · SKU <b>${x.skus.size}</b> · QTY <b>${x.qty}</b></div></div>`).join('');let el=d.getElementById('routes');if(el)el.innerHTML=a.map((x,i)=>{let v=Math.max(1,Math.ceil(x.ac/13));return `<div class="routeCard"><div class="routeHead"><div><div class="routeTitle">🛣️ Route ${String(i+1).padStart(2,'0')} — ${esc(x.route)}</div><div class="muted">Areas: ${esc(x.areas.join(' · '))} · Orders: <b>${x.orders.size}</b> · SKU: <b>${x.skus.size}</b> · QTY: <b>${x.qty}</b></div></div><span class="vehicle">🚚 ${v} عربيات</span></div><div class="muted" style="margin-top:7px">AC Load: <b>${x.ac}</b> / 13 per دبابة</div></div>`}).join('')||'<div class="empty">لا توجد بيانات</div>'}const P=['Out for Delivery','Ready for Delivery','Assigned','Picked Up','Delivered','No Answer','Cancelled','Canceled','Returned','Return','Refused','Failed'];function important(s){let n=norm(s);let h=P.find(x=>norm(x)===n);return h||''}function follow(d,rs){let b=d.getElementById('follow');if(!b)return;let m=new Map();rs.forEach(r=>{if(!m.has(r.order))m.set(r.order,r);else{let a=m.get(r.order);if(!important(a.status)&&important(r.status))m.set(r.order,r)}});let a=[...m.values()].filter(r=>important(r.status));b.innerHTML=a.sort((x,y)=>String(x.order).localeCompare(String(y.order))).map(r=>`<tr><td>${esc(r.order)}</td><td>${esc(r.route)}</td><td>${esc(r.area)}</td><td><span class="tag">${esc(important(r.status))}</span></td></tr>`).join('')||'<tr><td colspan="4" class="empty">لا توجد طلبات بحالات تشغيلية مهمة</td></tr>';let sec=b.closest('section');if(sec){let h=sec.querySelector('h2');if(h)h.textContent='Daily Follow-up';let sub=sec.querySelector('.sub');if(sub)sub.textContent='Unique Orders — Important Status only.';let tr=sec.querySelector('thead tr');if(tr)tr.innerHTML='<th>Order</th><th>Route</th><th>Area</th><th>Status</th>'}}function paint(){let d=I.contentDocument;if(!d)return;try{hideMap2(d);branding(d);let r=getRows(d);details(d,r);ranking(d,r);routes(d,r);follow(d,r)}catch(e){console.error(e)}}function hook(d){let input=d.getElementById('file');if(input&&!input.dataset.fix){input.dataset.fix=1;input.onchange=async()=>{let f=input.files?.[0];if(!f)return;try{d.getElementById('dataStatus').textContent='جاري رفع شيت اليوم...';let r=await fetch(FN,{method:'POST',headers:{apikey:KEY,'Content-Type':f.type||'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'},body:f});if(!r.ok)throw Error(await r.text());await d.defaultView.readBuffer(await f.arrayBuffer());paint();d.getElementById('dataStatus').textContent='تم رفع شيت اليوم وتحديث الداشبورد ✓'}catch(e){alert('مشكلة في رفع الملف: '+(e.message||'غير معروفة'))}}}let ref=d.getElementById('refresh');if(ref&&!ref.dataset.fix){ref.dataset.fix=1;ref.onclick=async()=>{try{let r=await fetch(FN+'?v='+Date.now(),{headers:{apikey:KEY},cache:'no-store'});if(!r.ok)throw Error();await d.defaultView.readBuffer(await r.arrayBuffer());paint();d.getElementById('dataStatus').textContent='تم تحميل آخر شيت محفوظ ✓'}catch(e){d.getElementById('dataStatus').textContent='لا يوجد شيت محفوظ — ارفعي شيت اليوم.'}}}}I.addEventListener('load',()=>{hook(I.contentDocument);paint();[500,1200,2500,5000].forEach(t=>setTimeout(()=>{hook(I.contentDocument);paint()},t))})})();</script></body></html>
