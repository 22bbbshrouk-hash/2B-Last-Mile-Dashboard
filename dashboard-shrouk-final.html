<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2B | Last Mile Operations Control Tower</title><style>html,body{margin:0;width:100%;height:100%;background:#07090d}#dash{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="dash" src="dashboard-final.html?v=20260820-final" title="2B Last Mile Dashboard"></iframe><script>
(function(){const I=document.getElementById('dash');const COLORS=['#ff7900','#27a7ff','#45d69c','#c77dff','#ff5d66','#ffd166','#00c2a8','#f78fb3','#8bd450','#9aa7ff'];
function canon(s){return String(s||'').normalize('NFKC').replace(/[\u064B-\u065F\u0670]/g,'').replace(/\s+/g,' ').trim().replace(/مدينه\s*نصر/gi,'مدينة نصر').replace(/المعادى/gi,'المعادي').replace(/حدائق\s*اكتوبر/gi,'حدائق أكتوبر').replace(/ارض\s*اللواء/gi,'أرض اللواء').replace(/حدائق\s*الاهرام/gi,'حدائق الأهرام').replace(/الساحل\s*الشمالى/gi,'الساحل الشمالي')}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function removeMap2(doc){[...doc.querySelectorAll('h1,h2,h3,.sub')].forEach(el=>{if(/Map\s*2\s*[—-]\s*Trip Zones\s*&\s*Routes|Map\s*2/i.test(el.textContent||'')){const s=el.closest('section');if(s)s.remove();else{el.style.display='none';if(el.nextElementSibling)el.nextElementSibling.style.display='none'}}});const m=doc.getElementById('map2');if(m){const s=m.closest('section');if(s)s.remove();else m.remove()}}
function getRows(doc){const w=doc.defaultView;return (w.rows||[]).map(r=>({...r,area:canon(r.area)})).filter(r=>r.area)}
function areaColors(doc){const rows=getRows(doc),areas=[];rows.forEach(r=>{if(!areas.includes(r.area))areas.push(r.area)});return new Map(areas.map((a,i)=>[a,COLORS[i%COLORS.length]]))}
function colorRank(doc,colors){const rank=doc.getElementById('areaRank');if(!rank)return;const seen=new Map();[...rank.querySelectorAll('.areaRow')].forEach(r=>{const n=r.querySelector('.areaName'),c=r.querySelector('.count');if(!n||!c)return;const k=canon(n.textContent);n.textContent=k;const v=Number((c.textContent||'').replace(/[^0-9.-]/g,''))||0;if(seen.has(k)){const old=seen.get(k),oc=old.querySelector('.count');oc.textContent=String((Number(oc.textContent)||0)+v);r.remove()}else seen.set(k,r)});seen.forEach((r,a)=>{const color=colors.get(a)||COLORS[0];r.style.background=color+'18';r.style.borderRight='5px solid '+color;r.style.borderRadius='8px';r.style.padding='4px 8px';r.querySelector('.areaName').style.color='#fff';r.querySelector('.areaName').style.fontWeight='900';r.querySelector('.count').style.color=color;r.querySelector('.count').style.fontWeight='1000'})}
function colorDetails(doc,colors){const body=doc.querySelector('#details');if(!body)return;let prev='';[...body.querySelectorAll('tr')].forEach(tr=>{if(!tr.children.length)return;const areaCell=tr.children[1];if(!areaCell)return;const area=canon(areaCell.textContent);areaCell.textContent=area;const color=colors.get(area)||COLORS[0];tr.style.background=color+'12';tr.style.borderRight='5px solid '+color;[...tr.children].forEach(td=>td.style.borderBottom='1px solid '+color+'45');areaCell.style.background=color+'35';areaCell.style.color='#fff';areaCell.style.fontWeight='900';if(area!==prev){const g=doc.createElement('tr');g.className='area-group-header';g.innerHTML='<td colspan="6" style="padding:10px 12px;background:'+color+';color:#111;font-weight:1000;font-size:11px">'+esc(area)+'</td>';tr.parentNode.insertBefore(g,tr);prev=area}})}
function summaryColors(doc,colors){const sec=[...doc.querySelectorAll('section')].find(s=>/Operational Trip Zone Summary/i.test(s.querySelector('h2')?.textContent||''));if(!sec)return;[...sec.querySelectorAll('.zoneCard,.card,.trip-card')].forEach(card=>{const found=[...colors.keys()].find(a=>(card.textContent||'').includes(a));if(found){const c=colors.get(found);card.style.borderRight='6px solid '+c;card.style.background=c+'12'}})}
function mapLegend(doc,colors){const map=doc.getElementById('map1');if(!map)return;let leg=doc.getElementById('areaColorLegend');if(!leg){leg=doc.createElement('div');leg.id='areaColorLegend';leg.style.cssText='margin-top:10px;padding:10px;background:#0c1117;border:1px solid #26313d;border-radius:10px;display:flex;flex-wrap:wrap;gap:7px;font-size:10px;font-weight:900';map.parentNode.appendChild(leg)}leg.innerHTML=[...colors.entries()].map(([a,c])=>'<span style="display:inline-flex;align-items:center;gap:5px;padding:5px 8px;border:1px solid '+c+';border-radius:7px;color:#fff"><i style="width:10px;height:10px;border-radius:50%;background:'+c+';display:inline-block"></i>'+esc(a)+'</span>').join('')}
function installUpload(doc){try{const input=doc.getElementById('file');if(!input||input.dataset.fixedUpload==='1')return;input.dataset.fixedUpload='1';input.onchange=null;input.addEventListener('change',async e=>{const file=e.target.files&&e.target.files[0];if(!file)return;const st=doc.getElementById('dataStatus');const SB='https://wihopmnjpsfsgujugyzl.supabase.co',KEY='sb_publishable_d_iGTrKLgLx3Ntn-xExJhw_teic9wsl',BUCKET='dashboard-data',FILE='Last_Mile_Data.xlsx';st.textContent='جاري رفع شيت اليوم...';try{const url=SB+'/storage/v1/object/'+BUCKET+'/'+FILE;let resp=await fetch(url,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':file.type||'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet','x-upsert':'true'},body:file});if(!resp.ok){const msg=await resp.text();resp=await fetch(url,{method:'PUT',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':file.type||'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet','x-upsert':'true'},body:file});if(!resp.ok)throw Error(msg||await resp.text())}await doc.defaultView.readBuffer(await file.arrayBuffer());st.textContent='تم رفع شيت اليوم وتحديث الداشبورد ✓';alert('تم رفع الشيت بنجاح ❤️')}catch(err){console.error('Excel upload failed',err);st.textContent='مشكلة في رفع الشيت';alert('مشكلة في رفع الملف. تأكدي إن الملف Excel ثم جربي مرة ثانية.')}})}catch(e){console.error(e)}}
function replaceLogo(doc){const logo=doc.querySelector('.logo');if(!logo||logo.dataset.customLogo==='1')return;logo.dataset.customLogo='1';logo.innerHTML='<span style="display:flex;align-items:center;justify-content:center;width:34px;height:34px;background:#050505;border-radius:3px;border:1px solid #333;box-shadow:0 2px 8px #0008;font-family:Arial,sans-serif;font-weight:1000;font-size:20px;letter-spacing:-2px;line-height:1"><span style="color:#fff">2</span><span style="color:#ff7900">B</span></span>';logo.style.fontSize='0';logo.style.letterSpacing='0';logo.style.color='transparent';logo.style.width='34px';logo.style.height='34px';logo.style.display='flex';logo.style.alignItems='center';logo.style.justifyContent='center';logo.style.flexShrink='0'}
function normalize(doc){removeMap2(doc);const colors=areaColors(doc);colorRank(doc,colors);colorDetails(doc,colors);summaryColors(doc,colors);mapLegend(doc,colors);installUpload(doc);replaceLogo(doc)}
I.addEventListener('load',()=>{const run=()=>{try{const d=I.contentDocument;normalize(d);const obs=new MutationObserver(()=>{if(d.body)normalize(d)});obs.observe(d.body,{childList:true,subtree:true});[700,1800,3500,6000].forEach(t=>setTimeout(()=>normalize(d),t))}catch(e){console.error(e)}};run()});})();</script></body></html>
