<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2B | Last Mile Operations Control Tower</title><style>html,body{margin:0;width:100%;height:100%;background:#07090d}#dash{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="dash" src="dashboard-final.html?v=20260820-final" title="2B Last Mile Dashboard"></iframe><script>
(function(){
const I=document.getElementById('dash');
const COLORS=['#ff7900','#27a7ff','#45d69c','#c77dff','#ff5d66','#ffd166','#00c2a8','#f78fb3','#8bd450','#9aa7ff','#6dd5ed','#f6a6ff','#a8e063','#ff8a65','#64b5f6','#81d4a3','#ba68c8','#ffd54f','#4dd0e1','#ef5350'];
const FN='https://wihopmnjpsfsgujugyzl.supabase.co/functions/v1/upload-dashboard';
const ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndpaG9wbW5qcHNmc2d1anVneXpsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxMjcwODIsImV4cCI6MjEwMjcwMzA4Mn0.vFxZe7Ydumf3iTf9DEBnHqvyAvsnMqzhUH6ZuQY1Y4M';
function canon(s){return String(s||'').normalize('NFKC').replace(/[\u064B-\u065F\u0670]/g,'').replace(/\s+/g,' ').trim().replace(/مدينه\s*نصر/gi,'مدينة نصر').replace(/المعادى/gi,'المعادي').replace(/حدائق\s*اكتوبر/gi,'حدائق أكتوبر').replace(/ارض\s*اللواء/gi,'أرض اللواء').replace(/حدائق\s*الاهرام/gi,'حدائق الأهرام').replace(/الساحل\s*الشمالى/gi,'الساحل الشمالي')}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function rows(d){return (d.defaultView.rows||[]).map(r=>({...r,area:canon(r.area)})).filter(r=>r.area&&r.area!=='غير محدد')}
function cmap(d){const a=[];rows(d).forEach(r=>{if(!a.includes(r.area))a.push(r.area)});return new Map(a.map((x,i)=>[x,COLORS[i%COLORS.length]]))}
function removeMap2(d){const m=d.getElementById('map2');if(m){const s=m.closest('section');if(s)s.remove();else m.remove()}[...d.querySelectorAll('h1,h2,h3,.sub')].forEach(e=>{if(/Map\s*2\s*[—-]\s*Trip Zones\s*&\s*Routes/i.test(e.textContent||'')){const s=e.closest('section');if(s)s.remove()}})}
function legend(d,map){const m=d.getElementById('map1');if(!m)return;let l=d.getElementById('areaColorLegend');if(!l){l=d.createElement('div');l.id='areaColorLegend';l.style.cssText='margin-top:10px;padding:10px;background:#0c1117;border:1px solid #26313d;border-radius:10px;display:flex;flex-wrap:wrap;gap:7px;font-size:10px;font-weight:900';m.parentNode.appendChild(l)}l.innerHTML=[...map].map(([a,c])=>`<span style="display:inline-flex;align-items:center;gap:6px;padding:5px 8px;border:1px solid ${c};border-radius:8px;color:#fff"><i style="width:10px;height:10px;border-radius:50%;background:${c};display:inline-block"></i>${esc(a)}</span>`).join('')}
function rank(d,map){const el=d.getElementById('areaRank');if(!el)return;[...el.querySelectorAll('.areaRow')].forEach(r=>{const n=r.querySelector('.areaName'),q=r.querySelector('.count');if(!n||!q)return;const a=canon(n.textContent),c=map.get(a)||COLORS[0];n.textContent=a;r.style.cssText+=`;background:${c}18;border-right:5px solid ${c};border-radius:8px;padding:5px 8px`;n.style.color='#fff';n.style.fontWeight='900';q.style.color=c;q.style.fontWeight='1000';const f=r.querySelector('.barfill');if(f)f.style.background=`linear-gradient(90deg,${c},${c}99)`})}
function summary(d,map){const sec=[...d.querySelectorAll('section')].find(s=>/Operational Trip Zone Summary/i.test(s.querySelector('h2')?.textContent||''));if(!sec)return;[...sec.querySelectorAll('.zoneCard')].forEach(card=>{const a=[...map.keys()].find(x=>(card.textContent||'').includes(x));if(!a)return;const c=map.get(a);card.style.cssText+=`;border-right:7px solid ${c};background:${c}14`;const t=card.querySelector('.zoneTitle');if(t)t.style.color=c})}
function details(d,map){const b=d.getElementById('details');if(!b)return;let last='';[...b.querySelectorAll('tr')].forEach(tr=>{if(tr.children.length<6)return;const a=canon(tr.children[1].textContent),c=map.get(a)||COLORS[0];tr.children[1].textContent=a;tr.style.background=c+'10';tr.style.borderRight='5px solid '+c;tr.children[1].style.background=c+'30';tr.children[1].style.color='#fff';tr.children[1].style.fontWeight='900';if(a!==last){const g=d.createElement('tr');g.innerHTML=`<td colspan="6" style="padding:9px 12px;background:${c};color:#111;font-weight:1000">${esc(a)}</td>`;b.insertBefore(g,tr);last=a}})}
async function upload(d,file){const st=d.getElementById('dataStatus');try{st.textContent='جاري رفع شيت اليوم...';const r=await fetch(FN,{method:'POST',headers:{Authorization:'Bearer '+ANON,apikey:ANON,'Content-Type':file.type||'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'},body:file});const text=await r.text();if(!r.ok)throw new Error('Upload '+r.status+': '+text);st.textContent='تم حفظ الشيت بنجاح ✓ جاري تحديث الداشبورد...';setTimeout(()=>location.reload(),500)}catch(e){console.error(e);st.textContent='حصلت مشكلة أثناء الرفع';alert('مشكلة في رفع الملف: '+(e.message||'غير معروفة'))}}
function hook(d){const input=d.getElementById('file');if(!input||input.dataset.manualFixed==='1')return;input.dataset.manualFixed='1';input.onchange=()=>{const f=input.files?.[0];if(!f)return;if(!/\.xlsx?$|excel|spreadsheet/i.test(f.name+' '+f.type)){alert('اختاري ملف Excel بصيغة XLSX أو XLS');input.value='';return}upload(d,f)}}
function paint(){const d=I.contentDocument;if(!d)return;try{removeMap2(d);const m=cmap(d);rank(d,m);summary(d,m);details(d,m);legend(d,m);hook(d)}catch(e){console.error(e)}}
I.addEventListener('load',()=>{paint();[500,1200,2500,5000].forEach(t=>setTimeout(paint,t))});
})();</script></body></html>
