<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>2B Last Mile Operations Control Tower</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><style>body{margin:0;background:#07090d;color:#fff;font-family:Arial,Tahoma,sans-serif}.wrap{max-width:1560px;margin:auto;padding:22px}.btn{display:inline-block;background:#ff7900;color:#111;border:0;border-radius:9px;padding:10px 13px;font-weight:900;cursor:pointer}.file{display:none}#status{margin:14px 0;color:#ddd}#app{margin-top:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:18px}.card{background:#11151c;border:1px solid #252b35;border-radius:12px;padding:16px}.num{font-size:28px;font-weight:900;margin-top:6px}.tablewrap{overflow:auto;margin-top:18px}table{width:100%;border-collapse:collapse;background:#0d1117}th,td{padding:9px;border-bottom:1px solid #252b35;text-align:right;white-space:nowrap}th{background:#171d26;color:#ff9a45;position:sticky;top:0}</style></head><body><main class="wrap"><h1>2B Last Mile Operations Control Tower</h1><div id="status">جاري تحميل آخر شيت...</div><label class="btn">📤 Upload Daily Excel<input id="file" class="file" type="file" accept=".xlsx,.xls,.csv"></label><div id="app"></div></main><script>const SUPA='https://wihopmnjpsfsgujugyzl.supabase.co',KEY='sb_publishable_d_iGTrKLgLx3Ntn-xExJhw_teic9wsl',BUCKET='dashboard-data',FILE='Last_Mile_Data.xlsx',STORAGE=SUPA+'/storage/v1/object/'+BUCKET+'/'+FILE,PUBLIC=SUPA+'/storage/v1/object/public/'+BUCKET+'/'+FILE;const statusEl=document.getElementById('status'),appEl=document.getElementById('app');function setStatus(x){statusEl.textContent=x}function loadScript(src){return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=()=>reject(new Error('تعذر تحميل مكتبة Excel'));document.head.appendChild(s)})}async function ensureXLSX(){if(window.XLSX)return;try{await loadScript('https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js')}catch(e){await loadScript('https://cdn.jsdelivr.net/npm/xlsx@0.20.3/dist/xlsx.full.min.js')}if(!window.XLSX)throw new Error('Excel library failed to load')}function render(wb){const name=wb.SheetNames&&wb.SheetNames.length?wb.SheetNames[0]:'';const ws=wb.Sheets[name];if(!ws)throw new Error('No worksheet found');const rows=XLSX.utils.sheet_to_json(ws,{defval:'',raw:false});const cols=rows.length?Object.keys(rows[0]):[];const headers=cols.map(c=>'<th>'+esc(c)+'</th>').join('');const body=rows.slice(0,500).map(r=>'<tr>'+cols.map(c=>'<td>'+esc(r[c])+'</td>').join('')+'</tr>').join('');appEl.innerHTML='<div class="grid"><div class="card">Orders<div class="num">'+new Set(rows.map(r=>r['Order No.']||r['Order No']||r['Order'])).size+'</div></div><div class="card">Rows<div class="num">'+rows.length+'</div></div><div class="card">Areas<div class="num">'+new Set(rows.map(r=>r.Area).filter(Boolean)).size+'</div></div><div class="card">Products<div class="num">'+new Set(rows.map(r=>r.SKU).filter(Boolean)).size+'</div></div></div><div class="tablewrap"><table><thead><tr>'+headers+'</tr></thead><tbody>'+body+'</tbody></table></div>'}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function loadBuf(buf){await ensureXLSX();const wb=XLSX.read(buf,{type:'array',raw:false});render(wb);return wb}async function loadPublished(){try{setStatus('جاري تحميل آخر شيت...');const r=await fetch(PUBLIC+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);await loadBuf(await r.arrayBuffer());setStatus('تم تحميل آخر شيت ✓')}catch(e){setStatus('الشيت موجود لكن تعذر قراءته تلقائيًا — استخدمي Upload Daily Excel');console.error(e)}}document.getElementById('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;setStatus('جاري قراءة ورفع الشيت...');try{await loadBuf(await f.arrayBuffer());const r=await fetch(STORAGE,{method:'PUT',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'x-upsert':'true','Content-Type':f.type||'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'},body:f});if(!r.ok)throw new Error('Upload failed: HTTP '+r.status+' '+await r.text());setStatus('تم رفع الشيت وتحديث الداشبورد ✓')}catch(err){setStatus('فشل الرفع');console.error(err);alert(err.message)}};loadPublished();</script></body></html>
