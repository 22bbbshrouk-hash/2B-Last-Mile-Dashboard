<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>2B Last Mile Operations Control Tower</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><style>body{margin:0;background:#07090d;color:#fff;font-family:Arial,Tahoma,sans-serif}.wrap{max-width:1560px;margin:auto;padding:22px}.btn{display:inline-block;background:#ff7900;color:#111;border:0;border-radius:9px;padding:10px 13px;font-weight:900;cursor:pointer}.file{display:none}#status{margin:14px 0;color:#ddd}#app{margin-top:14px}</style></head><body><main class="wrap"><h1>2B Last Mile Operations Control Tower</h1><div id="status">جاري تحميل آخر شيت...</div><label class="btn">📤 Upload Daily Excel<input id="file" class="file" type="file" accept=".xlsx,.xls,.csv"></label><div id="app"></div></main><script>const SUPA='https://wihopmnjpsfsgujugyzl.supabase.co',KEY='sb_publishable_d_iGTrKLgLx3Ntn-xExJhw_teic9wsl',BUCKET='dashboard-data',FILE='Last_Mile_Data.xlsx',STORAGE=SUPA+'/storage/v1/object/'+BUCKET+'/'+FILE,PUBLIC=SUPA+'/storage/v1/object/public/'+BUCKET+'/'+FILE;const statusEl=document.getElementById('status'),appEl=document.getElementById('app');function setStatus(x){statusEl.textContent=x}function loadScript(src){return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.onload=()=>resolve();s.onerror=()=>reject(new Error('تعذر تحميل مكتبة Excel'));document.head.appendChild(s)})}async function ensureXLSX(){if(window.XLSX)return;try{await loadScript('https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js')}catch(e){await loadScript('https://cdn.jsdelivr.net/npm/xlsx@0.20.3/dist/xlsx.full.min.js')}if(!window.XLSX)throw new Error('Excel library failed to load')}function showRows(wb){const ws=wb.Sheets[wb.SheetNames[0]];const rows=XLSX.utils.sheet_to_json(ws,{defval:'',raw:false});appEl.innerHTML='<p>تمت قراءة <b>'+rows.length+'</b> صف من <b>'+XLSX.utils.book_sheet_names(wb)[0]+'</b> ✓</p>'}async function loadBuf(buf){await ensureXLSX();const wb=XLSX.read(buf,{type:'array',raw:false});showRows(wb);return wb}async function loadPublished(){try{setStatus('جاري تحميل آخر شيت...');const r=await fetch(PUBLIC+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);await loadBuf(await r.arrayBuffer());setStatus('تم تحميل آخر شيت ✓')}catch(e){setStatus('الشيت موجود لكن تعذر قراءته تلقائيًا — استخدمي Upload Daily Excel');console.error('Published Excel load failed:',e)}}document.getElementById('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;setStatus('جاري قراءة ورفع الشيت...');try{await loadBuf(await f.arrayBuffer());const r=await fetch(STORAGE,{method:'PUT',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'x-upsert':'true','Content-Type':f.type||'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'},body:f});if(!r.ok)throw new Error('Upload failed: HTTP '+r.status+' '+await r.text());setStatus('تم رفع الشيت وتحديث الداشبورد ✓')}catch(err){setStatus('فشل الرفع');console.error(err);alert(err.message)}};loadPublished();</script></body></html>
