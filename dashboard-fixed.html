<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2B Last Mile Operations Control Tower</title><script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><style>body{margin:0;background:#07090d;color:#fff;font-family:Arial,Tahoma,sans-serif}.wrap{max-width:1560px;margin:auto;padding:22px}.btn{background:#ff7900;color:#111;border:0;border-radius:9px;padding:10px 13px;font-weight:900;cursor:pointer}.file{display:none}</style></head><body><main class="wrap"><h1>2B Last Mile Operations Control Tower</h1><div id="status">جاري تحميل آخر شيت...</div><label class="btn">📤 Upload Daily Excel<input id="file" class="file" type="file" accept=".xlsx,.xls,.csv"></label><div id="app"></div></main><script>const SUPA='https://wihopmnjpsfsgujugyzl.supabase.co',KEY='sb_publishable_d_iGTrKLgLx3Ntn-xExJhw_teic9wsl',UPLOAD=SUPA+'/functions/v1/upload-dashboard',PUBLIC=SUPA+'/storage/v1/object/public/dashboard-data/Last_Mile_Data.xlsx';function showRows(wb){const ws=wb.Sheets[wb.SheetNames[0]],rows=XLSX.utils.sheet_to_json(ws,{defval:'',raw:false});document.getElementById('app').innerHTML='<p>تمت قراءة '+rows.length+' صف من '+XLSX.utils.book_sheet_names(wb)[0]+' ✓</p>'}async function loadBuf(buf){if(typeof XLSX==='undefined')throw new Error('Excel library failed to load');const wb=XLSX.read(buf,{type:'array',raw:false});showRows(wb)}async function load(){try{const r=await fetch(PUBLIC+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('تعذر تحميل الشيت');await loadBuf(await r.arrayBuffer());document.getElementById('status').textContent='تم تحميل الشيت ✓'}catch(e){document.getElementById('status').textContent='تعذر تحميل الشيت — استخدمي Upload Daily Excel'}}document.getElementById('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;document.getElementById('status').textContent='جاري رفع الشيت...';try{const r=await fetch(UPLOAD,{method:'POST',headers:{apikey:KEY,'Content-Type':f.type||'application/octet-stream'},body:f});if(!r.ok)throw Error(await r.text());await loadBuf(await f.arrayBuffer());document.getElementById('status').textContent='تم رفع الشيت وتحديث الداشبورد ✓'}catch(err){document.getElementById('status').textContent='فشل الرفع';alert(err.message)}};load();</script></body></html>
