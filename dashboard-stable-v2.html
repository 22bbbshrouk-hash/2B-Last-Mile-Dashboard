<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2B | Last Mile Operations Control Tower</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%2307090d'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-family='Arial' font-size='30' font-weight='900' fill='%23ff7900'%3E2B%3C/text%3E%3C/svg%3E"><style>html,body{margin:0;width:100%;height:100%;background:#07090d}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="dash" src="./dashboard-new-20260820.html?v=stable-v2-20260822" title="2B Last Mile Dashboard"></iframe><script>const PUBLIC='https://wihopmnjpsfsgujugyzl.supabase.co/storage/v1/object/public/dashboard-data/Last_Mile_Data.xlsx';const ROUTES=[['Maadi / Helwan / Mokattam',['15 مايو','مايو','المقطم','المعادي','المعادى','زهراء المعادي','حلوان']],['New Cairo',['القاهرة الجديدة','التجمع الأول','التجمع الاول','التجمع الخامس','الرحاب','التجمع الثالث','التجمع']],['Haram / Faisal',['الجيزة','العمرانية','الهرم','فيصل','ترسا']],['Nasr City / Heliopolis',['الزيتون','جسر السويس','النزهة','حدائق القبة','عزبة النخل','مدينة نصر','مصر الجديدة','روكسي','عين شمس','عين شمس- الشرقية','المطرية']],['October / Zayed',['السادس من أكتوبر','6 أكتوبر','حدائق الأهرام','حدائق الاهرام','حدائق أكتوبر','حدائق اكتوبر','الشيخ زايد','زايد']],['East Cairo',['الشروق','العبور','مدينتي','العاصمة الإدارية الجديدة','العاصمة الادارية الجديدة','بدر']],['Mohandeseen / Ard El Lewa',['المهندسين','أرض اللواء','ارض اللواء','بولاق الدكرور','الزمالك']],['Central Cairo',['شبرا مصر','الضاهر','وسط البلد','باب الشعرية','دار السلام','السيدة زينب']],['North Coast',['الساحل الشمالى','الساحل الشمالي']]];const norm=v=>String(v??'').normalize('NFKC').toLowerCase().replace(/[\u064B-\u065F\u0670]/g,'').replace(/[\s_\-()./]/g,'').replace(/ى/g,'ي').replace(/ة/g,'ه').trim();const routeOf=a=>{let n=norm(a);for(const [z,as] of ROUTES)if(as.some(x=>norm(x)===n))return z;return 'غير مصنف'};const pick=(r,keys)=>{for(const k of Object.keys(r)){let n=norm(k);for(const q of keys)if(n===norm(q)||n.includes(norm(q))||norm(q).includes(n))if(String(r[k]).trim()!=='')return r[k]}return ''};const parse=buf=>{let wb=XLSX.read(buf,{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]];return XLSX.utils.sheet_to_json(ws,{defval:'',raw:false}).map(r=>{let order=pick(r,['order','order number','order no','ordernumber','orderno','awb','shipment','رقم الطلب','الطلب']),area=pick(r,['area','area name','region','zone area','المنطقة','المنطقه']),feedback=pick(r,['feedback','customer feedback','ملاحظات','الملاحظات','تعليق العميل','تعليق']),product=pick(r,['product','product name','item','description','المنتج']),qty=pick(r,['qty','quantity','الكمية','الكميه','units']);return{order:String(order).trim(),area:String(area).trim(),feedback:String(feedback).trim(),product:String(product).trim(),qty:Number(String(qty).replace(/,/g,''))||1}}).filter(x=>x.order)};const isAC=x=>/\bac\b|air\s*condition|air\s*conditioner|تكييف|مكيف|مكيفات/i.test(x.product);function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function patch(){let f=document.getElementById('dash');try{await new Promise((res,rej)=>{if(f.contentDocument&&f.contentDocument.readyState==='complete')res();else f.addEventListener('load',res,{once:true})});let d=f.contentDocument;if(!d)return;let r=await fetch(PUBLIC+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)return;let rows=parse(await r.arrayBuffer());let total=0;ROUTES.forEach(([z])=>{let rr=rows.filter(x=>routeOf(x.area)===z);if(rr.length){let ac=rr.filter(isAC).reduce((s,x)=>s+x.qty,0);total+=Math.max(1,Math.ceil(ac/13))}});let k=d.getElementById('kVehicles');if(k)k.textContent=String(total||0);let rank=d.getElementById('rank');if(rank){let m=new Map();rows.forEach(x=>{if(!m.has(x.area))m.set(x.area,new Set());m.get(x.area).add(x.order)});let order=new Map();ROUTES.forEach(([z,as],i)=>as.forEach((a,j)=>order.set(norm(a),[i,j,z]));let a=[...m].map(([area,s])=>[area,s.size]).sort((x,y)=>{let A=order.get(norm(x[0]))||[999,999,''];let B=order.get(norm(y[0]))||[999,999,''];return A[0]-B[0]||A[1]-B[1]||y[1]-x[1]});let mx=Math.max(1,...a.map(x=>x[1]));rank.innerHTML=a.map(([area,n])=>'<div class="areaRow"><div>'+esc(area)+'</div><div class="barbg"><div class="barfill" style="width:'+(n/mx*100)+'%"></div></div><b>'+n+'</b></div>').join('')||'<div class="empty">لا توجد بيانات</div>'}let routes=d.getElementById('routes');if(routes){[...routes.querySelectorAll('.routeCard')].forEach((card,i)=>{let title=card.querySelector('.routeTitle');if(!title)return;let z=title.textContent.replace(/^.*—\s*/,'').trim();let rr=rows.filter(x=>routeOf(x.area)===z);let box=d.createElement('div');box.style.cssText='margin-top:8px;color:#ffb477;font-size:10px;line-height:1.7';box.innerHTML='<b>Orders:</b> '+[...new Set(rr.map(x=>x.order))].map(esc).join(' · ');card.appendChild(box)})}let note=d.createElement('div');note.textContent='📍 Vehicle Warehouse: 15 May — عند أول سور مدينة الأبطال بجوار المدرسة اليابانية';note.style.cssText='margin:10px 0;padding:10px 12px;border:1px solid #5b371b;border-radius:9px;color:#ffb477;background:#171008;font-size:11px;font-weight:800';let bar=d.querySelector('.bar');if(bar&&!d.getElementById('warehouseNote')){note.id='warehouseNote';bar.parentNode.insertBefore(note,bar.nextSibling)} }catch(e){console.error(e)}};f.addEventListener('load',()=>setTimeout(patch,900));setTimeout(patch,1800);</script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script></body></html>
