<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2B | Last Mile Operations Control Tower</title><style>html,body{margin:0;width:100%;height:100%;background:#07090d}#dash{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="dash" src="dashboard-final.html?v=20260819" title="2B Last Mile Dashboard"></iframe><script src="dashboard-layout-patch.js?v=20260819"></script><script>
(function(){
const I=document.getElementById('dash');
function canon(s){let x=String(s||'').replace(/[\u064B-\u065F\u0670]/g,'').trim();x=x.replace(/مدينه\s*نصر/gi,'مدينة نصر');return x}
function fixRanking(d){const box=d.getElementById('areaRank');if(!box)return;const rows=[...box.querySelectorAll('.areaRow')];const seen=new Map();rows.forEach(r=>{const name=r.querySelector('.areaName'),count=r.querySelector('.count');if(!name||!count)return;const key=canon(name.textContent);name.textContent=key;const n=Number((count.textContent||'').replace(/,/g,''))||0;if(seen.has(key)){const old=seen.get(key);const oc=old.querySelector('.count');oc.textContent=String((Number((oc.textContent||'').replace(/,/g,''))||0)+n);r.remove()}else seen.set(key,r)});}
function fixDetails(d){const t=d.getElementById('details');if(!t)return;[...t.querySelectorAll('tr')].forEach(r=>{if(r.children[1])r.children[1].textContent=canon(r.children[1].textContent)})}
function removeMap1(d){const el=d.getElementById('map1');if(el){const sec=el.closest('section');if(sec)sec.remove();else el.remove()}}
function reorderFeedback(d){const sec=[...d.querySelectorAll('section')].find(s=>/Customer Feedback & Route Details/i.test(s.querySelector('h2')?.textContent||''));if(!sec)return;const table=sec.querySelector('table'),body=table?.querySelector('tbody');if(!table||!body)return;const rows=[...body.querySelectorAll('tr')];rows.sort((a,b)=>{const aa=a.children,bb=b.children;const za=(aa[1]?.textContent||'').trim(),zb=(bb[1]?.textContent||'').trim(),ra=(aa[2]?.textContent||'').trim(),rb=(bb[2]?.textContent||'').trim();return (za+'|'+ra).localeCompare(zb+'|'+rb,'ar')});const frag=d.createDocumentFragment();rows.forEach(r=>frag.appendChild(r));body.appendChild(frag);const th=table.querySelectorAll('thead th');if(th.length>=8){th[0].textContent='Order';th[1].textContent='Trip Zone';th[2].textContent='Area';th[3].textContent='Address';th[4].remove();th[4].textContent='Status';th[5].textContent='Time';th[6].textContent='Feedback'}rows.forEach(r=>{if(r.children.length>=8)r.children[4].remove()})}
function simplifyFollowup(d){const sec=[...d.querySelectorAll('section')].find(s=>/Daily Follow-up/i.test(s.querySelector('h2')?.textContent||''));if(!sec)return;const table=sec.querySelector('table');if(!table)return;const th=[...table.querySelectorAll('thead th')];th.forEach(h=>{if(!['Order','Zone','Area','Address','Status','Feedback'].includes(h.textContent.trim()))h.remove()});const body=table.querySelector('tbody');[...(body?.querySelectorAll('tr')||[])].forEach(r=>{if(r.children.length>6)r.children[5]?.remove()});const h2=sec.querySelector('h2');if(h2)h2.textContent='Daily Follow-up — Important Customer Details';const sub=sec.querySelector('.sub');if(sub)sub.textContent='أهم بيانات المتابعة فقط: الطلب، المنطقة، العنوان، الحالة، والملاحظات.'}
function keepRouteMapFull(d){const sections=[...d.querySelectorAll('section')];const map=sections.find(s=>/Trip Group Route Map/i.test(s.querySelector('h2')?.textContent||''));if(map){map.style.gridColumn='1/-1';const el=map.querySelector('.map');if(el){setTimeout(()=>{const w=I.contentWindow;if(w&&w.L){for(const k of ['routeMap','routeMap2','tripGroupRouteMap']){if(w[k]&&w[k].invalidateSize)try{w[k].invalidateSize()}catch(e){}}}},300)}}}
function apply(){const d=I.contentDocument;if(!d)return;removeMap1(d);fixDetails(d);fixRanking(d);reorderFeedback(d);simplifyFollowup(d);keepRouteMapFull(d)}
I.addEventListener('load',()=>{setTimeout(apply,500);setTimeout(apply,1500);setTimeout(apply,3000);setTimeout(apply,5000)});
})();
</script></body></html>
