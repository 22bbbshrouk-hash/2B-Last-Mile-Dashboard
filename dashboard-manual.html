<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2B | Last Mile Operations</title><style>html,body{margin:0;height:100%;background:#07090d}#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#ff7900;font:700 18px Arial}</style></head><body><div id="loading">Loading 2B Dashboard…</div><script>
const SOURCE="https://raw.githubusercontent.com/22bbbshrouk-hash/2B-Last-Mile-Dashboard/aa1ccfd3260b5df9880880ba14d0f5d12d1577a4/dashboard-manual.html";
const DRAW="function drawMaps(gs){\n if(routeMap1)routeMap1.remove();\n if(routeMap2)routeMap2.remove();\n routeMap1=L.map('map1',{scrollWheelZoom:true}).setView([30.04,31.25],10);\n routeMap2=L.map('map2',{scrollWheelZoom:true}).setView([30.04,31.25],10);\n const tile='https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png';\n L.tileLayer(tile,{attribution:'\\u00a9 OpenStreetMap'}).addTo(routeMap1);\n L.tileLayer(tile,{attribution:'\\u00a9 OpenStreetMap'}).addTo(routeMap2);\n let all1=[],all2=[],legend=[];\n const anchors={\n  'East Cairo':[30.16,31.62],'New Cairo':[30.03,31.48],'Central Cairo':[30.05,31.26],\n  'Mohandessin':[30.05,31.20],'West Cairo':[30.00,31.16],'October / Zayed':[29.98,30.98],\n  'Maadi':[29.92,31.29],'Old Cairo':[30.02,31.24],'Heliopolis':[30.10,31.32],\n  'North East':[30.18,31.35],'North Coast':[30.85,28.95]\n };\n const pointFor=(g,a,gi,i)=>{\n   if(coords[a]) return {p:coords[a],approx:false};\n   const c=anchors[g.name]||[30.04,31.25];\n   const angle=(i%8)*(Math.PI/4),radius=0.012+((i%3)*0.004);\n   return {p:[c[0]+Math.sin(angle)*radius,c[1]+Math.cos(angle)*radius],approx:true};\n };\n gs.forEach((g,gi)=>{\n   const color=palette[gi%palette.length];\n   legend.push(`<span><i class=\"dot\" style=\"background:${color}\"></i>${esc(g.name)}</span>`);\n   const ordered=g.areas.map((a,i)=>({a,i,...pointFor(g,a,gi,i)}));\n   const valid=ordered.map(x=>x.p);\n   valid.forEach((p,i)=>{\n     const x=ordered[i],a=x.a;\n     const ars=g.rows.filter(r=>r.area===a);\n     const orders=new Set(ars.map(r=>r.order).filter(Boolean)).size;\n     const ac=ars.reduce((n,r)=>n+(/air.?condition|\\bac\\b|تكييف/i.test(r.product)?Number(r.qty)||1:0),0);\n     const note=x.approx?'<br><b>⚠ موقع تقريبي</b>':'<br><b>GPS mapped</b>';\n     const popup=`<b>Stop ${i+1} — ${esc(a)}</b><br>Trip: ${esc(g.name)}<br>Orders: ${orders}<br>AC: ${ac}${note}`;\n     L.marker(p,{icon:markerIcon(i+1,color)}).addTo(routeMap1).bindPopup(popup);\n     L.marker(p,{icon:markerIcon(i+1,color)}).addTo(routeMap2).bindPopup(popup);\n     if(x.approx)L.circle(p,{radius:1200,color,weight:1,fill:false,dashArray:'4 6'}).addTo(routeMap2);\n     all1.push(p);all2.push(p);\n   });\n   if(valid.length>1){\n     L.polyline(valid,{color,weight:5,opacity:.9}).addTo(routeMap1);\n     L.polyline(valid,{color,weight:3,opacity:.8,dashArray:'8 8'}).addTo(routeMap2);\n   }\n   ordered.forEach((x,i)=>{\n     L.tooltip({permanent:true,direction:'top',offset:[0,-16],className:'area-label'})\n       .setContent(`${i+1}. ${esc(x.a)}`)\n       .setLatLng(x.p).addTo(routeMap2);\n   });\n });\n $('legend1').innerHTML=legend.join('');\n if(all1.length){const b=L.latLngBounds(all1);routeMap1.fitBounds(b.pad(.10));}\n if(all2.length){const b2=L.latLngBounds(all2);routeMap2.fitBounds(b2.pad(.10));}\n setTimeout(()=>{routeMap1.invalidateSize();routeMap2.invalidateSize()},250);\n}";
(async()=>{
 try{
  const r=await fetch(SOURCE+'?v='+Date.now(),{cache:'no-store'});
  if(!r.ok)throw new Error('Source '+r.status);
  let html=await r.text();
  const start=html.indexOf('function drawMaps(gs){');
  const end=html.indexOf('function setSheets(names)',start);
  if(start<0||end<0)throw new Error('Map function not found');
  html=html.slice(0,start)+DRAW+'\n'+html.slice(end);
  document.open();document.write(html);document.close();
 }catch(e){document.getElementById('loading').textContent='Dashboard load error: '+e.message;console.error(e)}
})();
</script></body></html>
