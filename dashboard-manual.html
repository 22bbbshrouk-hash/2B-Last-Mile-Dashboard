<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2B | Last Mile Operations Control Tower</title><style>html,body{margin:0;width:100%;height:100%;background:#07090d}#dash{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="dash" src="dashboard-final.html?v=20260819" title="2B Last Mile Dashboard"></iframe><script src="dashboard-layout-patch.js?v=20260819"></script><script>
(function(){
const I=document.getElementById('dash');
const C={'القاهرة الجديدة':[30.03,31.49],'6 أكتوبر':[29.97,30.95],'السادس من أكتوبر':[29.97,30.95],'المعادي':[29.96,31.25],'الساحل الشمالى':[30.85,28.95],'العاصمة الادارية الجديدة':[30.02,31.75],'المقطم':[30.02,31.31],'المهندسين':[30.05,31.20],'الشروق':[30.14,31.62],'عين شمس- الشرقية':[30.13,31.32],'فيصل':[30.00,31.17],'الضاهر':[30.06,31.26],'حلوان':[29.85,31.34],'ارض اللواء':[30.08,31.19],'حدائق اكتوبر':[29.95,30.93],'زهراء المعادي':[29.95,31.30],'جسر السويس':[30.12,31.34],'الهرم':[29.99,31.14],'بولاق الدكرور':[30.03,31.19],'حدائق الاهرام':[29.97,31.10],'شبرا مصر':[30.08,31.25],'مايو':[29.73,31.37],'مدينة نصر':[30.06,31.34]};
function canon(s){let x=String(s||'').replace(/[\u064B-\u065F\u0670]/g,'').trim();x=x.replace(/مدينه\s*نصر/gi,'مدينة نصر');return x}
function fixRanking(d){const box=d.getElementById('areaRank');if(!box)return;const rows=[...box.querySelectorAll('.areaRow')];const seen=new Map();rows.forEach(r=>{const name=r.querySelector('.areaName'),count=r.querySelector('.count');if(!name||!count)return;const key=canon(name.textContent);name.textContent=key;const n=Number((count.textContent||'').replace(/,/g,''))||0;if(seen.has(key)){const old=seen.get(key);const oc=old.querySelector('.count');const total=(Number((oc.textContent||'').replace(/,/g,''))||0)+n;oc.textContent=String(total);r.remove()}else seen.set(key,r)});}
function fixDetails(d){const t=d.getElementById('details');if(!t)return;[...t.querySelectorAll('tr')].forEach(r=>{if(r.children[1])r.children[1].textContent=canon(r.children[1].textContent)})}
function fixMap1(d){const el=d.getElementById('map1'),w=I.contentWindow;if(!el||!w.L)return;let map=w.__areasOrdersMap;if(!map){map=w.L.map(el,{scrollWheelZoom:true});w.__areasOrdersMap=map;w.L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map)}else{map.invalidateSize();return}const grouped={};const t=d.getElementById('details');[...(t?.querySelectorAll('tr')||[])].forEach(r=>{const c=r.children;if(c.length<3)return;const area=canon(c[1]?.textContent),order=(c[2]?.textContent||'').trim();if(!area||!C[area])return;grouped[area]??=[];if(order&&!grouped[area].includes(order))grouped[area].push(order)});const layers=[];Object.entries(grouped).forEach(([area,orders])=>{const p=C[area];const marker=w.L.circleMarker(p,{radius:9,weight:2,fillOpacity:.9,color:'#ff7900',fillColor:'#ff7900'}).addTo(map);marker.bindPopup('<b>'+area+'</b><br>Unique Orders: '+orders.length+(orders.length?'<br><br>'+orders.join('<br>'):'')).openPopup;layers.push(marker)});if(layers.length)map.fitBounds(w.L.featureGroup(layers).getBounds().pad(.18));else map.setView([30.04,31.25],10);setTimeout(()=>map.invalidateSize(),200)}
function apply(){const d=I.contentDocument;if(!d)return;fixDetails(d);fixRanking(d);fixMap1(d)}
I.addEventListener('load',()=>{setTimeout(apply,500);setTimeout(apply,1500);setTimeout(apply,3000)});
})();
</script></body></html>
