const ROUTES=[['Maadi / Helwan / Mokattam',['15 مايو','مايو','المقطم','المعادي','المعادى','زهراء المعادي','حلوان']],['New Cairo',['القاهرة الجديدة','التجمع الأول','التجمع الاول','التجمع الخامس','الرحاب','التجمع الثالث','التجمع']],['Haram / Faisal',['الجيزة','العمرانية','الهرم','فيصل','ترسا']],['Nasr City / Heliopolis',['الزيتون','جسر السويس','النزهة','حدائق القبة','عزبة النخل','مدينة نصر','مصر الجديدة','روكسي','عين شمس','عين شمس- الشرقية','المطرية']],['October / Zayed',['السادس من أكتوبر','6 أكتوبر','حدائق الأهرام','حدائق الاهرام','حدائق أكتوبر','حدائق اكتوبر','الشيخ زايد','زايد']],['East Cairo',['الشروق','العبور','مدينتي','العاصمة الإدارية الجديدة','العاصمة الادارية الجديدة','بدر']],['Mohandeseen / Ard El Lewa',['المهندسين','أرض اللواء','ارض اللواء','بولاق الدكرور','الزمالك']],['Central Cairo',['شبرا مصر','الضاهر','وسط البلد','باب الشعرية','دار السلام','السيدة زينب']],['North Coast',['الساحل الشمالى','الساحل الشمالي']]];
const COLORS=['#ff7900','#36a3ff','#a66cff','#45d69c','#ff4f81','#ffd166','#00c2a8','#f26b38','#c084fc'];
const COORD={'القاهرة الجديدة':[30.03,31.47],'التجمع الأول':[30.04,31.47],'التجمع الاول':[30.04,31.47],'التجمع الخامس':[30,31.43],'الرحاب':[30.06,31.49],'التجمع الثالث':[30.01,31.50],'التجمع':[30.03,31.47],'الشروق':[30.13,31.62],'العبور':[30.23,31.46],'مدينتي':[30.10,31.64],'العاصمة الإدارية الجديدة':[30.01,31.73],'العاصمة الادارية الجديدة':[30.01,31.73],'مدينة نصر':[30.06,31.34],'مصر الجديدة':[30.09,31.33],'النزهة':[30.13,31.36],'جسر السويس':[30.14,31.39],'حدائق القبة':[30.08,31.29],'الزيتون':[30.11,31.31],'عين شمس':[30.13,31.34],'عين شمس- الشرقية':[30.13,31.34],'عزبة النخل':[30.14,31.36],'شبرا مصر':[30.08,31.24],'الضاهر':[30.06,31.27],'وسط البلد':[30.05,31.24],'السيدة زينب':[30.03,31.24],'دار السلام':[29.97,31.24],'المهندسين':[30.05,31.20],'أرض اللواء':[30.05,31.19],'ارض اللواء':[30.05,31.19],'بولاق الدكرور':[30.03,31.19],'الزمالك':[30.06,31.22],'الجيزة':[30.01,31.21],'العمرانية':[29.99,31.18],'الهرم':[29.99,31.15],'فيصل':[30,31.17],'ترسا':[29.99,31.17],'حدائق أكتوبر':[29.93,30.90],'حدائق اكتوبر':[29.93,30.90],'السادس من أكتوبر':[29.98,30.95],'6 أكتوبر':[29.98,30.95],'حدائق الأهرام':[29.96,31.12],'حدائق الاهرام':[29.96,31.12],'الشيخ زايد':[30.01,30.97],'زايد':[30.01,30.97],'المعادي':[29.96,31.26],'المعادى':[29.96,31.26],'حلوان':[29.85,31.33],'15 مايو':[29.86,31.37],'مايو':[29.86,31.37],'المقطم':[30.02,31.30],'زهراء المعادي':[29.97,31.29],'الساحل الشمالى':[30.95,28.80],'الساحل الشمالي':[30.95,28.80]};
const norm=v=>String(v??'').normalize('NFKC').toLowerCase().replace(/[\u064B-\u065F\u0670]/g,'').replace(/[\s_\-()./]/g,'').replace(/ى/g,'ي').replace(/ة/g,'ه').trim();
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const routeIndex=z=>Math.max(0,ROUTES.findIndex(x=>x[0]===z));
const areaCoord=a=>COORD[a]||Object.entries(COORD).find(([k])=>norm(k)===norm(a))?.[1]||[30.02,31.25];
async function geocode(address,area){const clean=String(address||'').trim();if(!clean)return null;const key='2b_geo_'+norm(clean);try{const cached=localStorage.getItem(key);if(cached){const j=JSON.parse(cached);if(Array.isArray(j)&&j.length===2)return j}}catch(e){}try{const q=encodeURIComponent(clean+', '+(area||'')+', Egypt');const r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=eg&q='+q,{headers:{'Accept':'application/json'}});if(!r.ok)return null;const j=await r.json();if(j[0]){const p=[Number(j[0].lat),Number(j[0].lon)];localStorage.setItem(key,JSON.stringify(p));return p}}catch(e){}return null}
function inject(){const f=document.getElementById('dash');const d=f.contentDocument,w=f.contentWindow;if(!d||!w)return;const old=w.renderMap;w.renderMap=function(doc,rows){const existing=doc.getElementById('routeMapSection');if(existing)existing.remove();const sec=doc.createElement('section');sec.className='card full';sec.id='routeMapSection';sec.innerHTML='<h2>🗺️ Trip Zones & Routes</h2><div class="sub">كل Order على الخريطة حسب عنوان العميل — اضغطي على العلامة لعرض Order والعنوان وFeedback لو موجود.</div><div id="routeMapOne" style="height:500px;border-radius:12px;overflow:hidden;margin-top:10px"></div><div id="routeLegend" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"></div>';const grid=doc.querySelector('.grid');const rt=doc.getElementById('routes')?.closest('section');if(!grid)return;grid.insertBefore(sec,rt||null);const ensure=()=>{if(!w.L){setTimeout(ensure,500);return}const L=w.L,map=L.map(doc.getElementById('routeMapOne')).setView([30.02,31.25],10);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);const bounds=[];const warehouse=[29.86,31.37];L.marker(warehouse,{icon:L.divIcon({className:'',html:'<div style="width:34px;height:34px;border-radius:50%;background:#fff;color:#111;font-size:18px;font-weight:900;text-align:center;line-height:34px;border:3px solid #ff7900;box-shadow:0 2px 8px #000">🚚</div>',iconSize:[34,34],iconAnchor:[17,17]})}).addTo(map).bindPopup('<div style="direction:rtl;text-align:right"><b style="color:#ff7900">Vehicle Warehouse</b><br>مخزن 15 مايو<br>عند أول سور مدينة الأبطال وبجوار المدرسة اليابانية<br><small>نقطة انطلاق خط السير</small></div>');bounds.push(warehouse);let seq=0;const jobs=[];ROUTES.forEach(([z,areas],ri)=>{const rs=rows.filter(r=>r.zone===z);if(!rs.length)return;const color=COLORS[ri],pts=[];areas.forEach(a=>{rs.filter(r=>norm(r.area)===norm(a)).forEach(r=>{seq++;const base=areaCoord(a),n=seq;const marker=L.marker(base,{icon:L.divIcon({className:'',html:'<div style="min-width:32px;height:32px;padding:0 5px;border-radius:50%;background:'+color+';color:#111;font-weight:900;text-align:center;line-height:32px;border:2px solid #fff;box-shadow:0 1px 6px #000">'+n+'</div>',iconSize:[32,32],iconAnchor:[16,16]})}).addTo(map);const popup=()=>'<div style="direction:rtl;text-align:right;min-width:240px"><b style="color:'+color+'">Route '+String(ri+1).padStart(2,'0')+' — '+esc(z)+'</b><hr><b>Order:</b> '+esc(r.order)+'<br><b>Area:</b> '+esc(r.area)+(r.address?'<hr><b>Customer Address:</b><br>'+esc(r.address):'')+(r.feedback?'<hr><b>Feedback / Note:</b><br><span style="color:#4da6ff;font-weight:900">'+esc(r.feedback)+'</span>':'')+'</div>';marker.bindPopup(popup());pts.push(base);bounds.push(base);if(r.address)jobs.push({r,marker,base});});});if(pts.length>1)L.polyline(pts,{color,weight:4,opacity:.7}).addTo(map);const actual=areas.filter(a=>rs.some(x=>norm(x.area)===norm(a)));doc.getElementById('routeLegend').insertAdjacentHTML('beforeend','<span style="border:1px solid '+color+';color:'+color+';padding:5px 8px;border-radius:7px;font-size:10px;font-weight:900">Route '+String(ri+1).padStart(2,'0')+' — '+esc(z)+' · '+actual.map(esc).join(' · ')+'</span>')});if(bounds.length)map.fitBounds(bounds,{padding:[20,20]});(async()=>{for(let i=0;i<jobs.length;i++){const j=jobs[i];const p=await geocode(j.r.address,j.r.area);if(p&&Number.isFinite(p[0])&&Number.isFinite(p[1])){j.marker.setLatLng(p);j.base=p;bounds.push(p)}if(i<jobs.length-1)await new Promise(res=>setTimeout(res,1100))}if(bounds.length)map.fitBounds(bounds,{padding:[20,20]})})();};ensure()};w.renderMap(doc,rows)};setTimeout(()=>{try{if(w.L){w.renderMap(d,[])} }catch(e){}},1000)}
f.addEventListener('load',()=>setTimeout(inject,1200));
</script></body></html>
