<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2B Last Mile Dashboard</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07090d}iframe{width:100%;height:100%;border:0}</style></head><body><iframe id="dash" src="dashboard-final.html?v=20260819-final"></iframe><script>
const TRIPS={'East Cairo':['العبور','الشروق','مدينتي','العاصمة الادارية الجديدة','العاصمة الإدارية الجديدة','بدر'],'New Cairo':['القاهرة الجديدة','الرحاب','التجمع','التجمع الأول','التجمع الاول','التجمع الثالث','التجمع الثالث','التجمع الخامس','التجمع الخامس'],'Central Cairo':['وسط البلد','باب الشعرية','دار السلام','شبرا مصر','السيدة زينب'],'Mohandessin':['المهندسين','ارض اللواء','أرض اللواء','الزمالك','بولاق الدكرور'],'West Cairo':['ترسا','الجيزة','فيصل','العمرانية','الهرم','أبو نمرس','ابو نمرس'],'October / Zayed':['حدائق أكتوبر','حدائق الاهرام','حدائق الأهرام','6 أكتوبر','6 اكتوبر','السادس من أكتوبر','الشيخ زايد','زايد'],'Maadi / Helwan / Mokattam':['المعادي','المعادى','حلوان','مايو','المقطم','زهراء المعادي'],'Old Cairo':['مصر القديمة','السيدة عائشة'],'Heliopolis / Nasr City':['مصر الجديدة','النزهة','روكسي','جسر السويس','حدائق القبة','الزيتون','المطرية','عين شمس- الشرقية','عين شمس','عزبة النخل','مدينة نصر'],'North East':['الخانكة','المرج'],'North Coast':['الساحل الشمالى','الساحل الشمالي']};
function clean(s){return String(s||'').toLowerCase().replace(/[\s\-_()./]/g,'').trim()}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function tripFor(area){let a=clean(area);for(const[g,list]of Object.entries(TRIPS)){if(list.some(x=>clean(x)===a))return g}if(a.includes('حدائقاهرام')||a.includes('اكتوبر')||a.includes('زايد'))return 'October / Zayed';if(a.includes('مهندسين')||a.includes('ارضاللواء')||a.includes('زمالك')||a.includes('بولاق'))return 'Mohandessin';if(a.includes('معادى')||a.includes('معادي')||a.includes('مقطم')||a.includes('حلوان')||a.includes('مايو'))return 'Maadi / Helwan / Mokattam';if(a.includes('نصر'))return 'Heliopolis / Nasr City';return 'Other'}
function num(s){let n=parseFloat(String(s||'').replace(/[^0-9.\-]/g,''));return isNaN(n)?0:n}function getTableRows(sec){const table=sec?.querySelector('table');if(!table)return[];const hs=[...table.querySelectorAll('thead th')].map(x=>x.textContent.trim());const idx=k=>hs.findIndex(h=>clean(h).includes(clean(k)));return[...table.querySelectorAll('tbody tr')].map(tr=>{const cs=[...tr.children].map(x=>x.textContent.trim());return{order:cs[idx('Order')]||cs[0]||'',area:cs[idx('Area')]||cs[1]||'',sku:cs[idx('SKU')]||'',product:cs[idx('Product')]||'',qty:num(cs[idx('QTY')]||1),address:cs[idx('Address')]||'',time:cs[idx('Time')]||'',feedback:cs[idx('Feedback')]||''}})}
function renderAreaRanking(sec,rows){if(!sec)return;const m={};rows.forEach(r=>{const a=(r.area||'غير محدد').trim();if(!m[a])m[a]=new Set();if(r.order)m[a].add(r.order)});const arr=Object.entries(m).map(([area,set])=>({area,n:set.size})).sort((a,b)=>b.n-a.n||a.area.localeCompare(b.area,'ar'));sec.innerHTML='<h2>Area Load Ranking</h2><div class="sub">Unique Orders حسب المنطقة — كل Area تظهر مرة واحدة فقط.</div><div style="margin-top:10px">'+(arr.length?arr.map(x=>'<div style="display:flex;align-items:center;gap:10px;margin:8px 0"><div style="width:170px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(x.area)+'</div><div style="flex:1;height:8px;background:#1a222c;border-radius:99px;overflow:hidden"><div style="height:100%;width:'+Math.max(6,Math.round(x.n/(arr[0].n||1)*100))+'%;background:#ff7900"></div></div><b style="width:35px;text-align:left">'+x.n+'</b></div>').join(''):'<div style="color:#778494;padding:18px;text-align:center">لا توجد بيانات</div>')+'</div>'}
function renderZoneSummary(sec,rows){if(!sec)return;const groups={};rows.forEach(r=>{const g=tripFor(r.area);if(!groups[g])groups[g]={orders:new Set(),sku:new Set(),qty:0,ac:0,areas:new Set()};if(r.order)groups[g].orders.add(r.order);if(r.sku)groups[g].sku.add(r.sku);groups[g].qty+=r.qty||0;groups[g].areas.add(r.area);if(/^ac[-_]/i.test(r.sku)||/air\s*-?condition|air conditioner|تكييف/i.test(r.product))groups[g].ac+=r.qty||1});const arr=Object.entries(groups).sort((a,b)=>b[1].orders.size-a[1].orders.size);sec.innerHTML='<h2>Operational Zone Summary</h2><div class="sub">Trip Groups مبنية على الاتجاه وخط السير، وليس اسم الـArea فقط.</div><div style="margin-top:10px">'+arr.map(([g,v])=>{const veh=v.ac?Math.ceil(v.ac/13):0;return'<div style="padding:11px;margin:8px 0;border:1px solid #26313d;border-radius:10px;background:#0c1117"><div style="font-weight:900;font-size:12px">'+esc(g)+'</div><div style="color:#8793a3;font-size:10px;margin:4px 0">'+esc([...v.areas].filter(Boolean).join(' · '))+'</div><b>Orders '+v.orders.size+'</b> · SKU '+v.sku.size+' · QTY '+v.qty+' · AC '+v.ac+(v.ac?' · Vehicles '+veh:'')+'</div>'}).join('')+'</div>'}
function usefulNote(t){return /تغيير\s*العنوان|تغير\s*العنوان|تأجيل|تاجيل|استلام\s*(بعد|قبل)|بعد\s*الساعة|بعد\s*ساع|قبل\s*الساعة|رقم\s*(اضافي|إضافي|تواصل)|تواصل|عنوان\s*(جديد|ضرور)|مكتب|office|postpon|pickup|contact|address/i.test(t||'')}
function renderFeedback(sec,rows){if(!sec)return;const rr=rows.filter(r=>usefulNote(r.feedback+' '+r.time+' '+r.address));sec.innerHTML='<h2>Customer Feedback & Route Details</h2><div class="sub">ملاحظات تشغيلية فقط: عنوان ضروري، وقت استلام، تأجيل، أو تواصل مهم.</div><div class="scroll"><table><thead><tr><th>Order</th><th>Trip Group</th><th>Area</th><th>Address</th><th>SKU</th><th>Time</th><th>Feedback</th></tr></thead><tbody>'+ (rr.length?rr.map(r=>'<tr><td>'+esc(r.order)+'</td><td>'+esc(tripFor(r.area))+'</td><td>'+esc(r.area)+'</td><td>'+esc(r.address||'—')+'</td><td>'+esc(r.sku)+'</td><td>'+esc(r.time||'—')+'</td><td>'+esc(r.feedback||'—')+'</td></tr>').join(''):'<tr><td colspan="7" class="empty">لا توجد ملاحظات تشغيلية مهمة اليوم</td></tr>')+'</tbody></table></div>'}
function renderOperations(sec,rows){if(!sec)return;const map=new Map();rows.filter(r=>usefulNote(r.feedback+' '+r.time+' '+r.address)).forEach(r=>{if(r.order&&!map.has(r.order))map.set(r.order,r)});const rr=[...map.values()];sec.innerHTML='<h2>🚚 Daily Operations Control</h2><div class="sub">Action Required فقط — بدون تكرار لنفس الـOrder.</div><div class="scroll"><table><thead><tr><th>Order</th><th>Trip Group</th><th>Area</th><th>Address</th><th>Action Required</th></tr></thead><tbody>'+ (rr.length?rr.map(r=>'<tr><td>'+esc(r.order)+'</td><td>'+esc(tripFor(r.area))+'</td><td>'+esc(r.area)+'</td><td>'+esc(r.address||'—')+'</td><td>'+esc((r.feedback||r.time||'').trim()||'—')+'</td></tr>').join(''):'<tr><td colspan="5" class="empty">لا توجد Actions Required</td></tr>')+'</tbody></table></div>'}
function renderRoutes(sec,rows){if(!sec)return;const groups={};rows.forEach(r=>{const g=tripFor(r.area);if(!groups[g])groups[g]=[];groups[g].push(r)});const names=Object.keys(groups).sort((a,b)=>groups[b].length-groups[a].length);sec.innerHTML='<div class="zoneHead"><div><h2 class="bottomTitle">🛣️ Route & Vehicle Analysis</h2><div class="sub">Analysis → Load → Vehicles Required → Route Grouping → Final Route. كل Trip Group = مناطق في نفس الاتجاه، وعدد العربيات حسب الحمولة. الدبابة = 13 AC.</div></div><div class="zoneBadge">دبابة = 13 AC MAX</div></div>'+names.map((g,i)=>{const rs=groups[g],orders=new Set(rs.map(r=>r.order).filter(Boolean)),skus=new Set(rs.map(r=>r.sku).filter(Boolean)),areas=[...new Set(rs.map(r=>r.area).filter(Boolean))],qty=rs.reduce((s,r)=>s+(r.qty||0),0),ac=rs.reduce((s,r)=>s+((/^ac[-_]/i.test(r.sku)||/air\s*-?condition|air conditioner|تكييف/i.test(r.product))?(r.qty||1):0),0),veh=ac?Math.ceil(ac/13):0;return'<div class="routeCard"><div class="routeTitle">🛣️ Route '+String(i+1).padStart(2,'0')+' — '+esc(g)+'</div><div class="muted"><b>خط السير:</b> '+esc(areas.join(' → '))+'</div><div style="margin-top:7px"><b>Orders:</b> '+orders.size+' · <b>SKU:</b> '+skus.size+' · <b>QTY:</b> '+qty+' · <b>AC:</b> '+ac+'</div><div style="margin-top:7px"><b>Vehicle:</b> '+(veh?'🚚 دبابة × '+veh:'🚚 مراجعة حمولة الجمبو/غير التكييف')+' · <b>Load:</b> '+(ac?ac+' / '+(veh*13)+' AC':'Review non-AC load')+'</div></div>'}).join('')}
async function localFirstUpload(d,file){const w=d.defaultView,st=d.getElementById('dataStatus'),set=s=>{if(st)st.textContent=s};if(!w?.XLSX||!w.normalize){throw new Error('dashboard parser not ready')}set('جاري قراءة شيت اليوم من جهازك...');const wb=w.XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true});const names=wb.SheetNames||[];const dateSheets=names.map(n=>{const m=String(n).match(/^(\d{1,2})[\-_](\d{1,2})(?:[\-_](\d{2,4}))?$/);return m?{name:n,d:+m[1],m:+m[2],y:m[3]?+(m[3].length===2?'20'+m[3]:m[3]):2026}:null}).filter(Boolean).sort((a,b)=>b.y-a.y||b.m-a.m||b.d-a.d);const chosen=dateSheets[0]?.name||(names.includes('19-8')?'19-8':names.includes('Last_Mile_Data')?'Last_Mile_Data':names[0]);if(!chosen)throw new Error('الملف لا يحتوي على Sheets');const ws=wb.Sheets[chosen];w.rows=w.normalize(w.XLSX.utils.sheet_to_json(ws,{defval:'',raw:true}));if(w.fill){w.fill('date',[...new Set(w.rows.map(r=>r.date))],'كل الأيام');w.fill('area',[...new Set(w.rows.map(r=>r.area))],'كل المناطق');w.fill('zone',[...new Set(w.rows.map(r=>r.zone))],'كل الـTrip Zones');w.fill('status',[...new Set(w.rows.map(r=>r.status))],'كل الحالات')}w.render();set('✓ تم فتح Sheet: '+chosen+' — الداتا محدثة فورًا');return chosen}
async function saveInBackground(d,file){const set=s=>{const st=d.getElementById('dataStatus');if(st)st.textContent=s};try{const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),12000);const res=await fetch('https://wihopmnjpsfsgujugyzl.supabase.co/storage/v1/object/dashboard-data/Last_Mile_Data.xlsx',{method:'POST',headers:{apikey:'sb_publishable_d_iGTrKLgLx3Ntn-xExJhw_teic9wsl','Content-Type':file.type||'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet','Cache-Control':'no-cache','x-upsert':'true'},body:file,signal:controller.signal});clearTimeout(timer);if(!res.ok)throw new Error('HTTP '+res.status);set('✓ تم تحديث الداتا وحفظ آخر نسخة للـShare Link')}catch(e){console.error(e);set('✓ الداتا محدثة — التخزين لم يكتمل، جربي تحديث يدوي لاحقًا')}}
function installUploadFix(d){const input=d.getElementById('file');if(!input||input.dataset.fixed==='2')return;const fresh=input.cloneNode(true);fresh.dataset.fixed='2';input.parentNode.replaceChild(fresh,input);fresh.addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;try{await localFirstUpload(d,file);saveInBackground(d,file)}catch(err){console.error(err);const st=d.getElementById('dataStatus');if(st)st.textContent='❌ '+(err.message||'تعذر قراءة الملف')}})}
const f=document.getElementById('dash');f.addEventListener('load',()=>{try{const d=f.contentDocument,w=f.contentWindow;installUploadFix(d);setTimeout(()=>{const st=d.getElementById('dataStatus');if(st&&/جاري تحميل آخر شيت/.test(st.textContent))st.textContent='جاهز — اختاري شيت اليوم من جهازك أو اضغطي تحديث يدوي';},3000);const grid=d.querySelector('.grid');if(!grid)return;const sections=[...grid.children];const find=s=>sections.find(x=>(x.querySelector('h2')?.textContent||'').includes(s));const area=find('Area Load Ranking'),zone=find('Operational Trip Zone Summary')||find('Zone Summary'),map1=find('Map 1'),map2=find('Map 2'),detail=find('Area → Orders'),feedback=find('Customer Feedback'),follow=find('Daily Follow-up')||find('Daily Operations Control'),route=find('Zone → Route → Vehicle')||find('Route & Vehicle Analysis');const rows=getTableRows(detail);renderAreaRanking(area,rows);renderZoneSummary(zone,rows);renderFeedback(feedback,rows);renderOperations(follow,rows);if(route)renderRoutes(route,rows);[area,zone,map1,map2,detail,feedback,follow,route].filter(Boolean).forEach(s=>grid.appendChild(s));[...d.querySelectorAll('.map')].forEach(e=>e.style.height='410px');w.dispatchEvent(new Event('resize'))}catch(e){console.error('dashboard patch',e)}});</script></body></html>
