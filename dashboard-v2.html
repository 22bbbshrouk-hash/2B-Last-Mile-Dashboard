<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2B Last Mile Dashboard</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07090d}iframe{width:100%;height:100%;border:0}</style></head><body><iframe id="dash" src="dashboard-final.html?v=20260819-final"></iframe><script>const f=document.getElementById('dash');f.addEventListener('load',()=>{try{const d=f.contentDocument,w=d.defaultView;const grid=d.querySelector('.grid');if(!grid)return;const sections=[...grid.children];const area=sections.find(x=>x.querySelector('h2')?.textContent.includes('Area Load Ranking'));const zone=sections.find(x=>x.querySelector('h2')?.textContent.includes('Operational Trip Zone Summary'));const map1=sections.find(x=>x.querySelector('h2')?.textContent.includes('Map 1'));const map2=sections.find(x=>x.querySelector('h2')?.textContent.includes('Map 2'));const detail=sections.find(x=>x.querySelector('h2')?.textContent.includes('Area → Orders'));const feedback=sections.find(x=>x.querySelector('h2')?.textContent.includes('Customer Feedback'));const follow=sections.find(x=>x.querySelector('h2')?.textContent.includes('Daily Follow-up'));const route=sections.find(x=>x.querySelector('h2')?.textContent.includes('Zone → Route → Vehicle'));if(follow){follow.querySelector('h2').textContent='🚚 Daily Operations Control';const sub=follow.querySelector('.sub');if(sub)sub.textContent='Action Required فقط: عنوان/وقت/تأجيل/تواصل ضروري، بدون تكرار.';const table=follow.querySelector('table');if(table){table.querySelector('thead').innerHTML='<tr><th>Order</th><th>Trip Zone</th><th>Area</th><th>Address</th><th>Status</th><th>Action Required</th></tr>';const old=table.querySelector('tbody');const rows=[...old.querySelectorAll('tr')];rows.forEach(r=>{const cells=[...r.children];const note=(cells[5]?.textContent||'').trim();const useful=/عنوان|تغيير|تأجيل|استلام|رقم|تواصل|after|pickup|postpon/i.test(note);if(!useful)r.remove();});} }
if(feedback){const sub=feedback.querySelector('.sub');if(sub)sub.textContent='نظهر فقط الملاحظات المؤثرة على الـRoute: عنوان ضروري، وقت استلام، تأجيل، أو تواصل ضروري.';const table=feedback.querySelector('table');if(table){const heads=table.querySelector('thead tr');heads.innerHTML='<th>Order</th><th>Trip Zone</th><th>Area</th><th>Address</th><th>SKU</th><th>Time</th><th>Route / Delivery Note</th>';[...table.querySelectorAll('tbody tr')].forEach(r=>{const t=r.textContent||'';if(!/تغيير العنوان|تغير العنوان|تأجيل|تاجيل|استلام بعد|استلام قبل|الساعة|ساعه|رقم اضافي|رقم تواصل|تواصل|postpon|pickup|contact/i.test(t))r.remove();});}}
if(route){const h=route.querySelector('h2');if(h)h.textContent='🛣️ Route & Vehicle Analysis';const sub=route.querySelector('.sub');if(sub)sub.textContent='Analysis → Load → Vehicles Required → Route Grouping → Final Route. المناطق في نفس الاتجاه تتجمع، وعدد العربيات حسب الحمولة. الدبابة = 13 AC.';const old=route.querySelector('#routes');if(old){const box=d.createElement('div');box.className='routeCard';box.innerHTML='<div class="routeTitle">① Route Analysis → ② Vehicle Capacity → ③ Route Grouping → ④ Final Route Plan</div><div class="muted">كل Trip Group يتم تحليله أولًا من حيث Orders / SKU / QTY / AC، ثم نحسب عدد العربيات، ثم نعرض المناطق كخط سير واحد حسب الاتجاه والحمولة.</div>';route.insertBefore(box,old);}}
// ترتيب نهائي: Summary أولًا، ثم Ranking/Zone، ثم الخريطتان، ثم التفاصيل، ثم التحكم التشغيلي، والـRoute Analysis آخر حاجة.
[area,zone,map1,map2,detail,feedback,follow,route].filter(Boolean).forEach(s=>grid.appendChild(s));w.dispatchEvent(new Event('resize'));setTimeout(()=>{d.querySelectorAll('.map').forEach(e=>{e.style.height='410px'});},500);}catch(e){console.error(e)}});</script></body></html>
