<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2B | Last Mile Operations Control Tower</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%2307090d'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-family='Arial' font-size='30' font-weight='900' fill='%23ff7900'%3E2B%3C/text%3E%3C/svg%3E"><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><style>html,body{margin:0;width:100%;height:100%;background:#07090d}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="dash" src="./dashboard-new-20260820.html?v=v2-20260822" title="2B Last Mile Dashboard"></iframe><script>
const PUBLIC='https://wihopmnjpsfsgujugyzl.supabase.co/storage/v1/object/public/dashboard-data/Last_Mile_Data.xlsx';
const ROUTES=[['New Cairo',['القاهرة الجديدة','التجمع','التجمع الاول','التجمع الأول','التجمع الثالث','التجمع الخامس','الرحاب']],['East Cairo',['العبور','الشروق','مدينتي','العاصمة الإدارية الجديدة','العاصمة الادارية الجديدة','بدر']],['Nasr City / Heliopolis',['مدينة نصر','مصر الجديدة','النزهة','روكسي','جسر السويس','حدائق القبة','الزيتون','المطرية','عين شمس','عين شمس- الشرقية']],['Central Cairo',['وسط البلد','باب الشعرية','الضاهر','دار السلام','شبرا مصر','السيدة زينب']],['Mohandeseen / Ard El Lewa',['المهندسين','أرض اللواء','ارض اللواء','الزمالك','بولاق الدكرور']],['Haram / Faisal',['الهرم','فيصل','الجيزة','العمرانية']],['October / Zayed',['حدائق أكتوبر','حدائق اكتوبر','6 أكتوبر','السادس من أكتوبر','الشيخ زايد','زايد','حدائق الأهرام','حدائق الاهرام']],['Maadi / Helwan / Mokattam',['المعادي','المعادى','حلوان','15 مايو','مايو','المقطم','زهراء المعادي']],['North Coast',['الساحل الشمالى','الساحل الشمالي']]];
const COLORS=['#ff7900','#36a3ff','#a66cff','#45d69c','#ff4f81','#ffd166','#00c2a8','#f26b38','#c084fc'];
const COORD={'القاهرة الجديدة':[30.03,31.47],'التجمع الأول':[30.04,31.47],'التجمع الاول':[30.04,31.47],'التجمع الخامس':[30,31.43],'الرحاب':[30.06,31.49],'التجمع الثالث':[30.01,31.50],'الشروق':[30.13,31.62],'العبور':[30.23,31.46],'مدينتي':[30.10,31.64],'العاصمة الإدارية الجديدة':[30.01,31.73],'العاصمة الادارية الجديدة':[30.01,31.73],'مدينة نصر':[30.06,31.34],'مصر الجديدة':[30.09,31.33],'النزهة':[30.13,31.36],'جسر السويس':[30.14,31.39],'حدائق القبة':[30.08,31.29],'الزيتون':[30.11,31.31],'عين شمس':[30.13,31.34],'عين شمس- الشرقية':[30.13,31.34],'عزبة النخل':[30.14,31.36],'شبرا مصر':[30.08,31.24],'الضاهر':[30.06,31.27],'وسط البلد':[30.05,31.24],'السيدة زينب':[30.03,31.24],'دار السلام':[29.97,31.24],'المهندسين':[30.05,31.20],'أرض اللواء':[30.05,31.19],'ارض اللواء':[30.05,31.19],'بولاق الدكرور':[30.03,31.19],'الزمالك':[30.06,31.22],'الجيزة':[30.01,31.21],'العمرانية':[29.99,31.18],'الهرم':[29.99,31.15],'فيصل':[30,31.17],'حدائق أكتوبر':[29.93,30.90],'حدائق اكتوبر':[29.93,30.90],'السادس من أكتوبر':[29.98,30.95],'6 أكتوبر':[29.98,30.95],'حدائق الأهرام':[29.96,31.12],'حدائق الاهرام':[29.96,31.12],'الشيخ زايد':[30.01,30.97],'زايد':[30.01,30.97],'المعادي':[29.96,31.26],'المعادى':[29.96,31.26],'حلوان':[29.85,31.33],'15 مايو':[29.86,31.37],'مايو':[29.86,31.37],'المقطم':[30.02,31.30],'زهراء المعادي':[29.97,31.29],'الساحل الشمالى':[30.95,28.80],'الساحل الشمالي':[30.95,28.80]};
const norm=v=>String(v??'').normalize('NFKC').toLowerCase().replace(/[\u064B-\u065F\u0670]/g,'').replace(/[\s_\-()./]/g,'').replace(/ى/g,'ي').replace(/ة/g,'ه').trim();
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function val(r,names){const ks=Object.keys(r);for(const n of names){const q=norm(n),k=ks.find(x=>norm(x)===q);if(k&&String(r[k]).trim()!=='')return r[k]}for(const k of ks){const q=norm(k);if(names.some(n=>q.includes(norm(n))||norm(n).includes(q))&&String(r[k]).trim()!=='')return r[k]}return ''}
function parseRows(ws){return XLSX.utils.sheet_to_json(ws,{defval:'',raw:false}).map(r=>({order:String(val(r,['order','order number','order no','ordernumber','orderno','awb','shipment','shipment number','رقم الطلب','الطلب','ref nbr','ref number'])).trim(),area:String(val(r,['area','area name','region','zone area','المنطقة','المنطقه','area_name','delivery area'])).trim(),feedback:String(val(r,['feedback','customer feedback','customerfeedback','ملاحظات','الملاحظات','تعليق العميل','تعليق'])).trim()})).filter(x=>x.order)}
function patchVehicles(d){const card=d.getElementById('kVehicles');if(!card)return;let total=0;d.querySelectorAll('#routes .routeCard').forEach(c=>{const m=(c.textContent||'').match(/🚚\s*(\d+)\s*Vehicle/);if(m)total+=Number(m[1])});if(total>0)card.textContent=total}
async function addMap(d,rows){if(d.getElementById('orderMapV2'))return;const link=d.createElement('link');link.rel='stylesheet';link.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';d.head.appendChild(link);const sec=d.createElement('section');sec.className='card full';sec.id='orderMapV2';sec.innerHTML='<h2>🗺️ Trip Zones & Routes — Orders</h2><div class="sub">كل منطقة مرقمة حسب خط السير. اضغطي على الرقم لرؤية كل Orders والـFeedback لو موجود.</div><div id="orderMapCanvas" style="height:500px;border-radius:12px;overflow:hidden;margin-top:10px"></div><div id="mapLegendV2" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"></div><div style="margin-top:10px;padding:10px;border:1px solid #5b371b;border-radius:9px;color:#ffb477;background:#171008;font-size:11px"><b>📍 Vehicle Warehouse:</b> العربيات بتطلع من مخزن 15 مايو — عند أول سور مدينة الأبطال بجوار المدرسة اليابانية.</div>';const grid=d.querySelector('.grid');const routes=d.getElementById('routes')?.closest('section');grid.insertBefore(sec,routes||null);const script=d.createElement('script');script.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';script.onload=()=>{const L=d.defaultView.L,map=L.map(d.getElementById('orderMapCanvas')).setView([30.02,31.25],10);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);const bounds=[];ROUTES.forEach(([route,areas],ri)=>{const color=COLORS[ri];const routeRows=rows.filter(r=>areas.some(x=>norm(x)===norm(r.area)));if(!routeRows.length)return;areas.forEach((area,ai)=>{const c=COORD[area];if(!c)return;const rs=routeRows.filter(r=>norm(r.area)===norm(area));if(!rs.length)return;const orders=[...new Set(rs.map(r=>r.order))],feedback=[...new Set(rs.map(r=>r.feedback).filter(Boolean))];const popup='<div style="direction:rtl;text-align:right;min-width:250px"><b style="color:'+color+'">Route '+String(ri+1).padStart(2,'0')+' — '+esc(route)+'</b><br><b>📍 '+esc(area)+'</b><hr><b>Orders:</b><br>'+orders.map(esc).join(' · ')+(feedback.length?'<hr><b>Feedback:</b><br>'+feedback.map(esc).join('<br>'):'')+'</div>';L.marker(c,{icon:L.divIcon({className:'',html:'<div style="width:30px;height:30px;border-radius:50%;background:'+color+';color:#111;font-weight:900;text-align:center;line-height:30px;border:2px solid #fff;box-shadow:0 1px 5px #000">'+(ai+1)+'</div>',iconSize:[30,30],iconAnchor:[15,15]})}).addTo(map).bindPopup(popup);bounds.push(c)});d.getElementById('mapLegendV2').insertAdjacentHTML('beforeend','<span style="border:1px solid '+color+';color:'+color+';padding:5px 8px;border-radius:7px;font-size:10px;font-weight:900">Route '+String(ri+1).padStart(2,'0')+' — '+esc(route)+'</span>')});if(bounds.length)map.fitBounds(bounds,{padding:[20,20]})};d.head.appendChild(script)}
async function patch(){try{const f=document.getElementById('dash'),d=f.contentDocument;if(!d)return;patchVehicles(d);const rr=await fetch(PUBLIC+'?v='+Date.now(),{cache:'no-store'});if(!rr.ok)return;const wb=XLSX.read(await rr.arrayBuffer(),{type:'array'}),rows=parseRows(wb.Sheets[wb.SheetNames[0]]);await addMap(d,rows)}catch(e){console.error('v2 patch',e)}}
const frame=document.getElementById('dash');frame.addEventListener('load',()=>{setTimeout(patch,1200);setTimeout(patch,3000)});</script></body></html>
