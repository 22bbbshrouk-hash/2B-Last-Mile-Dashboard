name: Patch dashboard direct link

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Patch dashboard-fixed.html
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/dashboard-fixed.html"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$api?ref=main" > /tmp/file.json
          python3 - <<'PY'
          import json, base64
          j=json.load(open('/tmp/file.json'))
          s=base64.b64decode(j['content']).decode('utf-8')
          marker='<script src="./geo-cluster.js?v=20260910"></script>'
          if marker not in s:
              s=s.replace('</body>', marker+'</body>')
          old="$('share').onclick=async()=>{try{await navigator.clipboard.writeText(location.href);$('status').textContent='تم نسخ رابط الداشبورد ✓'}catch{prompt('انسخي الرابط',location.href)}};"
          new="$('share').onclick=async()=>{const stable=new URL('./',location.href).href;try{await navigator.clipboard.writeText(stable);$('status').textContent='تم نسخ رابط الداشبورد ✓'}catch{prompt('انسخي الرابط',stable)}};"
          if old in s:
              s=s.replace(old,new)
          open('/tmp/new.txt','w').write(s)
          open('/tmp/sha','w').write(j['sha'])
          PY
          export CONTENT=$(base64 -w0 /tmp/new.txt)
          export SHA=$(cat /tmp/sha)
          python3 - <<'PY' > /tmp/payload.json
          import json, os
          print(json.dumps({'message':'Load geo clustering on direct dashboard link','content':os.environ['CONTENT'],'sha':os.environ['SHA'],'branch':'main'}))
          PY
          curl -fsSL -X PUT "$api" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/payload.json
