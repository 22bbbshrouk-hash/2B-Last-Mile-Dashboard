name: Inject final dashboard patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  inject:
    if: "!contains(github.event.head_commit.message, '[skip v2 patch]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject patch
        shell: python
        run: |
          from pathlib import Path
          p=Path('dashboard-v2.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="./dashboard-v2-final-patch.js?v=final"></script>'
          if tag not in s:
              pos=s.lower().rfind('</body>')
              if pos<0: raise SystemExit('No body')
              s=s[:pos]+tag+s[pos:]
              p.write_text(s,encoding='utf-8')
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dashboard-v2.html
          git diff --cached --quiet && exit 0
          git commit -m 'Inject final dashboard patch [skip v2 patch]'
          git push
