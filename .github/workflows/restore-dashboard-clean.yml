name: Restore clean dashboard

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    if: "!contains(github.event.head_commit.message, 'Restore dashboard-new clean baseline')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore clean dashboard baseline
        run: |
          git checkout 5e8b6869c51993391845e1ba3bd5d584198e99de -- dashboard-new-20260820.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard-new-20260820.html
          git commit -m "Restore dashboard-new clean baseline" || exit 0
          git push
