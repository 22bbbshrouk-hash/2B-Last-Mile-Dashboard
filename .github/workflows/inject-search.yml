name: Inject live dashboard search
on:
  push:
    branches: [main, search-fix]
permissions:
  contents: write
jobs:
  inject:
    if: "!contains(github.event.head_commit.message, '[skip search inject]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject search script
        shell: python
        run: |
          from pathlib import Path
          p=Path('dashboard-new-20260820.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="./dashboard-search-live.js"></script>'
          if tag not in s:
              pos=s.lower().rfind('</body>')
              if pos<0: raise SystemExit('No </body> found')
              s=s[:pos]+tag+s[pos:]
              p.write_text(s,encoding='utf-8')
      - name: Commit injected script
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dashboard-new-20260820.html
          git diff --cached --quiet && exit 0
          git commit -m 'Inject live search filter [skip search inject]'
          git push