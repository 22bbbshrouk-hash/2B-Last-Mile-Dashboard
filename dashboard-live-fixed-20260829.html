<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2B Last Mile Operations Control Tower</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07090d}iframe{width:100%;height:100%;border:0}</style></head><body><iframe id="app" src="dashboard-final-20260829.html?v=repair0830"></iframe><script>
const PUBLIC='https://wihopmnjpsfsgujugyzl.supabase.co/storage/v1/object/public/dashboard-data/Last_Mile_Data.xlsx';
const frame=document.getElementById('app');
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;')}
function patch(){
 const w=frame.contentWindow,d=frame.contentDocument;if(!w||!d)return;
 const originalRender=w.render;
 async function loadFresh(){
  try{
   if(!w.XLSX)return;
   const res=await fetch(PUBLIC+'?v='+Date.now(),{cache:'no-store'});if(!res.ok)throw new Error('HTTP '+res.status);
   const buf=await res.arrayBuffer();const wb=w.XLSX.read(buf,{type:'array'});
   const ws=wb.Sheets[wb.SheetNames[0]];const rows=w.parse(ws);
   if(!rows||!rows.length)throw new Error('No rows');
   w.data=rows;if(typeof w.render==='function')w.render();setTimeout(apply,80);
  }catch(e){const s=d.getElementById('status');if(s)s.textContent='تعذر تحميل الشيت — استخدمي Upload Daily Excel';console.error(e)}
 }
 function apply(){
  try{
   const kv=d.getElementById('kv');if(kv&&Array.isArray(w.data)){let load=0;for(const r of w.data){const q=Number(r.qty)||0;const p=((r.product||'')+' '+(r.productAR||'')).toLowerCase();let unit=1;if(/air|condition|ac|مكيف|تكييف/.test(p))unit=1;else if(/fridge|refrigerator|ثلاجه|ثلاجة/.test(p))unit=1.2;else if(/tv|television|شاشه|شاشة/.test(p))unit=.55;else if(/washing|غساله|غسالة/.test(p))unit=.9;else unit=.45;load+=q*unit}kv.textContent=Math.max(1,Math.ceil(load/13))+' Dabbaba'}
   const tb=d.getElementById('follow');if(tb&&Array.isArray(w.data)){const rows=w.data.filter(r=>String(r.feedback||'').trim());tb.innerHTML=rows.length?rows.map(r=>`<tr><td>${esc(r.order)}</td><td>${esc(r.customer)}</td><td>${esc(r.phone)}</td><td>${esc(r.area)}</td><td>${esc(r.address)}</td><td>${esc(r.feedback)}</td></tr>`).join(''):'<tr><td colspan="6" class="empty">لا توجد ملاحظات عميل في الداتا الحالية</td></tr>'}
   const rz=d.getElementById('routes');if(rz&&Array.isArray(w.data)&&Array.isArray(w.OPS)){const groups=new Map();for(const r of w.data){if(r.zone&&r.zone!=='غير مصنف'){if(!groups.has(r.zone))groups.set(r.zone,[]);groups.get(r.zone).push(r)}}const ordered=[...groups.entries()].sort((a,b)=>w.OPS.findIndex(x=>x[0]===a[0])-w.OPS.findIndex(x=>x[0]===b[0]));rz.innerHTML=ordered.map(([z,rs],zi)=>{const by=new Map();for(const r of rs)if(!by.has(r.order))by.set(r.order,r);const stops=[...by.values()];return `<div class="route" style="border-right:4px solid hsl(${(zi*37)%360} 85% 55%)"><div class="routeTop"><span class="rn">${w.OPS.findIndex(x=>x[0]===z)+1}</span><strong>${esc(z)}</strong><span class="vehicle">${stops.length} Orders</span></div>${stops.map((r,i)=>`<div class="stop"><span class="stopno">${i+1}</span><strong>${esc(r.order)}</strong> · ${esc(r.customer)} · ${esc(r.phone)}<br><span class="muted">${esc(r.address)}</span></div>`).join('')}</div>`}).join('')||'<div class="empty">لا توجد مناطق مصنفة في الداتا الحالية</div>'}
   drawMap();
  }catch(e){console.error(e)}
 }
 function drawMap(){if(!w.L||!w.map||!Array.isArray(w.data)||!Array.isArray(w.OPS))return;if(w.__repairLayers)w.__repairLayers.forEach(x=>{try{x.remove()}catch(e){}});w.__repairLayers=[];const colors=['#ff7900','#45d69c','#6ea8ff','#d86eff','#ffd166','#00c2ff','#ff5c8a','#8be28b','#b49cff','#f29f67'];const wh=[w.W.lat,w.W.lng];const grouped=new Map();for(const r of w.data){if(r.zone&&r.zone!=='غير مصنف'){if(!grouped.has(r.zone))grouped.set(r.zone,[]);grouped.get(r.zone).push(r)}}let bounds=[wh];w.__repairLayers.push(w.L.marker(wh).addTo(w.map).bindPopup('<b>Warehouse · 0</b><br>15 May'));[...grouped.entries()].sort((a,b)=>w.OPS.findIndex(x=>x[0]===a[0])-w.OPS.findIndex(x=>x[0]===b[0])).forEach(([z,rs],zi)=>{const op=w.OPS.find(x=>x[0]===z),color=colors[zi%colors.length],seen=new Map();for(const r of rs)if(!seen.has(r.order))seen.set(r.order,r);const stops=[...seen.values()].map(r=>{const lat=Number.isFinite(r.lat)&&r.lat>20&&r.lat<35?r.lat:op[2],lng=Number.isFinite(r.lng)&&r.lng>20&&r.lng<40?r.lng:op[3];return{r,p:[lat,lng]}});const line=[wh,...stops.map(x=>x.p)];bounds.push(...line);w.__repairLayers.push(w.L.polyline(line,{color,weight:5,opacity:.8}).addTo(w.map));stops.forEach((x,i)=>{const m=w.L.circleMarker(x.p,{radius:8,color,fillColor:color,fillOpacity:.95,weight:2}).addTo(w.map);m.bindPopup(`<b>Zone ${w.OPS.findIndex(o=>o[0]===z)+1} · ${esc(z)}</b><br>Stop ${i+1}<br>Order: ${esc(x.r.order)}<br>Customer: ${esc(x.r.customer)}<br>Phone: ${esc(x.r.phone)}<br>Address: ${esc(x.r.address)}`);w.__repairLayers.push(m)})});if(bounds.length>1)w.map.fitBounds(bounds,{padding:[25,25]})}
 if(!w.__repairInstalled){w.__repairInstalled=true;if(typeof originalRender==='function'){w.render=function(){originalRender();setTimeout(apply,30)}}loadFresh()}else apply();
}
frame.addEventListener('load',()=>setTimeout(patch,500));setTimeout(()=>{try{patch()}catch(e){}},1200);setInterval(()=>{try{patch()}catch(e){}},5000);
</script></body></html>
