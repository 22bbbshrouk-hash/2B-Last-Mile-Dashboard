<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2B Last Mile Operations Control Tower</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07090d}iframe{width:100%;height:100%;border:0}</style></head><body><iframe id="app" src="dashboard-final-20260829.html?v=maproute0829"></iframe><script>
const frame=document.getElementById('app');
function patch(){const w=frame.contentWindow,d=frame.contentDocument;if(!w||!d||!w.L)return;function distance(a,b){const dx=(a[0]-b[0])*111,dy=(a[1]-b[1])*96;return Math.sqrt(dx*dx+dy*dy)}function patchUI(){const kv=d.getElementById('kv');if(kv)kv.textContent=(w.vehicles(w.data)||0)+' Dabbaba';const routes=d.getElementById('routes');if(routes)[...routes.querySelectorAll('.route')].forEach((el,i)=>{const hue=(i*37)%360;el.style.borderRight='4px solid hsl('+hue+' 85% 55%)';el.querySelectorAll('.stopno').forEach((s,j)=>{s.textContent=j+1;s.style.background='hsl('+hue+' 25% 16%)';s.style.color='hsl('+hue+' 85% 65%)'});});drawColoredRoute()}function drawColoredRoute(){if(!w.map)return;if(w.__routeLayers)w.__routeLayers.forEach(x=>x.remove());w.__routeLayers=[];const groups={};(w.data||[]).forEach(r=>{if(r.zone!=='غير مصنف')(groups[r.zone]??=[]).push(r)});const colors=['#ff7900','#45d69c','#6ea8ff','#d86eff','#ffd166','#00c2ff','#ff5c8a','#8be28b','#b49cff','#f29f67'];const ops=w.OPS,warehouse=[w.W.lat,w.W.lng];let all=[warehouse],previous=warehouse;Object.entries(groups).sort((a,b)=>ops.findIndex(x=>x[0]===a[0])-ops.findIndex(x=>x[0]===b[0])).forEach(([z,rs],zi)=>{const o=ops.find(x=>x[0]===z);let uniq=[...new Map(rs.map(r=>[r.order,r])).values()];uniq=uniq.map(r=>{const lat=Number.isFinite(r.lat)&&r.lat>20&&r.lat<35?r.lat:o[2],lng=Number.isFinite(r.lng)&&r.lng>20&&r.lng<40?r.lng:o[3];return{r,p:[lat,lng]}});let remaining=uniq.slice(),pts=[previous];while(remaining.length){let next=remaining.reduce((best,x)=>!best||distance(pts[pts.length-1],x.p)<distance(pts[pts.length-1],best.p)?x:best,null);pts.push(next.p);all.push(next.p);remaining=remaining.filter(x=>x!==next)}const color=colors[zi%colors.length];w.__routeLayers.push(w.L.polyline(pts,{color,weight:5,opacity:.82}).addTo(w.map));pts.slice(1).forEach((p,j)=>w.__routeLayers.push(w.L.circleMarker(p,{radius:6,color,fillColor:color,fillOpacity:.9,weight:2}).addTo(w.map)));previous=pts[pts.length-1]||[o[2],o[3]]});if(all.length>1)w.map.fitBounds(all,{padding:[25,25]})}patchUI();if(!w.__patchedRender){const oldRender=w.render;w.render=function(){oldRender();setTimeout(patchUI,50)};w.__patchedRender=true}}
frame.addEventListener('load',()=>setTimeout(patch,300));setInterval(()=>{try{patch()}catch(e){}},2500);
</script></body></html>
