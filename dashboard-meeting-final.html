<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2B | Last Mile Operations Control Tower</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%2307090d'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-family='Arial' font-size='30' font-weight='900' fill='%23ff7900'%3E2B%3C/text%3E%3C/svg%3E"><style>html,body{margin:0;width:100%;height:100%;background:#07090d}iframe{border:0;width:100%;height:100%;display:block}.noteBlue{color:#4da6ff;font-weight:800}.ordersList{margin-top:8px;padding:8px 10px;border:1px solid #26313d;border-radius:8px;background:#0a0f15;font-size:10px;line-height:1.8;direction:rtl}.ordersList b{color:#ff7900}</style></head><body><iframe id="dash" src="./dashboard-final.html?v=meeting-v5" title="2B Last Mile Dashboard"></iframe><script>(function(){const f=document.getElementById('dash');const PUBLIC='https://wihopmnjpsfsgujugyzl.supabase.co/storage/v1/object/public/dashboard-data/Last_Mile_Data.xlsx';const groups=[['New Cairo',['القاهرة الجديدة','التجمع','التجمع الاول','التجمع الأول','التجمع الثالث','التجمع الخامس','الرحاب']],['East Cairo',['العبور','الشروق','مدينتي','العاصمة الادارية الجديدة','العاصمة الإدارية الجديدة','بدر']],['Nasr City / Heliopolis',['مدينة نصر','مصر الجديدة','النزهة','روكسي','جسر السويس','حدائق القبة','الزيتون','المطرية','عين شمس','عين شمس- الشرقية','عزبة النخل']],['Central Cairo',['وسط البلد','باب الشعرية','الضاهر','دار السلام','شبرا مصر','السيدة زينب']],['Mohandeseen / Ard El Lewa',['المهندسين','أرض اللواء','ارض اللواء','الزمالك','بولاق الدكرور']],['Haram / Faisal',['الهرم','فيصل','ترسا','الجيزة','العمرانية']],['October / Zayed',['حدائق أكتوبر','حدائق اكتوبر','6 أكتوبر','السادس من أكتوبر','الشيخ زايد','زايد','حدائق الأهرام','حدائق الاهرام']],['Maadi / Helwan / Mokattam',['المعادي','المعادى','حلوان','15 مايو','مايو','المقطم','زهراء المعادي']],['Old Cairo',['مصر القديمة','السيدة عائشة']],['North East',['الخانكة','المرج']],['North Coast',['الساحل الشمالى','الساحل الشمالي']]];function n(s){return String(s??'').normalize('NFKC').toLowerCase().replace(/[\u064B-\u065F\u0670]/g,'').replace(/[\s_\-()./]/g,'').replace(/ى/g,'ي').replace(/ة/g,'ه').trim()}function lev(a,b){let p=Array(b.length+1).fill(0).map((_,i)=>i);for(let i=1;i<=a.length;i++){let q=[i];for(let j=1;j<=b.length;j++)q[j]=Math.min(q[j-1]+1,p[j]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=q}return p[b.length]}const aliases=[];groups.forEach(([z,as])=>as.forEach(a=>aliases.push([n(a),a,z])));function canonical(a){let x=n(a),e=aliases.find(q=>q[0]===x);if(e)return e[1];let best=null,bd=99;aliases.forEach(q=>{let d=lev(x,q[0]);if(d<bd&&d<=Math.max(1,Math.floor(Math.min(x.length,q[0].length)*.25))){bd=d;best=q}});return best?best[1]:(String(a||'غير محدد').trim()||'غير محدد')}function zone(a){let c=n(canonical(a)),e=aliases.find(q=>q[0]===c);return e?e[2]:'غير مصنف'}function esc(s){return String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]))}function pick(r,ks){for(const k of ks){if(r[k]!=null&&String(r[k]).trim()!=='')return r[k]}return ''}function normalizeRaw(raw){return raw.map(r=>{const x={};for(const k in r)x[n(k)]=r[k];const order=pick(x,['order','ordernumber','orderno','awb','shipment','shipmentnumber','ordernumberid','رقمالطلب','الطلب']);const area=pick(x,['area','areaname','region','zonearea','المنطقه','المنطقة','area_name']);const sku=pick(x,['sku','skucode','productsku','رمزالصنف']);const product=pick(x,['product','productname','item','description','المنتج']);const qty=Number(pick(x,['qty','quantity','الكمية','الكميه']))||1;const status=pick(x,['status','stat','delivery_status','shipmentstatus','الحاله','الحالة']);const address=pick(x,['address','customeraddress','deliveryaddress','customer_address','العنوان','عنوان']);const feedback=pick(x,['feedback','customerfeedback','feedback1','feedback2','customer_feedback','ملاحظات','الملاحظات']);const alt=pick(x,['alternatenumber','alternativephone','alternatephone','altphone','رقمبديل','رقمبديلالاستلام']);const note=pick(x,['note','notes','customernote','deliverynote','receivingnote','ملاحظه','ملاحظاتالاستلام']);return {order:String(order).trim(),area:canonical(area),zone:zone(area),sku:String(sku).trim(),product:String(product).trim(),qty,status:String(status).trim(),address:String(address).trim(),feedback:String(feedback).trim(),alt:String(alt).trim(),note:String(note).trim()}}).filter(r=>r.order)}async function getRows(){try{const r=await fetch(PUBLIC+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error();const b=await r.arrayBuffer();const XLSX=f.contentWindow.XLSX||window.XLSX;if(!XLSX)throw Error();const wb=XLSX.read(b,{type:'array'});return normalizeRaw(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''}))}catch(e){return []}}async function patch(){try{const d=f.contentDocument;if(!d)return;const rws=await getRows();if(!rws.length)return;const map2=d.getElementById('map2');if(map2){const sec=map2.closest('section');if(sec)sec.remove()}const rank=d.getElementById('areaRank');if(rank){const m=new Map();rws.forEach(r=>{let k=n(r.area);if(!m.has(k))m.set(k,{name:r.area,orders:new Set()});m.get(k).orders.add(r.order)});const a=[...m.values()].sort((x,y)=>y.orders.size-x.orders.size||x.name.localeCompare(y.name,'ar'));const mx=Math.max(1,...a.map(x=>x.orders.size));rank.innerHTML=a.map(x=>'<div class="areaRow"><div class="areaName">'+esc(x.name)+'</div><div class="barbg"><div class="barfill" style="width:'+(x.orders.size/mx*100)+'%"></div></div><div class="count">'+x.orders.size+'</div></div>').join('')||'<div class="empty">لا توجد بيانات</div>'}const det=d.getElementById('details');if(det){const sec=det.closest('section'),sub=sec&&sec.querySelector('.sub');if(sub)sub.textContent='كل Area متجمعة، وكل Orders الخاصة بها تحت بعض، والعنوان مرتب مع كل طلب.';const th=det.closest('table').querySelector('thead tr');if(th)th.innerHTML='<th>Trip Zone</th><th>Area</th><th>Order</th><th>Address</th><th>SKU</th><th>Product</th><th>QTY</th>';const m=new Map();rws.forEach(r=>{const k=[n(r.zone),n(r.area),r.order,n(r.address),n(r.sku),n(r.product)].join('|');if(!m.has(k))m.set(k,{...r});else m.get(k).qty+=r.qty});const a=[...m.values()].sort((x,y)=>x.zone.localeCompare(y.zone,'ar')||x.area.localeCompare(y.area,'ar')||x.order.localeCompare(y.order,'ar',{numeric:true})||x.address.localeCompare(y.address,'ar')||x.sku.localeCompare(y.sku,'ar'));det.innerHTML=a.map(r=>'<tr><td>'+esc(r.zone)+'</td><td>'+esc(r.area)+'</td><td>'+esc(r.order)+'</td><td>'+esc(r.address)+'</td><td>'+esc(r.sku)+'</td><td>'+esc(r.product)+'</td><td>'+esc(r.qty)+'</td></tr>').join('')||'<tr><td colspan="7" class="empty">لا توجد بيانات</td></tr>'}const follow=d.getElementById('follow');if(follow){const important=new Set(['outfordelivery','readyfordelivery','assigned','pickedup','delivered','noanswer','cancelled','canceled','returned','return','refused','failed']);const m=new Map();rws.forEach(r=>{const detail=[r.feedback,r.alt,r.note].filter(Boolean).join(' | ');if(!m.has(r.order)||(!m.get(r.order)._detail&&detail))m.set(r.order,{...r,_detail:detail})});const th=follow.closest('table').querySelector('thead tr');if(th)th.innerHTML='<th>Order</th><th>Zone</th><th>Area</th><th>Address</th><th>Status</th><th>Feedback / Important Detail</th>';const a=[...m.values()].filter(r=>important.has(n(r.status))||r._detail).sort((x,y)=>x.order.localeCompare(y.order,'ar',{numeric:true}));follow.innerHTML=a.map(r=>'<tr><td>'+esc(r.order)+'</td><td>'+esc(r.zone)+'</td><td>'+esc(r.area)+'</td><td>'+esc(r.address)+'</td><td><span class="tag">'+esc(r.status)+'</span></td><td class="noteBlue">'+esc(r._detail)+'</td></tr>').join('')||'<tr><td colspan="6" class="empty">لا توجد متابعة مهمة أو ملاحظات</td></tr>';const sec=follow.closest('section'),sub=sec&&sec.querySelector('.sub');if(sub)sub.textContent='الطلب · المنطقة · العنوان · الحالة · Feedback (لو موجود).'}const route=d.getElementById('routes');if(route){const zm=new Map();rws.forEach(r=>{if(r.zone==='غير مصنف')return;if(!zm.has(r.zone))zm.set(r.zone,{areas:new Set(),orders:new Set(),sku:new Set(),qty:0,ac:0});const z=zm.get(r.zone);z.areas.add(r.area);z.orders.add(r.order);if(r.sku)z.sku.add(r.sku);z.qty+=r.qty;if(/\bac\b|air\s*condition|تكييف/i.test(r.product))z.ac+=r.qty});route.innerHTML=[...zm].map(([z,v],i)=>{const orders=[...v.orders].sort((a,b)=>a.localeCompare(b,'ar',{numeric:true}));return '<div class="routeCard"><div class="routeHead"><div><div class="routeTitle">🛣️ Route '+String(i+1).padStart(2,'0')+' — '+esc(z)+'</div><div class="muted">Areas: '+esc([...v.areas].join(' · '))+'</div><div class="muted">Orders: <b>'+v.orders.size+'</b> · SKU: <b>'+v.sku.size+'</b> · QTY: <b>'+v.qty+'</b> · AC: <b>'+v.ac+'</b> / 13 per دبابة</div><div class="ordersList"><b>Order Numbers:</b> '+orders.map(esc).join(' · ')+'</div></div><div class="vehicle">🚚 '+Math.max(1,Math.ceil(v.ac/13))+' Vehicle'+(v.ac>13?'s':'')+'</div></div></div>'}).join('')||'<div class="empty">لا توجد بيانات</div>'}}catch(e){console.warn('meeting v5 patch',e)}}f.addEventListener('load',()=>{setTimeout(patch,1500);setTimeout(patch,3000);setTimeout(patch,5500);setInterval(patch,5000)})})();</script></body></html>
