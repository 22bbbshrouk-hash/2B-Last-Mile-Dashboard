<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2B | Last Mile Operations Control Tower</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%2307090d'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-family='Arial' font-size='30' font-weight='900' fill='%23ff7900'%3E2B%3C/text%3E%3C/svg%3E"><style>html,body{margin:0;width:100%;height:100%;background:#07090d}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="dash" src="./dashboard-final.html?v=meeting-base-20260820" title="2B Last Mile Dashboard"></iframe><script>(function(){const f=document.getElementById('dash');function patch(){try{const w=f.contentWindow,d=f.contentDocument;if(!w||!d||!w.XLSX)return;const rows=w.eval('rows');if(!Array.isArray(rows)||!rows.length)return;const esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));const n=s=>String(s??'').toLowerCase().normalize('NFKC').replace(/[\s_\-()./]/g,'').replace(/[\u064B-\u065F\u0670]/g,'').replace(/ى/g,'ي').replace(/ة/g,'ه').trim();const unique=new Map();rows.forEach(r=>{const k=n(r.area);if(!unique.has(k))unique.set(k,{name:r.area,orders:new Set()});unique.get(k).orders.add(r.order)});const rank=d.getElementById('areaRank');if(rank){const a=[...unique.values()].sort((x,y)=>y.orders.size-x.orders.size||x.name.localeCompare(y.name,'ar'));const mx=Math.max(1,...a.map(x=>x.orders.size));rank.innerHTML=a.map(x=>'<div class="areaRow"><div class="areaName">'+esc(x.name)+'</div><div class="barbg"><div class="barfill" style="width:'+(x.orders.size/mx*100)+'%"></div></div><div class="count">'+x.orders.size+'</div></div>').join('')}const follow=d.getElementById('follow');if(follow){const important=new Set(['outfordelivery','readyfordelivery','assigned','pickedup','delivered','noanswer','cancelled','canceled','returned','return','refused','failed']);const m=new Map();rows.forEach(r=>{if(!important.has(n(r.status)))return;if(!m.has(r.order)||(!m.get(r.order).feedback&&r.feedback))m.set(r.order,r)});const a=[...m.values()].sort((x,y)=>String(x.order).localeCompare(String(y.order)));follow.innerHTML=a.map(r=>'<tr><td>'+esc(r.order)+'</td><td>'+esc(r.zone)+'</td><td>'+esc(r.area)+'</td><td>'+esc(r.address)+'</td><td><span class="tag">'+esc(r.status)+'</span></td><td>'+(r.feedback?esc(r.feedback):'')+'</td></tr>').join('')||'<tr><td colspan="6" class="empty">لا توجد بيانات متابعة مهمة</td></tr>';const h=follow.closest('section');if(h){const sub=h.querySelector('.sub');if(sub)sub.textContent='الطلب · المنطقة · العنوان · الحالة · Feedback (لو موجود).'}}const map=d.getElementById('map2');if(map&&w.L){if(w.__meetingMap2){w.__meetingMap2.remove();w.__meetingMap2=null}map.innerHTML='';const groups=w.groups||[];const coords=w.coords||{};const zmap=new Map();rows.forEach(r=>{if(!zmap.has(r.zone))zmap.set(r.zone,{areas:new Set(),orders:new Set()});const z=zmap.get(r.zone);z.areas.add(r.area);z.orders.add(r.order)});const center=[30.03,31.25];const mp=w.L.map(map).setView(center,10);w.L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(mp);const palette=['#ff7900','#27a7ff','#45d69c','#c77dff','#ff5d66','#ffd166','#00c2a8','#f78fb3','#8bd450','#9aa7ff'];let idx=0;zmap.forEach((z,name)=>{const pts=[...z.areas].map(a=>coords[a]).filter(Boolean);if(!pts.length)return;const color=palette[idx%palette.length];idx++;const avg=[pts.reduce((s,p)=>s+p[0],0)/pts.length,pts.reduce((s,p)=>s+p[1],0)/pts.length];w.L.circleMarker(avg,{radius:12,weight:3,color,fillColor:color,fillOpacity:.45}).addTo(mp).bindPopup('<b>'+esc(name)+'</b><br>Areas: '+esc([...z.areas].join(' · '))+'<br>Unique Orders: '+z.orders.size);if(pts.length>1)w.L.polyline(pts,{color,weight:3,opacity:.8}).addTo(mp)});w.__meetingMap2=mp;setTimeout(()=>mp.invalidateSize(),250)}}catch(e){console.warn('meeting patch',e)}}f.addEventListener('load',()=>{setTimeout(patch,1800);setTimeout(patch,3500);setTimeout(patch,6000);setInterval(patch,2500)});})();</script></body></html>
