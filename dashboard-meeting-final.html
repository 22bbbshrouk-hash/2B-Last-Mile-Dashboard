<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2B | Last Mile Operations Control Tower</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%2307090d'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-family='Arial' font-size='30' font-weight='900' fill='%23ff7900'%3E2B%3C/text%3E%3C/svg%3E"><style>html,body{margin:0;width:100%;height:100%;background:#07090d}iframe{border:0;width:100%;height:100%;display:block}.noteBlue{color:#4da6ff;font-weight:800}.ordersList{margin-top:8px;padding:8px 10px;border:1px solid #26313d;border-radius:8px;background:#0a0f15;font-size:10px;line-height:1.8}</style></head><body><iframe id="dash" src="./dashboard-final.html?v=meeting-v4" title="2B Last Mile Dashboard"></iframe><script>(function(){const f=document.getElementById('dash');const groups=[['New Cairo',['القاهرة الجديدة','التجمع','التجمع الاول','التجمع الأول','التجمع الثالث','التجمع الخامس','الرحاب']],['East Cairo',['العبور','الشروق','مدينتي','العاصمة الادارية الجديدة','العاصمة الإدارية الجديدة','بدر']],['Nasr City / Heliopolis',['مدينة نصر','مصر الجديدة','النزهة','روكسي','جسر السويس','حدائق القبة','الزيتون','المطرية','عين شمس','عين شمس- الشرقية','عزبة النخل']],['Central Cairo',['وسط البلد','باب الشعرية','الضاهر','دار السلام','شبرا مصر','السيدة زينب']],['Mohandeseen / Ard El Lewa',['المهندسين','أرض اللواء','ارض اللواء','الزمالك','بولاق الدكرور']],['Haram / Faisal',['الهرم','فيصل','ترسا','الجيزة','العمرانية']],['October / Zayed',['حدائق أكتوبر','حدائق اكتوبر','6 أكتوبر','السادس من أكتوبر','الشيخ زايد','زايد','حدائق الأهرام','حدائق الاهرام']],['Maadi / Helwan / Mokattam',['المعادي','المعادى','حلوان','15 مايو','مايو','المقطم','زهراء المعادي']],['Old Cairo',['مصر القديمة','السيدة عائشة']],['North East',['الخانكة','المرج']],['North Coast',['الساحل الشمالى','الساحل الشمالي']]];function n(s){return String(s??'').normalize('NFKC').toLowerCase().replace(/[\u064B-\u065F\u0670]/g,'').replace(/[\s_\-()./]/g,'').replace(/ى/g,'ي').replace(/ة/g,'ه').trim()}function lev(a,b){let p=Array(b.length+1).fill(0).map((_,i)=>i);for(let i=1;i<=a.length;i++){let q=[i];for(let j=1;j<=b.length;j++)q[j]=Math.min(q[j-1]+1,p[j]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=q}return p[b.length]}const aliases=[];groups.forEach(([z,as])=>as.forEach(a=>aliases.push([n(a),a,z])));function canonical(a){let x=n(a),e=aliases.find(q=>q[0]===x);if(e)return e[1];let best=null,bd=99;aliases.forEach(q=>{let d=lev(x,q[0]);if(d<bd&&d<=Math.max(1,Math.floor(Math.min(x.length,q[0].length)*.25))){bd=d;best=q}});return best?best[1]:(String(a||'غير محدد').trim()||'غير محدد')}function zone(a){let c=n(canonical(a)),e=aliases.find(q=>q[0]===c);return e?e[2]:'غير مصنف'}function esc(s){return String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]))}function val(r,ks){for(const k of ks){let v=r[k];if(v!=null&&String(v).trim()!=='')return v}return ''}function patch(){try{const w=f.contentWindow,d=f.contentDocument;if(!w||!d)return;const rows=w.eval('rows');if(!Array.isArray(rows)||!rows.length)return;const rws=rows.map(r=>({...r,area:canonical(r.area),zone:zone(r.area)}));const map2=d.getElementById('map2');if(map2){const sec=map2.closest('section');if(sec)sec.remove()}const rank=d.getElementById('areaRank');if(rank){const m=new Map();rws.forEach(r=>{let k=n(r.area);if(!m.has(k))m.set(k,{name:r.area,orders:new Set()});m.get(k).orders.add(String(r.order))});const a=[...m.values()].sort((x,y)=>y.orders.size-x.orders.size||x.name.localeCompare(y.name,'ar'));const mx=Math.max(1,...a.map(x=>x.orders.size));rank.innerHTML=a.map(x=>'<div class="areaRow"><div class="areaName">'+esc(x.name)+'</div><div class="barbg"><div class="barfill" style="width:'+(x.orders.size/mx*100)+'%"></div></div><div class="count">'+x.orders.size+'</div></div>').join('')||'<div class="empty">لا توجد بيانات</div>'}const zsum=d.getElementById('zoneSummary');if(zsum){const zm=new Map();rws.forEach(r=>{if(r.zone==='غير مصنف')return;if(!zm.has(r.zone))zm.set(r.zone,{areas:new Set(),orders:new Set(),sku:new Set(),qty:0,ac:0});let z=zm.get(r.zone);z.areas.add(r.area);z.orders.add(String(r.order));if(r.sku)z.sku.add(String(r.sku));z.qty+=Number(r.qty)||0;if(/\bac\b|air\s*condition|تكييف/i.test(String(r.product)))z.ac+=Number(r.qty)||0});zsum.innerHTML=[...zm].map(([z,v])=>'<div class="zoneCard"><div class="zoneTitle">'+esc(z)+'</div><div class="muted">'+esc([...v.areas].join(' · '))+'</div><div class="muted">Orders <b>'+v.orders.size+'</b> · SKU <b>'+v.sku.size+'</b> · QTY <b>'+v.qty+'</b> · AC <b>'+v.ac+'</b> · Vehicles <b>'+Math.max(1,Math.ceil(v.ac/13))+'</b></div></div>').join('')||'<div class="empty">لا توجد بيانات</div>'}const det=d.getElementById('details');if(det){const sec=det.closest('section');const sub=sec&&sec.querySelector('.sub');if(sub)sub.textContent='كل Area متجمعة، والـOrders الخاصة بها تحت بعض، والعنوان مرتب مع كل طلب.';const th=det.closest('table').querySelector('thead tr');if(th)th.innerHTML='<th>Trip Zone</th><th>Area</th><th>Order</th><th>Address</th><th>SKU</th><th>Product</th><th>QTY</th>';const m=new Map();rws.forEach(r=>{let k=[n(r.zone),n(r.area),String(r.order),n(r.address),String(r.sku),n(r.product)].join('|');if(!m.has(k))m.set(k,{...r,qty:Number(r.qty)||0});else m.get(k).qty+=Number(r.qty)||0});const a=[...m.values()].sort((x,y)=>x.zone.localeCompare(y.zone,'ar')||x.area.localeCompare(y.area,'ar')||String(x.order).localeCompare(String(y.order),'ar',{numeric:true})||String(x.address).localeCompare(String(y.address),'ar')||String(x.sku).localeCompare(String(y.sku),'ar'));det.innerHTML=a.map(r=>'<tr><td>'+esc(r.zone)+'</td><td>'+esc(r.area)+'</td><td>'+esc(r.order)+'</td><td>'+esc(r.address)+'</td><td>'+esc(r.sku)+'</td><td>'+esc(r.product)+'</td><td>'+esc(r.qty)+'</td></tr>').join('')||'<tr><td colspan="7" class="empty">لا توجد بيانات</td></tr>'}const follow=d.getElementById('follow');if(follow){const imp=new Set(['outfordelivery','readyfordelivery','assigned','pickedup','delivered','noanswer','cancelled','canceled','returned','return','refused','failed']);const m=new Map();rws.forEach(r=>{const feedback=val(r,['feedback','customerfeedback','feedback1','feedback2','ملاحظات','الملاحظات']);const alt=val(r,['alternatenumber','alternativephone','alternatephone','altphone','رقمبديل']);const note=val(r,['note','notes','customerNote','deliverynote','receivingnote','ملاحظه','ملاحظاتالاستلام']);const address=val(r,['address','customeraddress','deliveryaddress','العنوان']);const detail=[feedback,alt,note].filter(Boolean).join(' | ');if(!m.has(String(r.order))||(!m.get(String(r.order))._detail&&detail))m.set(String(r.order),{...r,_feedback:feedback,_detail:detail,_address:address})});const th=follow.closest('table').querySelector('thead tr');if(th)th.innerHTML='<th>Order</th><th>Zone</th><th>Area</th><th>Address</th><th>Status</th><th>Feedback / Important Detail</th>';const a=[...m.values()].filter(r=>imp.has(n(r.status))||r._detail).sort((x,y)=>String(x.order).localeCompare(String(y.order),'ar',{numeric:true}));follow.innerHTML=a.map(r=>'<tr><td>'+esc(r.order)+'</td><td>'+esc(r.zone)+'</td><td>'+esc(r.area)+'</td><td>'+esc(r._address||r.address)+'</td><td><span class="tag">'+esc(r.status)+'</span></td><td class="noteBlue">'+esc(r._detail)+'</td></tr>').join('')||'<tr><td colspan="6" class="empty">لا توجد متابعة مهمة أو ملاحظات</td></tr>';const sec=follow.closest('section');if(sec){const sub=sec.querySelector('.sub');if(sub)sub.textContent='الطلب · المنطقة · العنوان · الحالة · Feedback / أي ملاحظة مهمة (لو موجودة).'}}const feedback=d.getElementById('feedback');if(feedback){const sec=feedback.closest('section');if(sec)sec.remove()}const route=d.getElementById('routes');if(route){const zm=new Map();rws.forEach(r=>{if(r.zone==='غير مصنف')return;if(!zm.has(r.zone))zm.set(r.zone,{areas:new Set(),orders:new Set(),sku:new Set(),qty:0,ac:0});let z=zm.get(r.zone);z.areas.add(r.area);z.orders.add(String(r.order));if(r.sku)z.sku.add(String(r.sku));z.qty+=Number(r.qty)||0;if(/\bac\b|air\s*condition|تكييف/i.test(String(r.product)))z.ac+=Number(r.qty)||0});route.innerHTML=[...zm].map(([z,v],i)=>{const orders=[...v.orders].sort((a,b)=>a.localeCompare(b,'ar',{numeric:true}));return '<div class="routeCard"><div class="routeHead"><div><div class="routeTitle">🛣️ Route '+String(i+1).padStart(2,'0')+' — '+esc(z)+'</div><div class="muted">Areas: '+esc([...v.areas].join(' · '))+'</div><div class="muted">Orders <b>'+v.orders.size+'</b> · SKU <b>'+v.sku.size+'</b> · QTY <b>'+v.qty+'</b> · AC <b>'+v.ac+'</b> / 13 per دبابة</div><div class="ordersList"><b>Orders:</b> '+orders.map(esc).join(' · ')+'</div></div><div class="vehicle">🚚 '+Math.max(1,Math.ceil(v.ac/13))+' Vehicle'+(v.ac>13?'s':'')+'</div></div></div>'}).join('')||'<div class="empty">لا توجد بيانات</div>'}}catch(e){console.warn('meeting v4 patch',e)}}f.addEventListener('load',()=>{setTimeout(patch,1500);setTimeout(patch,3000);setTimeout(patch,5500);setInterval(patch,3000)})})();</script></body></html>
